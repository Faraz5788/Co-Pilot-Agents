<title>Circle Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone-first app shell (max 760px) — sticky header + tabs, content panel, floating Add button */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --sunk:#E6ECF1; --ink:#1A2836; --muted:#5A6B7A; --line:#D3DCE4;
  --accent:#1F4E79; --accent-ink:#FFFFFF;
  --c0:#23867C; --c1:#8656BF; --c2:#C0473F; --c3:#2F6FB5; --c4:#5E8A1E; --c5:#B4579A; --fam:#B97C12; --warn:#B4532A;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#16212C; --sunk:#1E2B38; --ink:#E5ECF2; --muted:#93A4B3; --line:#2A3A49;
  --accent:#86B6E6; --accent-ink:#0E1620; --c0:#4FC2B6; --c1:#B590EA; --c2:#EE7D73; --c3:#7FB0EA; --c4:#9CC75A; --c5:#E28CC8; --fam:#E4AE4C; --warn:#EC8B62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#16212C; --sunk:#1E2B38; --ink:#E5ECF2; --muted:#93A4B3; --line:#2A3A49;
  --accent:#86B6E6; --accent-ink:#0E1620; --c0:#4FC2B6; --c1:#B590EA; --c2:#EE7D73; --c3:#7FB0EA; --c4:#9CC75A; --c5:#E28CC8; --fam:#E4AE4C; --warn:#EC8B62; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand h1{font-family:var(--display);font-weight:700;font-size:1.55rem;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand h1 .pair{display:inline-flex;gap:3px;margin-right:8px;vertical-align:middle}
.brand h1 .pair i{width:10px;height:10px;border-radius:50%;display:block}
.sub{color:var(--muted);font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status[data-s="live"]::before{background:var(--c0)}
.status[data-s="warn"]::before{background:var(--warn)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.85rem;font-weight:600}
.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.lock{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;background:var(--sunk);color:var(--muted);padding:2px 6px;border-radius:999px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.k-fam{--k:var(--fam)}
.dot{background:var(--k,var(--muted))}

.banner{margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--sunk);font-size:.88rem;color:var(--muted)}
.banner b{color:var(--ink)}

/* summary */
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px;font-size:.9rem;color:var(--muted)}
.summary strong{color:var(--ink);font-variant-numeric:tabular-nums}
.summary .warnpill{color:var(--warn);font-weight:600}

/* agenda */
.day{margin-top:18px}
.dayhead{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.dayhead h3{font-family:var(--display);font-weight:500;font-size:1.05rem;margin:0}
.dayhead span{color:var(--muted);font-size:.82rem}
.list{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:58px 1fr;gap:10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;position:relative;overflow:hidden}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--stripe,var(--line))}
.ev-time{font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem;padding-top:1px}
.ev-time small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.ev-main{min-width:0;display:flex;flex-direction:column;gap:5px}
.ev-title{font-weight:600;overflow-wrap:anywhere}
.ev-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 6px;border-radius:999px;background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--ink);font-weight:600}
.tag{padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.tag.warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn);font-weight:600}
.tag.done{background:var(--sunk)}
.ev-note{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.ev-note b{color:var(--ink);font-weight:600}
.ex{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.empty{margin-top:28px;padding:26px 18px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty h3{font-family:var(--display);font-weight:500;color:var(--ink);margin:0 0 6px}

/* month */
.mhead{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px;gap:8px}
.mhead h2{font-family:var(--display);font-weight:500;font-size:1.25rem;margin:0}
.mnav{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding-bottom:4px}
.cell{min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.out{background:transparent;opacity:.55}
.cell .n{font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.cell.today .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;width:22px;height:22px;display:grid;place-items:center}
.cell.sel{outline:2px solid var(--ink);outline-offset:-1px}
.cell .marks{display:flex;flex-wrap:wrap;gap:3px;min-width:0;width:100%}
.cell .lbl{max-width:100%}
.cell .lbl{display:none}
@media (min-width:600px){
  .cell{min-height:88px}
  .cell .marks{flex-direction:column;gap:2px}
  .cell .lbl{display:block;font-size:.7rem;line-height:1.25;padding:1px 5px;border-radius:4px;background:color-mix(in srgb,var(--k) 16%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .marks .dot{display:none}
  .cell .more{font-size:.68rem;color:var(--muted)}
}
.cell .more{font-size:.62rem;color:var(--muted)}

/* profiles */
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;margin-top:16px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 16px;font-weight:600;display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.profile{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.avatar{width:56px;height:56px;border-radius:50%;background:color-mix(in srgb,var(--k) 20%,transparent);color:var(--k);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.4rem}
.profile h2{font-family:var(--display);font-weight:700;margin:0;font-size:1.35rem}
.profile p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.stats{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--muted)}
.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:700}

/* premium */
.premium{margin-top:18px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.premium .mock{padding:16px;filter:blur(2.5px);opacity:.6;pointer-events:none;user-select:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.premium .mock div{background:var(--sunk);border-radius:10px;padding:12px;font-size:.85rem}
.premium .mock b{display:block;font-family:var(--display);font-size:1.2rem}
.premium .pitch{padding:18px;border-top:1px solid var(--line)}
.premium h2{font-family:var(--display);font-weight:700;margin:0 0 4px;font-size:1.3rem}
.premium ul{margin:10px 0 0;padding-left:18px;color:var(--muted)}
.premium li{margin:3px 0}

/* add button */
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:6;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 20px;font-weight:700;font-size:1rem;box-shadow:0 6px 18px rgb(0 0 0 / .22);display:inline-flex;gap:8px;align-items:center}
.fab svg{width:18px;height:18px}

/* dialogs */
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgb(10 18 28 / .45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.dlg header h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0}
.dlg .body{padding:6px 18px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.dlg footer{display:flex;gap:8px;justify-content:space-between;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field > span,.legend{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;min-width:0}
textarea{resize:vertical;min-height:70px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-height:44px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick label{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.88rem;cursor:pointer;background:var(--bg)}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){background:color-mix(in srgb,var(--k,var(--accent)) 16%,var(--surface));border-color:var(--k,var(--accent))}
.pick label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.btn.danger.armed{background:var(--warn);color:var(--surface)}
.err{color:var(--warn);font-size:.85rem;min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.88rem;z-index:20}
@media (prefers-reduced-motion:no-preference){.ev,.cell,.chip,.tab{transition:background-color .15s,border-color .15s}}

/* calendars row + people */
.calrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}
.calrow .legend{margin-right:2px}
.chip.cal[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.chip.cal[aria-pressed="true"]{background:color-mix(in srgb,var(--k) 16%,var(--surface));color:var(--ink);border-color:var(--k)}
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.daystrip button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--muted);min-width:0}
.daystrip button b{font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.daystrip button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.daystrip button[aria-pressed="true"] b{color:var(--bg)}
.sched{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,150px) 1fr;gap:12px;padding:11px 14px;border-top:1px solid var(--line);align-items:start}
.srow:first-child{border-top:0}
.pname{display:flex;gap:8px;align-items:center;min-width:0;font-weight:600}
.pname span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.mini{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:color-mix(in srgb,var(--k) 22%,transparent);color:var(--k)}
.slots{display:flex;flex-direction:column;gap:5px;min-width:0}
.slot{display:flex;gap:8px;font-size:.86rem;min-width:0}
.slot .tm{font-variant-numeric:tabular-nums;color:var(--muted);flex:none;width:52px}
.slot .ti{overflow-wrap:anywhere}
.slot.busy .ti{font-style:italic;color:var(--muted)}
.free{color:var(--muted);font-size:.86rem}
.panel{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-family:var(--display);font-weight:500;font-size:1.1rem;margin:0}
.prow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0;padding-top:0}
.prow .pname{flex:1 1 180px}
.role{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.role.visit{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.role.ended{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%}
.ctrl select,.ctrl input{width:auto;flex:1 1 140px}
.hint{font-size:.82rem;color:var(--muted)}
.hint.warn{color:var(--warn)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.steps b{color:var(--ink)}
.copy{display:flex;gap:8px;flex-wrap:wrap}
.copy code{flex:1 1 200px;background:var(--sunk);border-radius:8px;padding:9px 10px;font-size:.8rem;overflow-wrap:anywhere;user-select:all}
.gate{margin-top:28px;padding:28px 20px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.prof-edit{display:flex;gap:8px;align-items:center}
.prof-edit input{flex:1 1 auto}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--k);flex:none}
.gate h2{font-family:var(--display);margin:0 0 6px}
@media (max-width:480px){.srow{grid-template-columns:1fr;gap:6px}}
</style>

<div class="app">
  <div class="top">
    <div class="brand">
      <div>
        <h1><span class="pair" aria-hidden="true"><i style="background:var(--c0)"></i><i style="background:var(--c1)"></i><i style="background:var(--fam)"></i></span><span id="groupTitle">Circle Planner</span></h1>
        <div class="sub"><span id="todayLbl"></span><span aria-hidden="true">·</span><span class="status" id="status" data-s="">Connecting…</span></div>
      </div>
      <button class="iconbtn" id="settingsBtn" type="button">Group</button>
    </div>
    <div class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" data-tab="upcoming" aria-selected="true">Upcoming</button>
      <button class="tab" role="tab" data-tab="month" aria-selected="false">Month</button>
      <button class="tab" role="tab" data-tab="profiles" aria-selected="false">Profiles</button>
      <button class="tab" role="tab" data-tab="people" aria-selected="false">People</button>
      <button class="tab" role="tab" data-tab="log" aria-selected="false">Daily log <span class="lock">Premium</span></button>
    </div>
  </div>
  <div id="bannerSlot"></div>
  <div id="filterSlot"></div>
  <main id="view"></main>
</div>

<button class="fab" id="addBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add</button>

<dialog id="evDlg" aria-labelledby="evDlgTitle">
  <form class="dlg" id="evForm" novalidate>
    <header><h2 id="evDlgTitle">New entry</h2><button type="button" class="iconbtn" data-close>Close</button></header>
    <div class="body">
      <label class="field"><span>What</span><input type="text" id="fTitle" maxlength="120" placeholder="e.g. Dentist, School play, Bin day" autocomplete="off"></label>
      <div class="field"><span class="legend">Who is it for</span><div class="pick" id="fWho"></div></div>
      <label class="check" id="privField" hidden><input type="checkbox" id="fPrivate"> Private: others only see "Busy"</label>
      <div class="field"><span class="legend">Type</span>
        <div class="pick" id="fType">
          <label><input type="radio" name="type" value="appointment" checked>Event</label>
          <label><input type="radio" name="type" value="keydate">Key date</label>
          <label><input type="radio" name="type" value="reminder">Reminder</label>
        </div>
      </div>
      <div class="row">
        <label class="field"><span>Date</span><input type="date" id="fDate"></label>
        <label class="field"><span>Time (optional)</span><input type="time" id="fTime"></label>
      </div>
      <label class="check"><input type="checkbox" id="fYearly"> Repeats every year (birthdays, anniversaries)</label>
      <label class="check"><input type="checkbox" id="fNeeds"> Someone needs to take them or sort it out</label>
      <div class="field" id="ownerField" hidden><span class="legend">Who's doing it</span><div class="pick" id="fOwner"></div></div>
      <label class="field"><span>Notes</span><textarea id="fNotes" maxlength="2000" placeholder="Address, what to bring, questions to ask"></textarea></label>
      <label class="field" id="outcomeField"><span>What happened (after)</span><textarea id="fOutcome" maxlength="2000" placeholder="Weight, what the doctor said, follow-ups"></textarea></label>
      <label class="check" id="doneField"><input type="checkbox" id="fDone"> Done</label>
      <div class="err" id="fErr" role="alert"></div>
    </div>
    <footer>
      <button type="button" class="btn danger" id="delBtn" hidden>Delete</button>
      <span></span>
      <button type="submit" class="btn primary" id="saveBtn">Save</button>
    </footer>
  </form>
</dialog>

<dialog id="setDlg" aria-labelledby="setDlgTitle">
  <form class="dlg" id="setForm" novalidate>
    <header><h2 id="setDlgTitle">Group settings</h2><button type="button" class="iconbtn" data-close>Close</button></header>
    <div class="body">
      <label class="field"><span>Group name</span><input type="text" id="sGroup" maxlength="40" placeholder="e.g. The Tak family, Flat 4, Book club"></label>
      <div class="field"><span class="legend">People you plan for</span>
        <p class="hint" style="margin:0">Kids, grandparents, pets, anyone who has appointments but doesn't use the app. People who share the planner are under People.</p>
        <div id="sProfiles" class="plist"></div>
        <div><button type="button" class="btn" id="sAddProfile">Add someone</button></div>
      </div>
      <div id="exampleBox" hidden>
        <p class="ev-note">Some entries are examples to show how the planner works.</p>
        <button type="button" class="btn danger" id="clearEx">Remove example entries</button>
      </div>
      <div class="err" id="sErr" role="alert"></div>
    </div>
    <footer><span></span><button type="submit" class="btn primary">Save</button></footer>
  </form>
</dialog>

<script>
(() => {
  const ARTIFACT_URL = "https://claude.ai/artifact/NQsiQw4pRcLMxmWEQnKTk4";
  // ---------- helpers ----------
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  const todayStr = () => ymd(new Date());
  const fmtDay = (s, opts = { weekday: "short", day: "numeric", month: "short" }) => parse(s).toLocaleDateString("en-GB", opts);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
      else if (k === "kcolor") el.style.setProperty("--k", v);
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
    return el;
  };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ---------- state ----------
  const DEFAULT_SETTINGS = { groupName: "", profiles: [], parents: {} };
  // older saves kept two fixed names under `kids`; read them as profiles
  const normalizeSettings = d => ({
    groupName: d?.groupName || "",
    profiles: Array.isArray(d?.profiles) ? d.profiles : d?.kids ? [{ id: "a", name: d.kids.a || "Person 1", color: 0 }, { id: "b", name: d.kids.b || "Person 2", color: 1 }] : [],
    parents: d?.parents || {}
  });
  const S = {
    events: new Map(),            // family calendar
    personal: new Map(),          // uid -> Map(id -> ev)
    members: new Map(),           // uid -> {nickname, shareMode, isOwner, joinedAt}
    access: new Map(),            // uid -> {role, until}
    profiles: {},
    settings: structuredClone(DEFAULT_SETTINGS),
    tab: "upcoming", filter: "all", month: null, selDay: todayStr(), kidView: null, peopleDay: todayStr(),
    hidden: new Set(store.get("tp-hidden-cals", [])),
    mode: "connecting", canWrite: true, db: null, user: null, me: null, isOwner: false, editing: null
  };
  { const t = parse(todayStr()); S.month = new Date(t.getFullYear(), t.getMonth(), 1); }

  const profiles = () => S.settings.profiles || [];
  const profileOf = k => profiles().find(p => p.id === k);
  const isMember = k => S.members.has(k);
  const kidName = k => k === "fam" ? "Whole group" : isMember(k) ? shortName(k) : (profileOf(k)?.name || "Someone");
  const profileColor = k => k === "fam" ? "var(--fam)" : isMember(k) ? personColor(k) : `var(--c${(profileOf(k)?.color ?? 0) % 6})`;
  const groupLabel = () => S.settings.groupName || "Group";
  const ownerName = o => {
    if (o === "all") return "Everyone";
    if (o === "both") return "Both of us";
    if (o === "p1" || o === "p2") return S.settings.parents?.[o] || (o === "p1" ? "Dad" : "Mum");
    return shortName(o);
  };
  const TYPE_LBL = { appointment: "Event", keydate: "Key date", reminder: "Reminder" };
  const PALETTE = ["#C2457A", "#3B78C4", "#4F8A2B", "#C0661F", "#6D5BD0", "#0F8A94"];
  const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const personColor = id => S.profiles[id]?.color || PALETTE[hash(id) % PALETTE.length];
  const personName = id => {
    const n = S.members.get(id)?.nickname || S.profiles[id]?.name || "";
    if (id === S.me) return n ? `${n} (you)` : "You";
    return n || "Someone";
  };
  const shortName = id => id === S.me ? "You" : (S.members.get(id)?.nickname || S.profiles[id]?.name || "Someone");

  // access state for a person
  function accessOf(id) {
    const m = S.members.get(id), a = S.access.get(id), t = todayStr();
    if (m?.isOwner) return { label: "Owner", cls: "", active: true };
    if (!a) return { label: "New · not set yet", cls: "", active: true, unset: true };
    if (a.role === "removed") return { label: "Removed", cls: "ended", active: false };
    if (a.role === "visitor") {
      if (a.until && a.until < t) return { label: `Visit ended ${fmtDay(a.until, { day: "numeric", month: "short" })}`, cls: "ended", active: false, ended: true };
      const left = a.until ? daysBetween(t, a.until) : null;
      return { label: a.until ? `Visiting until ${fmtDay(a.until, { day: "numeric", month: "short" })} · ${left === 0 ? "last day" : left + " day" + (left > 1 ? "s" : "") + " left"}` : "Visitor", cls: "visit", active: true };
    }
    return { label: "Family · ongoing", cls: "", active: true };
  }
  const myAccess = () => S.me ? accessOf(S.me) : { active: true };
  const locked = () => !S.isOwner && S.me && !myAccess().active;

  // dates an event lands on within [from, to]
  function datesFor(ev, from, to) {
    if (!ev.date) return [];
    if (!ev.yearly) return ev.date >= from && ev.date <= to ? [ev.date] : [];
    const out = [];
    for (let y = parse(from).getFullYear(); y <= parse(to).getFullYear(); y++) {
      let md = ev.date.slice(5); if (md === "02-29" && !(y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0))) md = "02-28";
      const d = `${y}-${md}`; if (d >= ev.date && d >= from && d <= to) out.push(d);
    }
    return out;
  }
  const sortOcc = (a, b) => a.date.localeCompare(b.date) || (a.ev.time || "").localeCompare(b.ev.time || "") || a.ev.title.localeCompare(b.ev.title);

  // everything shown in Upcoming / Month, respecting filters
  // one calendar: group entries plus older personal-calendar entries
  const allEvents = () => [...S.events.values(), ...[...S.personal.values()].flatMap(m => [...m.values()])];
  function visibleEv(ev) {
    if (ev.cal !== "family") return accessOf(ev.cal).active;
    const w = ev.who || [];
    return !(w.length && w.every(k => isMember(k) && !accessOf(k).active));
  }
  function occurrences(from, to) {
    const out = [];
    for (const ev of allEvents()) {
      if (!visibleEv(ev)) continue;
      if (S.filter !== "all" && !(ev.who || []).includes(S.filter)) continue;
      datesFor(ev, from, to).forEach(date => out.push({ ev, date }));
    }
    return out.sort(sortOcc);
  }
  const needsSomeone = ev => !!(ev.needsOwner && !ev.owner && !ev.done);
  const isBusyOnly = ev => (ev.private && ev.createdBy && ev.createdBy !== S.me) || (ev.cal !== "family" && ev.cal !== S.me && S.members.get(ev.cal)?.shareMode === "busy");
  const shownTitle = ev => isBusyOnly(ev) ? "Busy" : ev.title;
  const stripeFor = ev => {
    const w = (ev.who || []).filter(Boolean);
    if (!w.length) return "var(--fam)";
    if (w.length === 1) return profileColor(w[0]);
    return `linear-gradient(${profileColor(w[0])} 50%, ${profileColor(w[1])} 50%)`;
  };
  const whoChips = who => (who || []).map(k => h("span", { class: "who", kcolor: profileColor(k) }, h("span", { class: "dot" }), kidName(k)));
  const personChip = id => h("span", { class: "who", kcolor: personColor(id) }, h("span", { class: "dot" }), shortName(id));

  // ---------- rendering ----------
  function eventCard(ev, date) {
    const busy = isBusyOnly(ev);
    const meta = h("span", { class: "ev-meta" },
      whoChips(ev.who),
      !busy && ev.owner ? h("span", { class: "tag", text: `${ownerName(ev.owner)} on it` }) : null,
      needsSomeone(ev) ? h("span", { class: "tag warn", text: "Needs someone" }) : null,
      ev.private && !busy ? h("span", { class: "tag", text: "Private" }) : null,
      !busy && ev.type && ev.type !== "appointment" ? h("span", { class: "tag", text: TYPE_LBL[ev.type] || "" }) : null,
      !busy && ev.yearly ? h("span", { class: "tag", text: "Every year" }) : null,
      ev.done ? h("span", { class: "tag done", text: "Done" }) : null,
      ev.example ? h("span", { class: "ex", text: "Example" }) : null
    );
    const main = h("span", { class: "ev-main" }, h("span", { class: "ev-title", text: shownTitle(ev) }), meta);
    if (!busy) {
      if (ev.outcome) main.append(h("span", { class: "ev-note" }, h("b", { text: "Outcome: " }), ev.outcome));
      else if (ev.notes) main.append(h("span", { class: "ev-note", text: ev.notes }));
    }
    const btn = h("button", { class: "ev", type: "button", onclick: () => busy ? toast(`${shortName(ev.createdBy || ev.cal)} keeps this private`) : openEvent(ev.cal, ev.id) },
      h("span", { class: "ev-time" }, ev.time || "All day", date && S.tab !== "upcoming" ? h("small", { text: fmtDay(date, { day: "numeric", month: "short" }) }) : null),
      main);
    btn.style.setProperty("--stripe", stripeFor(ev));
    return btn;
  }

  function renderUpcoming(view) {
    const t = todayStr(), end = addDays(t, 90);
    const occ = occurrences(t, end).filter(o => !(o.ev.done && !o.ev.yearly));
    const week = occ.filter(o => o.date <= addDays(t, 6));
    const unassigned = occ.filter(o => needsSomeone(o.ev)).length;
    view.append(h("div", { class: "summary" },
      h("span", {}, "Next 7 days: ", h("strong", { text: String(week.length) }), week.length === 1 ? " entry" : " entries"),
      unassigned ? h("span", { class: "warnpill", text: `${unassigned} ${unassigned > 1 ? "entries need" : "entry needs"} someone to take care of it` }) : null));
    if (!occ.length) { view.append(emptyState()); return; }
    let cur = null, list;
    for (const o of occ) {
      if (o.date !== cur) {
        cur = o.date;
        const diff = daysBetween(t, o.date);
        const label = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : fmtDay(o.date, { weekday: "long" });
        list = h("div", { class: "list" });
        view.append(h("section", { class: "day" },
          h("div", { class: "dayhead" }, h("h3", { text: label }), h("span", { text: fmtDay(o.date, { day: "numeric", month: "long" }) })), list));
      }
      list.append(eventCard(o.ev, o.date));
    }
  }

  function renderMonth(view) {
    const m = S.month, y = m.getFullYear(), mo = m.getMonth();
    const startOffset = (new Date(y, mo, 1).getDay() + 6) % 7;
    const gs = ymd(new Date(y, mo, 1 - startOffset)), ge = addDays(gs, 41);
    const byDay = {};
    for (const o of occurrences(gs, ge)) (byDay[o.date] ||= []).push(o);
    view.append(h("div", { class: "mhead" },
      h("h2", { text: m.toLocaleDateString("en-GB", { month: "long", year: "numeric" }) }),
      h("div", { class: "mnav" },
        h("button", { class: "iconbtn", type: "button", "aria-label": "Previous month", onclick: () => { S.month = new Date(y, mo - 1, 1); render(); } }, "‹"),
        h("button", { class: "iconbtn", type: "button", onclick: () => { const t = parse(todayStr()); S.month = new Date(t.getFullYear(), t.getMonth(), 1); S.selDay = todayStr(); render(); } }, "Today"),
        h("button", { class: "iconbtn", type: "button", "aria-label": "Next month", onclick: () => { S.month = new Date(y, mo + 1, 1); render(); } }, "›"))));
    const grid = h("div", { class: "grid" });
    for (const d of ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]) grid.append(h("div", { class: "dow", text: d }));
    const t = todayStr();
    for (let i = 0; i < 42; i++) {
      const ds = addDays(gs, i), dd = parse(ds), items = byDay[ds] || [];
      const marks = h("div", { class: "marks" });
      items.slice(0, 3).forEach(o => {
        const color = profileColor((o.ev.who || [])[0] || "fam");
        marks.append(h("span", { class: "dot", kcolor: color }));
        marks.append(h("span", { class: "lbl", kcolor: color, text: shownTitle(o.ev) }));
      });
      if (items.length > 3) marks.append(h("span", { class: "more", text: `+${items.length - 3}` }));
      grid.append(h("button", {
        type: "button", class: `cell${dd.getMonth() !== mo ? " out" : ""}${ds === t ? " today" : ""}${ds === S.selDay ? " sel" : ""}`,
        "aria-label": `${fmtDay(ds, { weekday: "long", day: "numeric", month: "long" })}, ${items.length} entries`,
        onclick: () => { S.selDay = ds; render(); }
      }, h("span", { class: "n", text: String(dd.getDate()) }), marks));
    }
    view.append(grid);
    const sel = byDay[S.selDay] || occurrences(S.selDay, S.selDay);
    const list = h("div", { class: "list" });
    sel.forEach(o => list.append(eventCard(o.ev)));
    view.append(h("section", { class: "day" },
      h("div", { class: "dayhead" }, h("h3", { text: fmtDay(S.selDay, { weekday: "long", day: "numeric", month: "long" }) }),
        h("span", { text: sel.length ? `${sel.length} entr${sel.length > 1 ? "ies" : "y"}` : "Nothing planned" })),
      list));
  }

  function renderProfiles(view) {
    const list = profiles();
    if (!list.length) {
      view.append(h("div", { class: "empty" }, h("h3", { text: "Add the people you plan for" }),
        h("p", { text: "Kids, grandparents, pets: anyone with appointments. Each gets a page with what's coming up and a history of past visits." }),
        S.canWrite ? h("button", { class: "btn primary", type: "button", text: "Add people", onclick: openSettings }) : null));
      return;
    }
    if (!profileOf(S.kidView)) S.kidView = list[0].id;
    const k = S.kidView;
    view.append(h("div", { class: "seg", role: "group", "aria-label": "Choose person", style: "flex-wrap:wrap" },
      list.map(p => h("button", { type: "button", kcolor: profileColor(p.id), "aria-pressed": String(p.id === k), onclick: () => { S.kidView = p.id; render(); } }, h("span", { class: "dot" }), p.name))));
    const all = [...S.events.values()].filter(e => (e.who || []).includes(k));
    const t = todayStr();
    const next = all.map(e => ({ ev: e, date: e.yearly ? nextYearly(e.date, t) : e.date })).filter(o => o.date >= t && !(o.ev.done && !o.ev.yearly)).sort(sortOcc);
    const past = all.filter(e => !e.yearly && (e.date < t || e.done)).sort((a, b) => b.date.localeCompare(a.date));
    const appts = all.filter(e => e.type === "appointment");
    const nextAppt = next.find(o => o.ev.type === "appointment");
    view.append(h("div", { class: "profile", kcolor: profileColor(k) },
      h("div", { class: "avatar", text: kidName(k).trim().charAt(0).toUpperCase() || "?" }),
      h("div", {}, h("h2", { text: kidName(k) }),
        h("p", { text: nextAppt ? `Next appointment: ${nextAppt.ev.title}, ${fmtDay(nextAppt.date)}${nextAppt.ev.time ? " at " + nextAppt.ev.time : ""}` : "No appointments coming up" })),
      h("div", { class: "stats" },
        h("div", {}, h("b", { text: String(next.length) }), h("span", { text: "Coming up" })),
        h("div", {}, h("b", { text: String(appts.length) }), h("span", { text: "Appointments logged" })),
        h("div", {}, h("b", { text: String(past.filter(e => e.outcome).length) }), h("span", { text: "With outcome notes" })))));
    view.append(h("div", { class: "section-title", text: "Coming up" }));
    const l1 = h("div", { class: "list" }); next.forEach(o => l1.append(eventCard(o.ev, o.date)));
    view.append(next.length ? l1 : h("p", { class: "ev-note", text: "Nothing planned." }));
    view.append(h("div", { class: "section-title", text: "History" }));
    const l2 = h("div", { class: "list" }); past.forEach(e => l2.append(eventCard(e, e.date)));
    view.append(past.length ? l2 : h("p", { class: "ev-note", text: "Past appointments and what happened at them will collect here." }));
  }
  function nextYearly(date, from) {
    const y = parse(from).getFullYear(); let d = `${y}-${date.slice(5)}`;
    if (d < from) d = `${y + 1}-${date.slice(5)}`;
    return d < date ? date : d;
  }

  // ----- People: who's around, sharing settings, access -----
  function peopleOrder() {
    const ids = [...S.members.keys()];
    return ids.sort((a, b) => (b === S.me) - (a === S.me) || (S.members.get(b)?.isOwner ? 1 : 0) - (S.members.get(a)?.isOwner ? 1 : 0) || shortName(a).localeCompare(shortName(b)));
  }
  function renderPeople(view) {
    const t = todayStr(), day = S.peopleDay;
    // day strip
    view.append(h("div", { class: "section-title", text: "Who's around" }));
    view.append(h("div", { class: "daystrip", role: "group", "aria-label": "Choose day" },
      Array.from({ length: 7 }, (_, i) => addDays(t, i)).map(d => h("button", { type: "button", "aria-pressed": String(d === day), onclick: () => { S.peopleDay = d; render(); } },
        i0(d, t), h("b", { text: String(parse(d).getDate()) })))));
    const sched = h("div", { class: "sched" });
    const dayEvents = allEvents().filter(ev => visibleEv(ev) && datesFor(ev, day, day).length);
    const itemsFor = k => dayEvents.filter(ev => (ev.who || []).includes(k)).sort((a, b) => (a.time || "").localeCompare(b.time || ""));
    sched.append(schedRow(h("span", { class: "mini k-fam", text: groupLabel().charAt(0).toUpperCase() }), "Whole group", groupLabel(), itemsFor("fam")));
    for (const id of peopleOrder()) {
      const acc = accessOf(id);
      if (!acc.active) continue;
      sched.append(schedRow(h("span", { class: "mini", kcolor: personColor(id), text: shortName(id).charAt(0).toUpperCase() }), personName(id), acc.label, itemsFor(id)));
    }
    for (const p of profiles()) sched.append(schedRow(h("span", { class: "mini", kcolor: profileColor(p.id), text: p.name.charAt(0).toUpperCase() }), p.name, "Doesn't use the app", itemsFor(p.id)));
    view.append(sched);
    view.append(h("p", { class: "hint", style: "margin-top:8px", text: `${fmtDay(day, { weekday: "long", day: "numeric", month: "long" })}. To add your own plans, tap Add and pick yourself under "Who is it for".` }));

    // my sharing
    renderMySharing(view);
    renderAccessList(view);
    renderInvite(view);
  }
  const i0 = (d, t) => d === t ? "Today" : fmtDay(d, { weekday: "short" });
  function schedRow(avatar, name, sub, items) {
    const slots = h("div", { class: "slots" });
    if (!items.length) slots.append(h("span", { class: "free", text: "Free" }));
    items.forEach(ev => {
      const busy = isBusyOnly(ev);
      slots.append(h("div", { class: `slot${busy ? " busy" : ""}` }, h("span", { class: "tm", text: ev.time || "All day" }), h("span", { class: "ti", text: shownTitle(ev) })));
    });
    return h("div", { class: "srow" }, h("div", { class: "pname" }, avatar, h("span", { class: "t" }, name, h("small", { text: sub }))), slots);
  }
  function renderMySharing(view) {
    if (!S.me) return;
    const m = S.members.get(S.me) || {};
    const nick = h("input", { type: "text", id: "myNick", maxlength: "30", placeholder: "Your name as others see it" }); nick.value = m.nickname || "";
    const err = h("div", { class: "err", role: "alert" });
    view.append(h("div", { class: "section-title", text: "Your name" }));
    view.append(h("form", { class: "panel", onsubmit: async e => {
      e.preventDefault();
      try { await writeDoc(`members/${S.me}`, { ...m, nickname: nick.value.trim() }); toast("Saved"); } catch (er) { handleWriteError(er, err); }
    } },
      h("label", { class: "field" }, h("span", { text: "How others see you" }), nick),
      h("p", { class: "hint", style: "margin:0", text: "To keep one of your plans private, tick \"Private\" when you add it. Others will only see that you're busy." }),
      err,
      h("div", {}, h("button", { class: "btn primary", type: "submit", text: "Save" }))));
  }
  function renderAccessList(view) {
    const ids = peopleOrder();
    view.append(h("div", { class: "section-title", text: "People with access" }));
    const panel = h("div", { class: "panel" });
    if (!ids.length) panel.append(h("p", { class: "hint", text: "No one has joined yet. People appear here the first time they open the planner." }));
    for (const id of ids) {
      const acc = accessOf(id), a = S.access.get(id), m = S.members.get(id);
      const row = h("div", { class: "prow" },
        h("div", { class: "pname" }, h("span", { class: "mini", kcolor: personColor(id), text: shortName(id).charAt(0).toUpperCase() }), h("span", { class: "t", text: personName(id) })),
        h("span", { class: `role ${acc.cls}`, text: acc.label }));
      if (S.isOwner && !m?.isOwner && id !== S.me) {
        const sel = h("select", { "aria-label": `Access for ${shortName(id)}` },
          h("option", { value: "family", text: "Family · ongoing" }),
          h("option", { value: "visitor", text: "Visitor until…" }));
        sel.value = a?.role === "visitor" ? "visitor" : "family";
        const until = h("input", { type: "date", "aria-label": "Visit ends", min: todayStr() });
        until.value = a?.until || addDays(todayStr(), 30);
        until.hidden = sel.value !== "visitor";
        sel.addEventListener("change", () => until.hidden = sel.value !== "visitor");
        const err = h("div", { class: "err", role: "alert" });
        const remove = h("button", { type: "button", class: "btn danger", text: a?.role === "removed" ? "Removed" : "Remove", disabled: a?.role === "removed" });
        remove.addEventListener("click", async () => {
          if (!remove.classList.contains("armed")) { remove.classList.add("armed"); remove.textContent = "Tap again to remove"; return; }
          try { await writeDoc(`access/${id}`, { role: "removed", until: todayStr() }); toast(`${shortName(id)} removed`); } catch (er) { handleWriteError(er, err); }
        });
        row.append(h("div", { class: "ctrl" }, sel, until,
          h("button", { type: "button", class: "btn", text: "Save", onclick: async () => {
            const rec = sel.value === "visitor" ? { role: "visitor", until: until.value || addDays(todayStr(), 30) } : { role: "family", until: null };
            try { await writeDoc(`access/${id}`, rec); toast("Access updated"); } catch (er) { handleWriteError(er, err); }
          } }), remove), err);
        if (!acc.active) row.append(h("p", { class: "hint warn", text: `${shortName(id)} can no longer see the calendars in this app. To stop them opening the page at all, remove them in the Share menu too.` }));
        else if (acc.unset) row.append(h("p", { class: "hint", text: "Choose whether they're family or visiting until a set date." }));
      }
      panel.append(row);
    }
    view.append(panel);
  }
  function renderInvite(view) {
    view.append(h("div", { class: "section-title", text: "Invite someone" }));
    const code = h("code", { text: ARTIFACT_URL });
    view.append(h("div", { class: "panel" },
      h("ol", { class: "steps" },
        h("li", {}, "Tap ", h("b", { text: "Share" }), " at the top of this page and add their email as an ", h("b", { text: "Editor" }), "."),
        h("li", {}, "Send them this link. They'll need a free claude.ai account."),
        h("li", {}, "When they open it, they appear under ", h("b", { text: "People with access" }), ". Set them as family, or as a visitor until a date.")),
      h("div", { class: "copy" }, code, h("button", { type: "button", class: "btn", text: "Copy link", onclick: async e => {
        try { await navigator.clipboard.writeText(ARTIFACT_URL); toast("Link copied"); }
        catch { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Link selected, copy it now"); }
      } })),
      S.isOwner || S.mode === "preview" ? null : h("p", { class: "hint", text: "Only the planner's owner can invite people and set how long they can see it." })));
  }

  function renderLog(view) {
    view.append(h("div", { class: "premium" },
      h("div", { class: "mock", "aria-hidden": "true" },
        h("div", {}, h("b", { text: "2h 10m" }), `${profiles()[0]?.name || "Baby"}: since last feed`),
        h("div", {}, h("b", { text: "8:00 pm" }), `${profiles()[1]?.name || "Grandad"}: next medicine`),
        h("div", {}, h("b", { text: "7" }), "Nappies today"),
        h("div", {}, h("b", { text: "11h 20m" }), "Sleep in 24h")),
      h("div", { class: "pitch" },
        h("h2", { text: "Care log" }), h("span", { class: "lock", text: "Premium · in-app purchase" }),
        h("ul", {},
          h("li", { text: "One-tap feed, nappy and sleep logging for babies" }),
          h("li", { text: "Medicine doses and reminders for anyone in the group" }),
          h("li", { text: "Daily totals to share with a health visitor, doctor or carer" }),
          h("li", { text: "Everyone logs from their own phone, in real time" })),
        h("p", { class: "ev-note", style: "margin-top:12px", text: "Not built yet. This is a preview of the planned premium feature." }))));
  }

  function emptyState() {
    return h("div", { class: "empty" },
      h("h3", { text: S.filter === "all" ? "Nothing planned yet" : `Nothing planned for ${kidName(S.filter)}` }),
      h("p", { text: S.canWrite ? "Tap Add to put in the first appointment, birthday or reminder. Everyone who shares the planner will see it." : "Entries will appear here once they are added." }));
  }

  function renderFilters() {
    const slot = $("#filterSlot"); slot.replaceChildren();
    if (S.tab !== "upcoming" && S.tab !== "month") return;
    slot.append(h("div", { class: "filters", role: "group", "aria-label": "Show entries for" },
      [["all", "Everything"], ...peopleOrder().filter(id => accessOf(id).active).map(id => [id, shortName(id)]), ...profiles().map(p => [p.id, p.name]), ["fam", "Whole group"]].map(([k, lbl]) =>
        h("button", { type: "button", class: "chip", kcolor: k === "all" ? null : profileColor(k), "aria-pressed": String(S.filter === k), onclick: () => { S.filter = k; render(); } },
          k !== "all" ? h("span", { class: "dot" }) : null, lbl))));
  }

  function renderBanner() {
    const slot = $("#bannerSlot"); slot.replaceChildren();
    if (S.mode === "preview") slot.append(h("div", { class: "banner" }, h("b", { text: "Preview mode. " }), "Saved data isn't available in this view, so changes last until you close the page."));
    else if (!S.canWrite) slot.append(h("div", { class: "banner" }, h("b", { text: "View only. " }), "Ask the person who shared this to invite you as an Editor so you can add entries."));
    else if (S.me && !S.isOwner) {
      const a = S.access.get(S.me);
      if (a?.role === "visitor" && a.until && a.until >= todayStr()) slot.append(h("div", { class: "banner" }, h("b", { text: "You're visiting. " }), `You can see and add to the shared calendars until ${fmtDay(a.until, { weekday: "long", day: "numeric", month: "long" })}.`));
    }
  }

  function render() {
    $$(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
    $("#groupTitle").textContent = S.settings.groupName || "Circle Planner";
    const view = $("#view"); view.replaceChildren();
    if (locked()) {
      $("#addBtn").hidden = true; $("#bannerSlot").replaceChildren(); $("#filterSlot").replaceChildren();
      const a = S.access.get(S.me);
      view.append(h("div", { class: "gate" }, h("h2", { text: a?.role === "removed" ? "Your access has been removed" : "Your shared visit has ended" }),
        h("p", { class: "hint", text: a?.role === "removed" ? "Ask the planner's owner if you think this is a mistake." : `Shared access ended on ${fmtDay(a.until, { weekday: "long", day: "numeric", month: "long" })}. Ask the planner's owner to extend it.` })));
      return;
    }
    $("#addBtn").hidden = !S.canWrite || S.tab === "log";
    renderBanner(); renderFilters();
    ({ upcoming: renderUpcoming, month: renderMonth, profiles: renderProfiles, people: renderPeople, log: renderLog })[S.tab](view);
  }

  function setStatus(text, s) { const el = $("#status"); el.textContent = text; el.dataset.s = s; }

  // ---------- writes (store, or memory in preview) ----------
  async function writeDoc(path, body) {
    if (S.db) return S.db.doc(path).set(body);
    const [col, id] = [path.split("/").slice(0, -1).join("/"), path.split("/").pop()];
    if (col === "members") S.members.set(id, body);
    else if (col === "access") S.access.set(id, body);
    else if (col === "family") S.settings = normalizeSettings(body);
    else if (col === "events") S.events.set(id, { id, cal: "family", ...body });
    else if (col.startsWith("cals/")) { const owner = col.split("/")[1]; if (!S.personal.has(owner)) S.personal.set(owner, new Map()); S.personal.get(owner).set(id, { ...body, id, cal: owner, who: [owner] }); }
    render();
  }
  async function deleteDoc(path) {
    if (S.db) return S.db.doc(path).delete();
    const parts = path.split("/"), id = parts.pop(), col = parts.join("/");
    if (col === "events") S.events.delete(id);
    else if (col.startsWith("cals/")) S.personal.get(parts[1])?.delete(id);
    render();
  }
  const evPath = (cal, id) => cal === "family" ? `events/${id}` : `cals/${cal}/events/${id}`;

  // ---------- dialog: event ----------
  const evDlg = $("#evDlg");
  function buildPickers(current) {
    const who = $("#fWho"); who.replaceChildren();
    for (const k of [...peopleOrder().filter(id => accessOf(id).active), ...profiles().map(p => p.id), "fam"]) who.append(h("label", { kcolor: profileColor(k) }, h("input", { type: "checkbox", name: "who", value: k }), h("span", { class: "dot" }), kidName(k)));
    const own = $("#fOwner"); own.replaceChildren();
    const opts = [["", "Not decided yet"], ...peopleOrder().filter(id => accessOf(id).active).map(id => [id, shortName(id)]), ["all", "Everyone"]];
    if (current && !opts.some(o => o[0] === current)) opts.splice(1, 0, [current, ownerName(current)]);
    for (const [v, l] of opts) own.append(h("label", {}, h("input", { type: "radio", name: "owner", value: v }), l));
  }
  const pickedWho = () => $$('#fWho input:checked').map(i => i.value);
  const syncFields = () => {
    $("#ownerField").hidden = !$("#fNeeds").checked;
    const w = pickedWho();
    $("#privField").hidden = !(S.me && w.length === 1 && w[0] === S.me);
  };
  $("#fWho").addEventListener("change", syncFields);
  $("#fNeeds").addEventListener("change", syncFields);
  function getEvent(cal, id) { return cal === "family" ? S.events.get(id) : S.personal.get(cal)?.get(id); }
  function openEvent(cal, id, presetDate) {
    const ev = id ? getEvent(cal, id) : null;
    const mine = !ev || ((ev.cal === "family" || ev.cal === S.me) && (!ev.private || ev.createdBy === S.me));
    const editable = S.canWrite && mine;
    if (!ev && !S.canWrite) return;
    buildPickers(ev?.owner || "");
    S.editing = ev ? { cal: ev.cal, id: ev.id } : null;
    $("#evDlgTitle").textContent = ev ? (editable ? "Edit entry" : `${shortName(ev.createdBy || ev.cal)}'s entry`) : "New entry";
    $("#fTitle").value = ev?.title || "";
    const who = ev?.who || (S.filter !== "all" ? [S.filter] : S.me ? [S.me] : ["fam"]);
    $$('#fWho input').forEach(i => i.checked = who.includes(i.value));
    $$('#fType input').forEach(i => i.checked = i.value === (ev?.type || "appointment"));
    $("#fDate").value = ev?.date || presetDate || todayStr();
    $("#fTime").value = ev?.time || "";
    $("#fYearly").checked = !!ev?.yearly;
    $$('#fOwner input').forEach(i => i.checked = i.value === (ev?.owner || ""));
    $("#fNeeds").checked = !!(ev?.needsOwner || ev?.owner);
    $("#fPrivate").checked = !!ev?.private;
    $("#fNotes").value = ev?.notes || "";
    $("#fOutcome").value = ev?.outcome || "";
    $("#fDone").checked = !!ev?.done;
    $("#outcomeField").hidden = !ev; $("#doneField").hidden = !ev;
    syncFields();
    const del = $("#delBtn"); del.hidden = !ev || !editable; del.classList.remove("armed"); del.textContent = "Delete";
    $("#saveBtn").hidden = !editable;
    evDlg.querySelectorAll("input,textarea").forEach(el => el.disabled = !editable);
    $("#fErr").textContent = "";
    evDlg.showModal();
    if (!ev) $("#fTitle").focus();
  }
  $("#evForm").addEventListener("submit", async e => {
    e.preventDefault();
    const cal = S.editing ? S.editing.cal : "family";
    const title = $("#fTitle").value.trim();
    const who = pickedWho();
    const date = $("#fDate").value;
    if (!title) return $("#fErr").textContent = "Add a short description, like “Hearing test”.";
    if (!who.length) return $("#fErr").textContent = "Choose who it's for.";
    if (!date) return $("#fErr").textContent = "Pick a date.";
    const prev = S.editing ? getEvent(S.editing.cal, S.editing.id) : null;
    const body = {
      title, who, date,
      type: $('#fType input:checked')?.value || "appointment",
      time: $("#fTime").value || "",
      yearly: $("#fYearly").checked,
      needsOwner: $("#fNeeds").checked,
      owner: $("#fNeeds").checked ? ($('#fOwner input:checked')?.value || "") : "",
      private: $("#fPrivate").checked && !!S.me && who.length === 1 && who[0] === S.me,
      createdBy: prev?.createdBy || S.me || "",
      notes: $("#fNotes").value.trim(),
      outcome: $("#fOutcome").value.trim(),
      done: $("#fDone").checked,
      example: !!(prev?.example && prev.title === title),
      createdAt: prev?.createdAt || new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    $("#saveBtn").disabled = true;
    try { await writeDoc(evPath(cal, S.editing?.id || uid()), body); evDlg.close(); toast(prev ? "Saved" : "Added"); }
    catch (err) { handleWriteError(err, $("#fErr")); }
    finally { $("#saveBtn").disabled = false; }
  });
  $("#delBtn").addEventListener("click", async () => {
    const b = $("#delBtn");
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Tap again to delete"; return; }
    try { await deleteDoc(evPath(S.editing.cal, S.editing.id)); evDlg.close(); toast("Deleted"); }
    catch (err) { handleWriteError(err, $("#fErr")); }
  });

  // ---------- dialog: names ----------
  const setDlg = $("#setDlg");
  let draft = [];
  function drawProfileEditor() {
    const box = $("#sProfiles"); box.replaceChildren();
    if (!draft.length) box.append(h("p", { class: "hint", text: "No one added yet." }));
    draft.forEach((p, i) => {
      const inp = h("input", { type: "text", maxlength: "30", "aria-label": `Name ${i + 1}`, placeholder: "Name", disabled: !S.canWrite }); inp.value = p.name;
      inp.addEventListener("input", () => p.name = inp.value);
      const used = [...S.events.values()].filter(e => (e.who || []).includes(p.id)).length;
      const rm = h("button", { type: "button", class: "btn danger", text: "Remove", disabled: !S.canWrite });
      rm.addEventListener("click", () => {
        if (used && !rm.classList.contains("armed")) { rm.classList.add("armed"); rm.textContent = `Remove (${used} entr${used > 1 ? "ies" : "y"})`; return; }
        draft.splice(i, 1); drawProfileEditor();
      });
      box.append(h("div", { class: "prof-edit" },
        h("button", { type: "button", class: "swatch", kcolor: `var(--c${p.color % 6})`, "aria-label": "Change colour", title: "Change colour", disabled: !S.canWrite, onclick: () => { p.color = (p.color + 1) % 6; drawProfileEditor(); } }),
        inp, rm));
    });
  }
  function openSettings() {
    $("#sGroup").value = S.settings.groupName || "";
    draft = profiles().map(p => ({ ...p }));
    drawProfileEditor();
    $("#sGroup").disabled = !S.canWrite; $("#sAddProfile").hidden = !S.canWrite;
    $("#exampleBox").hidden = !S.canWrite || ![...S.events.values()].some(e => e.example);
    $("#sErr").textContent = "";
    setDlg.showModal();
  }
  $("#settingsBtn").addEventListener("click", openSettings);
  $("#sAddProfile").addEventListener("click", () => {
    const usedColors = draft.map(p => p.color);
    const color = [0, 1, 2, 3, 4, 5].find(c => !usedColors.includes(c)) ?? draft.length % 6;
    draft.push({ id: uid(), name: "", color }); drawProfileEditor();
    $("#sProfiles").querySelector(".prof-edit:last-child input")?.focus();
  });
  $("#setForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!S.canWrite) return setDlg.close();
    const list = draft.map((p, i) => ({ id: p.id, name: p.name.trim() || `Person ${i + 1}`, color: p.color }));
    const next = { groupName: $("#sGroup").value.trim(), profiles: list, parents: S.settings.parents || {} };
    try { await writeDoc("family/settings", next); setDlg.close(); toast("Saved"); }
    catch (err) { handleWriteError(err, $("#sErr")); }
  });
  $("#clearEx").addEventListener("click", async () => {
    const ids = [...S.events.values()].filter(e => e.example).map(e => e.id);
    try { for (const id of ids) await deleteDoc(`events/${id}`); setDlg.close(); toast(`Removed ${ids.length} examples`); }
    catch (err) { handleWriteError(err, $("#sErr")); }
  });
  $$("[data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));

  function handleWriteError(err, el) {
    const code = err?.code;
    if (code === "invalid_argument" || code === "not_granted") el.textContent = "You don't have permission to change this. Ask the planner's owner to invite you as an Editor.";
    else if (code === "quota_exceeded") el.textContent = "The planner is full. Delete some old entries and try again.";
    else el.textContent = "Couldn't save just now. Check your connection and try again.";
  }
  let toastT;
  function toast(msg) {
    $(".toast")?.remove(); clearTimeout(toastT);
    const t = h("div", { class: "toast", role: "status", text: msg }); document.body.append(t);
    toastT = setTimeout(() => t.remove(), 2200);
  }

  // ---------- wiring ----------
  $$(".tab").forEach(b => b.addEventListener("click", () => { S.tab = b.dataset.tab; render(); }));
  $("#addBtn").addEventListener("click", () => openEvent(null, null, S.tab === "month" ? S.selDay : S.tab === "people" ? S.peopleDay : null));
  $("#todayLbl").textContent = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });

  // Preview fallback (only when the shared store isn't available, e.g. opening the file directly)
  function loadPreview() {
    S.mode = "preview"; setStatus("Preview", "warn");
    const t = todayStr();
    S.me = "me"; S.isOwner = true;
    S.members.set("me", { nickname: "", shareMode: "details", isOwner: true });
    S.members.set("partner", { nickname: "Partner", shareMode: "details" });
    S.members.set("sam", { nickname: "Sam (example)", shareMode: "details" });
    S.members.set("jo", { nickname: "Jo (example)", shareMode: "busy" });
    S.access.set("partner", { role: "family", until: null });
    S.access.set("sam", { role: "visitor", until: addDays(t, 23) });
    S.access.set("jo", { role: "family", until: null });
    const add = (cal, e) => { const id = uid(), ev = { id, cal, example: true, who: [], notes: "", outcome: "", time: "", owner: "", type: "appointment", yearly: false, done: false, ...e }; if (cal === "family") S.events.set(id, ev); else { if (!S.personal.has(cal)) S.personal.set(cal, new Map()); S.personal.get(cal).set(id, ev); } };
    S.settings = normalizeSettings({ groupName: "The Example family", profiles: [{ id: "a", name: "Mia", color: 0 }, { id: "b", name: "Leo", color: 1 }, { id: "g", name: "Grandma", color: 2 }] });
    add("family", { title: "Parents' evening", who: ["a"], date: addDays(t, 2), time: "17:30", needsOwner: true, owner: "all" });
    add("family", { title: "Dentist check-ups", who: ["a", "b"], date: addDays(t, 4), time: "10:30", needsOwner: true, owner: "partner", notes: "Both kids, back to back." });
    add("family", { title: "Eye appointment", who: ["g"], date: addDays(t, 6), time: "11:15", needsOwner: true, owner: "me" });
    add("family", { title: "Bin day", who: ["fam"], type: "reminder", date: addDays(t, 1) });
    add("family", { title: "Swimming lesson", who: ["b"], date: addDays(t, 10), time: "16:00", needsOwner: true });
    add("family", { title: "GP check-up", who: ["b"], date: addDays(t, -5), time: "09:30", owner: "me", done: true, outcome: "All fine. Follow-up in 6 months." });
    add("family", { title: "Office day", who: ["me"], date: addDays(t, 1), time: "09:00", createdBy: "me" });
    add("family", { title: "Cinema with friends", who: ["partner"], date: addDays(t, 1), time: "18:30", createdBy: "partner" });
    add("family", { title: "Arriving: needs a lift from the airport", who: ["sam"], date: addDays(t, 1), time: "16:40", needsOwner: true, createdBy: "sam" });
    add("family", { title: "Doctor", who: ["jo"], date: addDays(t, 2), time: "08:00", private: true, createdBy: "jo" });
    render();
  }

  async function start() {
    render();
    const c = window.claude;
    const db = c?.use ? await c.use("db").catch(() => null) : null;
    if (!db) return loadPreview();
    S.db = db; S.mode = "live";
    const user = await c.use("user").catch(() => null);
    S.user = user;
    if (user) {
      const cw = await user.can("data.write"); if (cw === false) S.canWrite = false;
      S.isOwner = await user.isOwner();
      S.me = await user.id();
    }
    let loaded = false;
    const timer = setTimeout(() => { if (!loaded) setStatus("Can't reach saved data yet", "warn"); }, 10000);
    db.collection("events").onSnapshot(snap => {
      S.events = new Map(snap.docs.map(d => [d.id, { id: d.id, cal: "family", ...d.data() }]));
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); setStatus("Shared · up to date", "live"); }
      render();
    }, () => { clearTimeout(timer); setStatus("Not syncing. Reopen to retry", "warn"); });
    db.doc("family/settings").onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      S.settings = normalizeSettings(d);
      render();
    }, () => {});
    db.collection("access").onSnapshot(snap => { S.access = new Map(snap.docs.map(d => [d.id, d.data()])); render(); }, () => {});
    const calSubs = new Map();
    const syncCalSubs = () => {
      const want = new Set(S.members.keys()); if (S.me) want.add(S.me);
      for (const id of want) if (!calSubs.has(id)) calSubs.set(id, db.collection(`cals/${id}/events`).onSnapshot(snap => {
        S.personal.set(id, new Map(snap.docs.map(d => [d.id, { ...d.data(), id: d.id, cal: id, who: [id] }]))); render();
      }, () => {}));
      for (const [id, un] of calSubs) if (!want.has(id)) { un(); calSubs.delete(id); S.personal.delete(id); }
    };
    db.collection("members").onSnapshot(async snap => {
      S.members = new Map(snap.docs.map(d => [d.id, d.data()]));
      syncCalSubs(); render();
      if (user && S.members.size) { S.profiles = await user.profiles([...S.members.keys()]); render(); }
    }, () => {});
    syncCalSubs();
    // join: record this person once so others can see them under People
    if (S.me && S.canWrite) {
      try {
        const ref = db.doc(`members/${S.me}`), snap = await ref.get();
        if (!snap.exists) await ref.set({ nickname: (await user.me()).name || "", shareMode: "details", isOwner: S.isOwner, joinedAt: new Date().toISOString() });
        else if (!!snap.data().isOwner !== S.isOwner) await ref.update({ isOwner: S.isOwner });
      } catch {}
    }
    render();
  }
  start();
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Christmas HQ · The Geek Next Door Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#D6452F;--yel:#F2B632;--blue:#2F6FB5;--grn:#3F9B5A;--ink:#1F1D1A;--mute:#6b645a;--bg:#F7F3EA;--card:#fff;--line:#E4DCCB;--soft:#FBF8F1;--accent:#D6452F;--shadow:0 6px 20px rgba(0,0,0,.06)}
[data-theme="dark"]{--ink:#F3EEE4;--mute:#B5AC9F;--bg:#17150F;--card:#221F18;--line:#3A352B;--soft:#2A261E;--shadow:0 6px 20px rgba(0,0,0,.3)}
[data-theme="festive"]{--red:#B3261E;--yel:#C9A227;--blue:#1E5631;--grn:#1E5631;--accent:#B3261E;--bg:#FBF7EF}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;font-weight:400;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.stripe{height:6px;background:linear-gradient(90deg,var(--red) 0 25%,var(--yel) 25% 50%,var(--blue) 50% 75%,var(--grn) 75%)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 6px)}
nav.side{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:calc(100vh - 6px);overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}.logo b{font-family:'DM Serif Display';font-size:22px;font-weight:400;line-height:1}.logo small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--mute);font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer;margin-bottom:2px}
.nav a:hover{background:var(--soft)}.nav a.on{background:var(--ink);color:var(--bg)}.nav a .ic{width:22px;text-align:center}
main{padding:26px 32px 90px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:34px;line-height:1.1}.top p{margin:4px 0 0;color:var(--mute)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.sm{padding:6px 12px;font-size:13px}.btn.dark{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:16px}.grid>*,main,.app>*{min-width:0}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.card h3{font-size:21px;margin-bottom:12px}
.stat .k{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}.stat .v{font-family:'DM Serif Display';font-size:34px;line-height:1.1;margin:4px 0 2px}.stat .s{font-size:13px;color:var(--mute)}
.stat.c1{border-top:5px solid var(--red)}.stat.c2{border-top:5px solid var(--yel)}.stat.c3{border-top:5px solid var(--blue)}.stat.c4{border-top:5px solid var(--grn)}
.count{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.count b{font-family:'DM Serif Display';font-size:44px;color:var(--accent);font-weight:400;line-height:1}.count span{color:var(--mute);font-weight:600;margin-right:8px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--grn);border-radius:99px}.bar i.over{background:var(--red)}
.prow{display:grid;grid-template-columns:130px 1fr 110px;gap:12px;align-items:center;margin:9px 0;font-size:14px}.prow .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prow .m{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.ring{position:relative;width:86px;height:86px;margin:0 auto}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}.rings small{display:block;margin-top:4px;font-weight:600;color:var(--mute)}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.list .it:last-child{border:0}.it .t{font-weight:600}.it .d{font-size:13px;color:var(--mute)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.s-idea{background:#EFEBE3;color:#6b645a}.s-tobuy{background:#FBEFC9;color:#8a6a00}.s-bought{background:#DCEBDF;color:#24603a}.s-wrapped{background:#B9D7C1;color:#1c4b2d}.s-given{background:#8FBF9E;color:#11331d}
[data-theme="dark"] .pill{filter:brightness(.9)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:2px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:hover td{background:var(--soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input,.tools select{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:13px}.chk.on{background:var(--grn);border-color:var(--grn)}
.link{color:var(--blue);font-weight:600;cursor:pointer;text-decoration:none}.del{color:var(--red);cursor:pointer;font-weight:700;background:none;border:0}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.modal-bg{position:fixed;inset:0;background:rgba(20,18,14,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:20px;padding:22px 24px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}.modal h2{font-size:26px;margin-bottom:14px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--mute)}.f label.w{grid-column:1/-1}
.f input,.f select,.f textarea{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--soft);color:var(--ink);font-weight:500}
.mfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.banner{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.banner b{color:var(--yel)}
.ss-pair{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--soft);border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.reveal{text-align:center;padding:26px}.reveal .big{font-family:'DM Serif Display';font-size:46px;color:var(--accent)}
.tags{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tag{border-radius:16px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;border:2px solid var(--ink);background:#fff;color:#1F1D1A}
.tag .to{font-family:'DM Serif Display';font-size:26px;line-height:1.1}.tag .fr{font-size:13px;font-weight:600}.tag .hole{position:absolute;top:10px;right:12px;width:14px;height:14px;border-radius:50%;border:2px solid #1F1D1A;background:#fff}
.tag.geek{border-top:12px solid transparent;border-image:linear-gradient(90deg,#D6452F 0 25%,#F2B632 25% 50%,#2F6FB5 50% 75%,#3F9B5A 75%) 1}
.tag.classic{background:#B3261E;color:#fff;border-color:#B3261E}.tag.classic .hole{border-color:#fff;background:#B3261E}.tag.classic:after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(45deg,#fff 0 8px,#1E5631 8px 16px)}
.tag.snowy{background:#EAF4FB;border-color:#2F6FB5;background-image:radial-gradient(#fff 3px,transparent 3px);background-size:22px 22px}
.tag.kraft{background:#D9B98C;border-color:#7a5a32}.tag.kraft .to{color:#3f2a10}
.lock,.panic{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lock .card{text-align:center;max-width:340px}.lock input{font-size:28px;letter-spacing:12px;text-align:center;width:180px;border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--soft);margin:14px 0}
.panic .card{max-width:560px}.panic li{margin:6px 0}
.tabs-m{display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:200}
@media(max-width:900px){.app{grid-template-columns:1fr}.rings{grid-template-columns:repeat(2,1fr);row-gap:14px}.stat .v{font-size:26px}.count b{font-size:34px}nav.side{display:none}main{padding:18px 16px 96px}.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}.tags{grid-template-columns:repeat(2,1fr)}
.tabs-m{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs-m a{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;padding:4px 10px;border-radius:10px;color:var(--mute);cursor:pointer}.tabs-m a.on{color:var(--accent)}.tabs-m a span{font-size:20px}
.prow{grid-template-columns:90px 1fr 92px}.hide-m{display:none}.top h1{font-size:28px}table{font-size:13px}td,th{padding:8px 6px}}
@media print{body{background:#fff}nav,.tabs-m,.top,.tools,.banner,.noprint{display:none!important}.app{display:block}main{padding:0;max-width:none}.tags{grid-template-columns:repeat(3,1fr);gap:8mm}.tag{break-inside:avoid;min-height:45mm}}
</style>
</head>
<body>
<div class="stripe"></div>
<div id="root"></div>
<script>
const DEMO = __DEMO__, DEMO_LIMIT = 10, ETSY_URL = "__ETSY_URL__";
const KEY = DEMO ? "geekxmas-demo-v1" : "geekxmas-v1";
const STATUSES = [["idea","Idea"],["tobuy","To buy"],["bought","Bought"],["wrapped","Wrapped"],["given","Given"]];
const CURRENCIES = {GBP:"£ GBP",USD:"$ USD",EUR:"€ EUR",CAD:"$ CAD",AUD:"$ AUD",NZD:"$ NZD",IEP:"€ (Ireland)"};
const VIEWS = [["dash","🏠","Dashboard"],["gifts","🎁","Gifts"],["people","👪","People"],["shop","🛒","Shopping"],["stock","🧦","Stockings"],["cards","💌","Cards"],["santa","🎅","Secret Santa"],["tags","🏷️","Gift Tags"],["check","✅","Checklist"],["settings","⚙️","Settings"]];
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const year = new Date().getFullYear();

function checklistDefaults(){ return [
 ["Early November","Set your Christmas budget"],["Early November","List everyone you're buying for"],["Early November","Book Christmas travel"],
 ["Mid November","Order personalised gifts"],["Late November","Black Friday shopping (stick to the list!)"],["Late November","Buy cards and stamps"],
 ["Early December","Put the tree up"],["Early December","Book the food delivery / order the turkey"],["Early December","Organise Secret Santa"],
 ["Early December","Write and post cards (check Royal Mail last posting dates)"],["Mid December","Post gifts to faraway family"],["Mid December","Finish the shopping"],
 ["Mid December","Wrap presents"],["Christmas week","Big food shop"],["Christmas week","Charge batteries for new toys"],["Christmas Eve","Stockings ready"],
 ["Christmas Eve","Mince pie and carrot out for Santa & Rudolph"],["Christmas Day","Enjoy it! 🎄"],["After Christmas","Write thank-you notes"]].map(([w,t]) => ({id:uid(),week:w,text:t,done:false})); }

function blank(){ return {settings:{family:"",year,currency:"GBP",theme:"light",pin:""},people:[],gifts:[],stockings:[],cards:[],santa:{names:[],excl:[],budget:"",date:"",draw:null,revealed:[]},checklist:checklistDefaults(),created:0}; }
function sample(){
  const d = blank(); d.settings.family = "The Taylor Family";
  const P = [["Mum","Family",120,"Size 12 · UK 6 shoes","Candles, bath stuff, a good crime novel"],["Dad","Family",100,"L · UK 10","Coffee, gardening, anything Liverpool FC"],
             ["Isla","Kids",150,"Age 8-9","LEGO Friends, art set, roller skates"],["Noah","Kids",150,"Age 5-6","Dinosaurs, football, Paw Patrol"],["Grandma Joan","Family",40,"","Jigsaws, slippers"],["Mr Patel (teacher)","Other",15,"",""]];
  P.forEach(([name,group,budget,sizes,wish]) => d.people.push({id:uid(),name,group,budget,sizes,wish}));
  const by = n => d.people.find(p => p.name.startsWith(n)).id, dt = (m,dd) => `${year}-${String(m).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
  [["Mum","Cashmere scarf","John Lewis",45,42,"wrapped",dt(12,20)],["Mum","Crime novel","Waterstones",12,10,"bought",dt(12,20)],["Dad","Coffee subscription","Online",30,30,"bought",dt(12,25)],
   ["Dad","Gardening gloves","Garden centre",15,"","tobuy",dt(12,25)],["Isla","LEGO Friends set","Argos",60,55,"wrapped",dt(12,25)],["Isla","Roller skates","Decathlon",45,"","tobuy",dt(12,25)],
   ["Noah","Dinosaur kit","Smyths",35,32,"bought",dt(12,25)],["Noah","Football","JD Sports",20,"","idea",dt(12,25)],["Grandma Joan","1000-piece jigsaw","WHSmith",18,16,"given",dt(12,18)],
   ["Mr Patel (teacher)","Box of chocolates","Tesco",8,8,"bought",dt(12,19)]].forEach(([p,title,store,est,cost,status,giveBy]) => d.gifts.push({id:uid(),person:by(p),title,store,link:"",est,cost,status,giveBy,notes:""}));
  [["Isla","Chocolate coins",2,true],["Isla","Hair clips",4,false],["Noah","Dinosaur stickers",3,true],["Noah","Satsuma",0.3,false]].forEach(([p,item,cost,got]) => d.stockings.push({id:uid(),person:by(p),item,cost,got}));
  [["Auntie Sue & Ken","12 Holly Lane, York",true,true],["The Johnsons","4 Elm Road, Leeds",true,false],["Nana & Grandad","",false,false]].forEach(([name,address,sent,received]) => d.cards.push({id:uid(),name,address,sent,received}));
  d.santa.names = ["Mum","Dad","Auntie Sue","Uncle Ken","Grandma Joan","Cousin Amy"]; d.santa.excl = [["Mum","Dad"],["Auntie Sue","Uncle Ken"]]; d.santa.budget = 20;
  d.checklist.slice(0,5).forEach(c => c.done = true);
  return d;
}
let S, view = "dash", filt = {person:"",status:"",q:""}, unlocked = false;
function load(){ try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : (DEMO ? sample() : blank()); } catch(e) { S = DEMO ? sample() : blank(); } S = Object.assign(blank(), S); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
load();
const money = v => { const n = Number(v) || 0; const cur = S.settings.currency === "IEP" ? "EUR" : S.settings.currency; try { return new Intl.NumberFormat("en-GB",{style:"currency",currency:cur,maximumFractionDigits:n % 1 ? 2 : 0}).format(n); } catch(e) { return n.toFixed(2); } };
const person = id => S.people.find(p => p.id === id);
const giftCost = g => Number(g.cost !== "" && g.cost != null ? g.cost : 0);
const giftPlan = g => Number(g.cost !== "" && g.cost != null ? g.cost : g.est) || 0;
const isBought = g => ["bought","wrapped","given"].includes(g.status);
function canAdd(){ if (!DEMO) return true; if (S.created >= DEMO_LIMIT) { toast("Demo limit reached: get the full version for unlimited entries"); return false; } return true; }
function created(){ if (DEMO) S.created++; }
function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function xmas(){ const now = new Date(); let x = new Date(Number(S.settings.year) || now.getFullYear(), 11, 25); if (x - now < -86400000) x = new Date(now.getFullYear() + 1, 11, 25); return x; }

/* ---------------- views ---------------- */
function ring(v, max, col, label){ const p = max ? Math.min(1, v / max) : 0, C = 2 * Math.PI * 36;
  return `<div><div class="ring"><svg width="86" height="86"><circle cx="43" cy="43" r="36" fill="none" stroke="var(--soft)" stroke-width="10"/><circle cx="43" cy="43" r="36" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg><b>${v}/${max}</b></div><small>${label}</small></div>`; }
function vDash(){
  const budget = S.people.reduce((a,p) => a + (Number(p.budget)||0), 0), planned = S.gifts.reduce((a,g) => a + giftPlan(g), 0) + S.stockings.reduce((a,s) => a + (Number(s.cost)||0), 0);
  const spent = S.gifts.filter(isBought).reduce((a,g) => a + giftCost(g), 0) + S.stockings.filter(s => s.got).reduce((a,s) => a + (Number(s.cost)||0), 0);
  const n = S.gifts.length, bought = S.gifts.filter(isBought).length, wrapped = S.gifts.filter(g => ["wrapped","given"].includes(g.status)).length, given = S.gifts.filter(g => g.status === "given").length;
  const cs = S.cards.filter(c => c.sent).length;
  const next = S.gifts.filter(g => g.status !== "given").sort((a,b) => (a.giveBy||"9999").localeCompare(b.giveBy||"9999") || STATUSES.findIndex(s=>s[0]===a.status) - STATUSES.findIndex(s=>s[0]===b.status)).slice(0, 6);
  const per = S.people.map(p => { const pl = S.gifts.filter(g => g.person === p.id).reduce((a,g) => a + giftPlan(g), 0) + S.stockings.filter(s => s.person === p.id).reduce((a,s) => a + (Number(s.cost)||0), 0); return {p, pl}; });
  return `<div class="top"><div><h1>${esc(S.settings.family || "Our Family")} Christmas</h1><p>Season ${esc(S.settings.year)} · ${S.people.length} people · ${n} gifts</p></div><button class="btn" data-a="addGift">+ Add a gift</button></div>
  <div class="card" style="margin-bottom:16px"><div class="count" id="countdown"></div></div>
  <div class="grid g4" style="margin-bottom:16px">
   <div class="card stat c1"><div class="k">Budget</div><div class="v">${money(budget)}</div><div class="s">across ${S.people.length} people</div></div>
   <div class="card stat c2"><div class="k">Planned</div><div class="v">${money(planned)}</div><div class="s">${budget ? Math.round(planned/budget*100) : 0}% of budget</div></div>
   <div class="card stat c3"><div class="k">Spent</div><div class="v">${money(spent)}</div><div class="s">${bought} gifts bought</div></div>
   <div class="card stat c4"><div class="k">Left to spend</div><div class="v" style="color:${budget-spent<0?'var(--red)':'inherit'}">${money(budget - spent)}</div><div class="s">of your total budget</div></div></div>
  <div class="grid g2" style="margin-bottom:16px">
   <div class="card"><h3>Budget vs planned, by person</h3>${per.length ? per.map(({p,pl}) => `<div class="prow"><span class="n">${esc(p.name)}</span><div class="bar"><i class="${pl > p.budget ? 'over' : ''}" style="width:${p.budget ? Math.min(100, pl/p.budget*100) : 0}%"></i></div><span class="m">${money(pl)} / ${money(p.budget)}</span></div>`).join("") : `<div class="empty">Add people to set budgets.</div>`}</div>
   <div class="card"><h3>Progress</h3><div class="rings">${ring(bought,n,"var(--blue)","Bought")}${ring(wrapped,n,"var(--grn)","Wrapped")}${ring(given,n,"var(--yel)","Given")}${ring(cs,S.cards.length,"var(--red)","Cards sent")}</div>
    <h3 style="margin-top:20px">Up next</h3><div class="list">${next.length ? next.map(g => `<div class="it"><div><div class="t">${esc(g.title)}</div><div class="d">for ${esc(person(g.person)?.name || "?")}${g.giveBy ? " · give by " + new Date(g.giveBy).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : ""}</div></div>${statusPill(g)}</div>`).join("") : `<div class="empty">Nothing waiting. Nice work! 🎉</div>`}</div></div></div>`;
}
function statusPill(g){ return `<span class="pill s-${g.status}" data-a="cycle" data-id="${g.id}" style="cursor:pointer" title="Tap to move to the next stage">${STATUSES.find(s => s[0] === g.status)?.[1]}</span>`; }
function vGifts(){
  let L = S.gifts.filter(g => (!filt.person || g.person === filt.person) && (!filt.status || g.status === filt.status) && (!filt.q || (g.title + g.store + (person(g.person)?.name||"")).toLowerCase().includes(filt.q.toLowerCase())));
  return `<div class="top"><div><h1>Gifts</h1><p>Tap a status to move it along: Idea → To buy → Bought → Wrapped → Given.</p></div><button class="btn" data-a="addGift">+ Add a gift</button></div>
  <div class="tools"><input placeholder="Search…" value="${esc(filt.q)}" data-f="q"><select data-f="person"><option value="">Everyone</option>${S.people.map(p => `<option value="${p.id}" ${filt.person===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
  <select data-f="status"><option value="">Any status</option>${STATUSES.map(([k,l]) => `<option value="${k}" ${filt.status===k?"selected":""}>${l}</option>`).join("")}</select></div>

  ({ addGift: () => giftModal(), editGift: () => giftModal(G()), addPerson: () => personModal(), editPerson: () => personModal(S.people.find(p => p.id === id)),
     addCard: () => cardModal(), editCard: () => cardModal(S.cards.find(c => c.id === id)), addStock: () => stockModal(),
     cycle: () => { const g = G(); const i = STATUSES.findIndex(s => s[0] === g.status); g.status = STATUSES[(i + 1) % STATUSES.length][0]; save(); render(); },
     buy: () => { const g = G(); g.status = "bought"; if (g.cost === "" || g.cost == null) g.cost = g.est; save(); render(); },
     togStock: () => { const s = S.stockings.find(x => x.id === id); s.got = !s.got; save(); render(); }, delStock: () => { S.stockings = S.stockings.filter(x => x.id !== id); save(); render(); },
     togCard: () => { const c = S.cards.find(x => x.id === id); c[a.dataset.k] = !c[a.dataset.k]; save(); render(); },
     togCheck: () => { const c = S.checklist.find(x => x.id === id); c.done = !c.done; save(); render(); }, delCheck: () => { S.checklist = S.checklist.filter(x => x.id !== id); save(); render(); },
     addCheck: () => { if (!canAdd()) return; modal("Add a task", inp("text","Task","","text",true) + `<label class="w">When<select name="week">${[...new Set(S.checklist.map(c => c.week))].map(w => `<option>${esc(w)}</option>`).join("")}</select></label>`, v => { if (!v.text.trim()) return false; S.checklist.push({id:uid(), done:false, ...v}); created(); }); },
     ssAdd: () => { const i = document.getElementById("ssName"), n = i.value.trim(); if (!n) return; if (S.santa.names.includes(n)) { toast("That name's already in"); return; } if (!canAdd()) return; S.santa.names.push(n); S.santa.draw = null; created(); save(); render(); setTimeout(() => document.getElementById("ssName")?.focus(), 0); },
     ssDel: () => { S.santa.names.splice(+a.dataset.i, 1); S.santa.draw = null; save(); render(); },
     exAdd: () => { const x = document.getElementById("ex1").value, y = document.getElementById("ex2").value; if (x === y) { toast("Pick two different people"); return; } S.santa.excl.push([x, y]); S.santa.draw = null; save(); render(); },
     exDel: () => { S.santa.excl.splice(+a.dataset.i, 1); S.santa.draw = null; save(); render(); },
     ssDraw: () => { if (S.santa.draw && !confirm("Draw again? Everyone will need to look again.")) return; if (drawSanta()) { save(); render(); toast("Names drawn! 🎅"); } },
     ssShow: () => { const n = a.dataset.n; if (S.santa.revealed.includes(n) && !confirm(`${n} has already looked. Show again?`)) return; if (!confirm(`Are you ${n}? Make sure nobody else is looking!`)) return; ssReveal = n; render(); },
     ssHide: () => { if (!S.santa.revealed.includes(ssReveal)) S.santa.revealed.push(ssReveal); ssReveal = null; save(); render(); },
     tagStyle: () => { tagStyle = a.dataset.s; render(); },
     unlock: () => { if (document.getElementById("pin").value === S.settings.pin) { unlocked = true; render(); } else toast("Wrong PIN"); },
     logo: () => { const now = Date.now(); logoTaps = logoTaps.filter(t => now - t < 900); logoTaps.push(now); if (logoTaps.length >= 3) { logoTaps = []; panic(); } },
     backup: () => download(`christmas-hq-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S, null, 1), "application/json"),
     csv: () => { const rows = [["Gift","For","Shop","Status","Estimated","Actual","Give by","Link","Notes"], ...S.gifts.map(g => [g.title, person(g.person)?.name, g.store, STATUSES.find(s=>s[0]===g.status)?.[1], g.est, g.cost, g.giveBy, g.link, g.notes])];
            download("christmas-gifts.csv", "﻿" + rows.map(r => r.map(c => `"${String(c ?? "").replace(/"/g,'""')}"`).join(",")).join("\r\n"), "text/csv"); },
     loadSample: () => { if (confirm("Replace your list with the sample family?")) { const c = S.created; S = sample(); S.created = c; save(); render(); } },
     reset: () => { if (confirm("Clear everything? This can't be undone (download a backup first!)")) { const c = S.created; S = blank(); S.created = c; save(); render(); } }
  })[act]?.();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f) { filt[t.dataset.f] = t.value; const pos = t.selectionStart; render(); const n = document.querySelector(`[data-f="${t.dataset.f}"]`); if (n && t.tagName === "INPUT") { n.focus(); n.setSelectionRange(pos, pos); } }
  if (t.dataset.set) { S.settings[t.dataset.set] = t.value; save(); if (t.dataset.set === "theme") render(); if (t.dataset.set === "pin" && t.value) unlocked = true; }
  if (t.dataset.s) { S.santa[t.dataset.s] = t.value; save(); }
});
document.addEventListener("change", e => { if (e.target.dataset.a === "restore" && e.target.files[0]) { const r = new FileReader(); r.onload = () => { try { S = Object.assign(blank(), JSON.parse(r.result)); save(); render(); toast("Backup restored ✓"); } catch (err) { toast("That file isn't a Christmas HQ backup"); } }; r.readAsText(e.target.files[0]); } });
function download(name, text, type){ const b = new Blob([text], {type}), u = URL.createObjectURL(b), l = document.createElement("a"); l.href = u; l.download = name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); }
render();
</script>

<script>
// Offline prayer-time calculation (standard astronomical method, as used by PrayTimes.org).
// prayTimes(dateUTCmidnight, lat, lng, {fajr, isha | ishaMin, asr: 1|2, elev}) -> {fajr, sunrise, dhuhr, asr, maghrib, isha} as Date objects (UTC instants)
const PT_METHODS = {
  mwl:     {name: "Muslim World League", fajr: 18, isha: 17},
  msc:     {name: "Moonsighting Committee (UK)", fajr: 18, isha: 18, msc: true, off: {dhuhr: 5, maghrib: 3}},
  isna:    {name: "ISNA (North America)", fajr: 15, isha: 15},
  karachi: {name: "Karachi (Pakistan, India, Bangladesh)", fajr: 18, isha: 18},
  makkah:  {name: "Umm al-Qura (Saudi Arabia)", fajr: 18.5, ishaMin: 120},   // Isha is 2 hours after Maghrib in Ramadan
  egypt:   {name: "Egyptian Authority", fajr: 19.5, isha: 17.5},
  // official safety minutes, checked against published Diyanet (Istanbul) and Kemenag (Jakarta) timetables
  turkey:  {name: "Diyanet (Turkey)", fajr: 18, isha: 17, off: {sunrise: -7, dhuhr: 4, asr: 5, maghrib: 7, isha: 1}},
  kemenag: {name: "Kemenag (Indonesia)", fajr: 20, isha: 18, off: {fajr: 2, sunrise: -2, dhuhr: 2, asr: 2, maghrib: 3, isha: 2}},
  jakim:   {name: "JAKIM (Malaysia)", fajr: 20, isha: 18, off: {fajr: 2, sunrise: -2, dhuhr: 2, asr: 2, maghrib: 2, isha: 2}},
  gulf:    {name: "Gulf region", fajr: 19.5, ishaMin: 90},
};
function prayTimes(date, lat, lng, o) {
  const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
  const fix = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };
  const y = date.getUTCFullYear(), m = date.getUTCMonth() + 1, d = date.getUTCDate();

ँदी की क़ीमत लिखें।", "bn": "নিসাব হিসাব করতে সোনা বা রুপার দাম লিখুন।", "tl": "Ilagay ang presyo ng ginto o pilak para makalkula ang nisab.", "tr": "Nisabı hesaplamak için altın veya gümüş fiyatını girin.", "id": "Masukkan harga emas atau perak untuk menghitung nisab."}, "zakat_note": {"en": "Zakat is due on wealth above the nisab that you have held for a full lunar year. Rules on some assets (pensions, jewellery worn every day, property) differ between scholars, so check with a scholar or a trusted zakat organisation.", "ur": "زکوٰۃ اس مال پر واجب ہے جو نصاب سے زیادہ ہو اور اس پر پورا قمری سال گزر جائے۔ کچھ چیزوں (پنشن، روز پہنے جانے والے زیور، جائیداد) کے بارے میں علماء کی رائے مختلف ہے، اس لیے کسی عالم یا معتبر زکوٰۃ ادارے سے پوچھ لیں۔", "hi": "ज़कात उस माल पर वाजिब है जो निसाब से ज़्यादा हो और उस पर पूरा क़मरी साल गुज़र जाए। कुछ चीज़ों (पेंशन, रोज़ पहने जाने वाले ज़ेवर, जायदाद) पर उलमा की राय अलग है, इसलिए किसी आलिम या भरोसेमंद ज़कात संस्था से पूछ लें।", "bn": "নিসাবের বেশি সম্পদ পূর্ণ এক চান্দ্র বছর থাকলে যাকাত ফরজ। কিছু সম্পদ (পেনশন, প্রতিদিন পরা গয়না, সম্পত্তি) নিয়ে আলেমদের মত ভিন্ন, তাই একজন আলেম বা বিশ্বস্ত যাকাত সংস্থাকে জিজ্ঞেস করুন।", "tl": "Ang zakat ay para sa yamang lampas sa nisab na hawak mo nang buong taong lunar. Magkakaiba ang pananaw ng mga iskolar sa ilang ari-arian (pensiyon, alahas na isinusuot araw-araw, bahay at lupa), kaya magtanong sa iskolar o mapagkakatiwalaang organisasyon ng zakat.", "tr": "Zekât, nisabın üzerindeki ve üzerinden tam bir kameri yıl geçen servete düşer. Bazı varlıklar (emeklilik fonu, her gün takılan ziynet, gayrimenkul) hakkında âlimlerin görüşleri farklıdır; bir âlime veya güvenilir bir zekât kurumuna danışın.", "id": "Zakat wajib atas harta di atas nisab yang dimiliki selama satu tahun hijriah penuh. Hukum beberapa aset (dana pensiun, perhiasan yang dipakai sehari-hari, properti) berbeda di antara ulama, jadi tanyakan kepada ulama atau lembaga zakat tepercaya."}, "fitr": {"en": "Zakat al-Fitr", "ur": "زکوٰۃ الفطر (فطرانہ)", "hi": "ज़कातुल फ़ित्र (फ़ितरा)", "bn": "যাকাতুল ফিতর (ফিতরা)", "tl": "Zakat al-Fitr", "tr": "Fıtır sadakası", "id": "Zakat fitrah"}, "fitr_s": {"en": "Due for every member of the family, paid before the Eid prayer. Use the amount your local mosque announces.", "ur": "خاندان کے ہر فرد کی طرف سے واجب، عید کی نماز سے پہلے ادا کریں۔ مقامی مسجد کی اعلان کردہ رقم استعمال کریں۔", "hi": "परिवार के हर सदस्य की तरफ़ से वाजिब, ईद की नमाज़ से पहले अदा करें। स्थानीय मस्जिद की बताई रक़म इस्तेमाल करें।", "bn": "পরিবারের প্রত্যেক সদস্যের জন্য ফরজ, ঈদের নামাজের আগে আদায় করুন। স্থানীয় মসজিদের ঘোষিত পরিমাণ ব্যবহার করুন।", "tl": "Para sa bawat miyembro ng pamilya, ibinibigay bago ang dasal ng Eid. Gamitin ang halagang inanunsyo ng lokal na masjid.", "tr": "Ailenin her ferdi için verilir, bayram namazından önce ödenir. Yerel caminizin açıkladığı miktarı kullanın.", "id": "Wajib untuk setiap anggota keluarga, dibayar sebelum shalat Id. Gunakan jumlah yang diumumkan masjid setempat."}, "people": {"en": "People in family", "ur": "خاندان کے افراد", "hi": "परिवार के लोग", "bn": "পরিবারের সদস্য", "tl": "Bilang ng tao sa pamilya", "tr": "Aile fert sayısı", "id": "Jumlah anggota keluarga"}, "per_person": {"en": "Amount per person", "ur": "فی کس رقم", "hi": "प्रति व्यक्ति रक़म", "bn": "জনপ্রতি পরিমাণ", "tl": "Halaga bawat tao", "tr": "Kişi başı miktar", "id": "Jumlah per orang"}, "total": {"en": "Total", "ur": "کل", "hi": "कुल", "bn": "মোট", "tl": "Kabuuan", "tr": "Toplam", "id": "Total"}, "fidya": {"en": "Fidya", "ur": "فدیہ", "hi": "फ़िदया", "bn": "ফিদিয়া", "tl": "Fidya", "tr": "Fidye", "id": "Fidyah"}, "fidya_s": {"en": "For those who cannot fast and will not be able to make the fasts up (for example, long-term illness or old age): feed a person in need for each day missed.", "ur": "ان لوگوں کے لیے جو روزہ نہیں رکھ سکتے اور بعد میں قضا بھی نہیں کر سکیں گے (مثلاً لمبی بیماری یا بڑھاپا): ہر روزے کے بدلے ایک ضرورت مند کو کھانا کھلائیں۔", "hi": "उन लोगों के लिए जो रोज़ा नहीं रख सकते और बाद में क़ज़ा भी नहीं कर पाएँगे (जैसे लंबी बीमारी या बुढ़ापा): हर रोज़े के बदले एक ज़रूरतमंद को खाना खिलाएँ।", "bn": "যারা রোজা রাখতে পারেন না এবং পরে কাজাও করতে পারবেন না (যেমন দীর্ঘ অসুস্থতা বা বার্ধক্য): প্রতিটি রোজার বদলে একজন অভাবীকে খাওয়ান।", "tl": "Para sa mga hindi makapag-ayuno at hindi na rin makakabayad (hal. matagal na sakit o katandaan): pakainin ang isang nangangailangan sa bawat araw na hindi naayunuhan.", "tr": "Oruç tutamayan ve kaza da edemeyecek olanlar için (örneğin süreğen hastalık veya yaşlılık): tutulamayan her gün için bir yoksulu doyurun.", "id": "Bagi yang tidak mampu berpuasa dan tidak akan mampu menggantinya (misalnya sakit menahun atau usia lanjut): beri makan satu orang miskin untuk setiap hari yang ditinggalkan."}, "fidya_days": {"en": "Days", "ur": "دن", "hi": "दिन", "bn": "দিন", "tl": "Araw", "tr": "Gün", "id": "Hari"}, "per_day_amt": {"en": "Amount per day", "ur": "فی دن رقم", "hi": "प्रति दिन रक़म", "bn": "প্রতিদিনের পরিমাণ", "tl": "Halaga bawat araw", "tr": "Günlük miktar", "id": "Jumlah per hari"}, "kaffarah": {"en": "Kaffarah", "ur": "کفارہ", "hi": "कफ़्फ़ारा", "bn": "কাফফারা", "tl": "Kaffarah", "tr": "Kefaret", "id": "Kafarat"}, "kaffarah_s": {"en": "Breaking a Ramadan fast on purpose without a valid reason needs kaffarah: fasting 60 days in a row, or if that is truly not possible, feeding 60 people in need. Schools of thought differ on the details, so please ask a scholar.", "ur": "بغیر شرعی عذر کے جان بوجھ کر رمضان کا روزہ توڑنے پر کفارہ ہے: مسلسل 60 روزے، یا اگر واقعی ممکن نہ ہو تو 60 مسکینوں کو کھانا کھلانا۔ تفصیلات میں مسالک کا اختلاف ہے، اس لیے کسی عالم سے پوچھیں۔", "hi": "बिना शरई उज़्र के जान-बूझकर रमज़ान का रोज़ा तोड़ने पर कफ़्फ़ारा है: लगातार 60 रोज़े, या अगर सच में मुमकिन न हो तो 60 ज़रूरतमंदों को खाना खिलाना। तफ़सील में मसलकों में फ़र्क़ है, इसलिए किसी आलिम से पूछें।", "bn": "বৈধ কারণ ছাড়া ইচ্ছাকৃতভাবে রমজানের রোজা ভাঙলে কাফফারা দিতে হয়: একটানা ৬০টি রোজা, বা সত্যিই সম্ভব না হলে ৬০ জন অভাবীকে খাওয়ানো। বিস্তারিত বিষয়ে মাজহাবভেদে মতভেদ আছে, তাই একজন আলেমকে জিজ্ঞেস করুন।", "tl": "Ang sadyang pagsira ng pag-aayuno sa Ramadan nang walang wastong dahilan ay nangangailangan ng kaffarah: pag-aayuno nang 60 sunod-sunod na araw, o kung talagang hindi kaya, pagpapakain sa 60 nangangailangan. Magkakaiba ang mga paaralan sa detalye, kaya magtanong sa iskolar.", "tr": "Geçerli bir mazeret olmadan Ramazan orucunu kasten bozmak kefaret gerektirir: art arda 60 gün oruç, bu gerçekten mümkün değilse 60 yoksulu doyurmak. Ayrıntılarda mezhepler farklıdır; lütfen bir âlime danışın.", "id": "Sengaja membatalkan puasa Ramadan tanpa uzur yang sah mewajibkan kafarat: puasa 60 hari berturut-turut, atau jika benar-benar tidak mampu, memberi makan 60 orang miskin. Mazhab berbeda dalam rinciannya, jadi tanyakan kepada ulama."}, "sadaqah_log": {"en": "Sadaqah log", "ur": "صدقہ کا ریکارڈ", "hi": "सदक़ा का रिकॉर्ड", "bn": "সদকার হিসাব", "tl": "Talaan ng sadaqah", "tr": "Sadaka kaydı", "id": "Catatan sedekah"}, "amount": {"en": "Amount", "ur": "رقم", "hi": "रक़म", "bn": "পরিমাণ", "tl": "Halaga", "tr": "Tutar", "id": "Jumlah"}, "note": {"en": "Note (optional)", "ur": "نوٹ (اختیاری)", "hi": "नोट (वैकल्पिक)", "bn": "নোট (ঐচ্ছিক)", "tl": "Tala (opsyonal)", "tr": "Not (isteğe bağlı)", "id": "Catatan (opsional)"}, "add": {"en": "Add", "ur": "شامل کریں", "hi": "जोड़ें", "bn": "যোগ করুন", "tl": "Idagdag", "tr": "Ekle", "id": "Tambah"}, "delete": {"en": "Delete", "ur": "حذف", "hi": "हटाएँ", "bn": "মুছুন", "tl": "Burahin", "tr": "Sil", "id": "Hapus"}, "meal_plan": {"en": "Meal planner", "ur": "کھانے کا پلان", "hi": "खाने का प्लान", "bn": "খাবারের পরিকল্পনা", "tl": "Plano ng pagkain", "tr": "Yemek planı", "id": "Rencana menu"}, "suhoor": {"en": "Suhoor", "ur": "سحری", "hi": "सहरी", "bn": "সাহরি", "tl": "Suhoor", "tr": "Sahur", "id": "Sahur"}, "iftar_meal": {"en": "Iftar", "ur": "افطار", "hi": "इफ़्तार", "bn": "ইফতার", "tl": "Iftar", "tr": "İftar", "id": "Berbuka"}, "shopping": {"en": "Shopping list", "ur": "خریدا riksa kembali dengan panduan PDF Anda."}, "unlocked_ok": {"en": "Full version unlocked.", "ur": "مکمل ورژن کھل گیا۔", "hi": "पूरा वर्ज़न अनलॉक हो गया।", "bn": "পুরো সংস্করণ আনলক হয়েছে।", "tl": "Na-unlock na ang buong bersiyon.", "tr": "Tam sürümün kilidi açıldı.", "id": "Versi lengkap sudah terbuka."}, "a2hs": {"en": "Tip: on iPhone tap Share → Add to Home Screen (Android: ⋮ → Add to Home screen) to use it like an app. It works offline too.", "ur": "مشورہ: آئی فون پر Share → Add to Home Screen دبائیں (اینڈرائیڈ: ⋮ → Add to Home screen) تاکہ یہ ایپ کی طرح چلے۔ یہ آف لائن بھی چلتی ہے۔", "hi": "सुझाव: iPhone पर Share → Add to Home Screen दबाएँ (Android: ⋮ → Add to Home screen) ताकि यह ऐप की तरह चले। यह ऑफ़लाइन भी चलता है।", "bn": "টিপ: iPhone-এ Share → Add to Home Screen চাপুন (Android: ⋮ → Add to Home screen), তাহলে এটি অ্যাপের মতো চলবে। অফলাইনেও কাজ করে।", "tl": "Tip: sa iPhone, i-tap ang Share → Add to Home Screen (Android: ⋮ → Add to Home screen) para magamit itong parang app. Gumagana rin offline.", "tr": "İpucu: iPhone'da Paylaş → Ana Ekrana Ekle'ye dokunun (Android: ⋮ → Ana ekrana ekle), uygulama gibi kullanın. Çevrimdışı da çalışır.", "id": "Tips: di iPhone ketuk Bagikan → Tambah ke Layar Utama (Android: ⋮ → Tambahkan ke layar utama) agar bisa dipakai seperti aplikasi. Bisa juga offline."}, "locked": {"en": "Included in the full app", "ur": "مکمل ایپ میں شامل ہے", "hi": "पूरे ऐप में शामिल है", "bn": "পুরো অ্যাপে অন্তর্ভুক্ত", "tl": "Kasama sa buong app", "tr": "Tam uygulamada mevcut", "id": "Tersedia di aplikasi lengkap"}}, "DUAS": [{"id": "moon", "cat": "moon", "title": {"en": "On seeing the new moon", "ur": "نیا چاند دیکھنے کی دعا", "hi": "नया चाँद देखने की दुआ", "bn": "নতুন চাঁদ দেখার দোয়া", "tl": "Sa pagkakita ng bagong buwan", "tr": "Hilali görünce", "id": "Doa melihat hilal"}, "ar": "اللّٰهُمَّ أَهِلَّهُ عَلَيْنَا بِالْيُمْنِ وَالْإِيمَانِ، وَالسَّلَامَةِ وَالْإِسْلَامِ، رَبِّي وَرَبُّكَ اللّٰهُ", "tr_": "Allahumma ahillahu 'alayna bil-yumni wal-iman, was-salamati wal-Islam. Rabbi wa Rabbukallah.", "pr": {"hi": "अल्लाहुम्मा अहिल्लहू अलैना बिल्युम्नि वल ईमान, वस्सलामति वल इस्लाम। रब्बी व रब्बुकल्लाह।", "bn": "আল্লাহুম্মা আহিল্লাহু আলাইনা বিল ইয়ুমনি ওয়াল ঈমান, ওয়াস সালামাতি ওয়াল ইসলাম। রাব্বি ওয়া রাব্বুকাল্লাহ।", "tr": "Allâhümme ehillehû aleynâ bi'l-yümni ve'l-îmân, ve's-selâmeti ve'l-İslâm. Rabbî ve Rabbükellâh.", "id": "Allāhumma ahillahū 'alainā bil yumni wal īmān, was salāmati wal Islām. Rabbī wa Rabbukallāh."}, "m": {"en": "O Allah, bring this moon over us with blessing and faith, with safety and Islam. My Lord and your Lord is Allah.", "ur": "اے اللہ! اس چاند کو ہم پر برکت اور ایمان، سلامتی اور اسلام کے ساتھ طلوع فرما۔ (اے چاند) میرا اور تیرا رب اللہ ہے۔", "hi": "ऐ अल्लाह! इस चाँद को हम पर बरकत और ईमान, सलामती और इस्लाम के साथ निकाल। (ऐ चाँद) मेरा और तेरा रब अल्लाह है।", "bn": "হে আল্লাহ! এই চাঁদকে আমাদের উপর বরকত ও ঈমান, শান্তি ও ইসলামের সাথে উদিত করুন। (হে চাঁদ) আমার ও তোমার রব আল্লাহ।", "tl": "O Allah, palitawin Mo ang buwang ito sa amin nang may pagpapala at pananampalataya, kaligtasan at Islam. Ang aking Panginoon at ang iyong Panginoon ay si Allah.", "tr": "Allah'ım! Bu hilali üzerimize bereket ve imanla, esenlik ve İslam'la doğdur. Benim de senin de Rabbin Allah'tır.", "id": "Ya Allah, terbitkanlah bulan ini atas kami dengan keberkahan dan iman, keselamatan dan Islam. Tuhanku dan Tuhanmu adalah Allah."}, "src": "Sunan at-Tirmidhi 3451"}, {"id": "niyyah", "cat": "fast", "title": {"en": "Intention for the fast", "ur": "روزے کی نیت", "hi": "रोज़े की नीयत", "bn": "রোজার নিয়ত", "tl": "Intensiyon sa pag-aayuno", "tr": "Oruç niyeti", "id": "Niat puasa"}, "ar": "وَبِصَوْمِ غَدٍ نَّوَيْتُ مِنْ شَهْرِ رَمَضَانَ", "tr_": "Wa bi-sawmi ghadin nawaytu min shahri Ramadan.", "pr": {"hi": "व बिसौमि ग़दिन नवैतु मिन शह्रि रमज़ान।", "bn": "ওয়া বিসাওমি গাদিন নাওয়াইতু মিন শাহরি রমাদান।", "tr": "Ve bi-savmi ğadin neveytü min şehri Ramazân.", "id": "Wa bishaumi ghadin nawaitu min syahri Ramaḍān."}, "m": {"en": "I intend to fast tomorrow, in the month of Ramadan.", "ur": "میں نے کل کے رمضان کے روزے کی نیت کی۔", "hi": "मैंने कल के रमज़ान के रोज़े की नीयत की।", "bn": "আমি আগামীকাল রমজান মাসের রোজার নিয়ত করলাম।", "tl": "Nilalayon kong mag-ayuno bukas, sa buwan ng Ramadan.", "tr": "Yarın Ramazan ayının orucunu tutmaya niyet ettim.", "id": "Aku berniat puasa esok hari di bulan Ramadan."}, "src": "Commonly recited (not from a hadith)", "note": {"en": "The intention is in your heart; you don't have to say it out loud. These words are a commonly used wording, not from a hadith.", "ur": "نیت دل کا ارادہ ہے، زبان سے کہنا ضروری نہیں۔ یہ الفاظ عام طور پر پڑھے جاتے ہیں، حدیث سے نہیں۔", "hi": "नीयत दिल का इरादा है, ज़बान से कहना ज़रूरी नहीं। ये अल्फ़ाज़ आम तौर पर पढ़े जाते हैं, हदीस से नहीं।", "bn": "নিয়ত হলো অন্তরের সংকল্প, মুখে বলা জরুরি নয়। এই শব্দগুলো প্রচলিত, হাদিস থেকে নয়।", "tl": "Ang intensiyon ay nasa puso; hindi kailangang bigkasin. Karaniwang ginagamit ang mga salitang ito, hindi mula sa hadith.", "tr": "Niyet kalbin kastıdır, dille söylemek şart değildir. Bu ifade yaygın olarak okunur, hadisten değildir.", "id": "Niat ada di dalam hati, tidak wajib diucapkan. Lafaz ini lazim dibaca, bukan dari hadis."}}, {"id": "iftar", "cat": "iftar", "title": {"en": "When breaking the fast", "ur": "افطار کی دعا", "hi": "इफ़्तार की दुआ", "bn": "ইফতারের দোয়া", "tl": "Sa pagbubukas ng ayuno", "tr": "İftar duası", "id": "Doa berbuka puasa"}, "ar": "ذَهَبَ الظَّمَأُ، وَابْتَلَّتِ الْعُرُوقُ، وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللّٰهُ", "tr_": "Dhahabaz-zama'u wabtallatil-'uruqu wa thabatal-ajru in sha'Allah.", "pr": {"hi": "ज़हबज़्ज़मउ, वब्तल्लतिल उरूक़ु, व सबतल अज्रु इन शा अल्लाह।", "bn": "যাহাবায যামাউ, ওয়াবতাল্লাতিল উরুকু, ওয়া সাবাতাল আজরু ইনশাআল্লাহ।", "tr": "Zehebe'z-zameü ve'btelleti'l-urûku ve sebete'l-ecru inşâallâh.", "id": "Dzahabaẓ ẓama'u wabtallatil 'urūqu wa tsabatal ajru in syā'allāh."}, "m": {"en": "The thirst has gone, the veins are moistened, and the reward is certain, if Allah wills.", "ur": "پیاس بجھ گئی، رگیں تر ہو گئیں، اور اجر ثابت ہو گیا ان شاء اللہ۔", "hi": "प्यास बुझ गई, रगें तर हो गईं, और अज्र पक्का हो गया इन शा अल्लाह।", "bn": "তৃষ্ণা দূর হলো, শিরাগুলো সিক্ত হলো, আর ইনশাআল্লাহ প্রতিদান নিশ্চিত হলো।", "tl": "Nawala ang uhaw, nabasa ang mga ugat, at tiyak ang gantimpala, kung loloobin ni Allah.", "tr": "Susuzluk gitti, damarlar ıslandı ve inşallah ecir sabit oldu.", "id": "Telah hilang dahaga, urat-urat telah basah, dan pahala telah tetap, insya Allah."}, "src": "Sunan Abi Dawud 2357"}, {"id": "iftar2", "cat": "iftar", "title": {"en": "Also said at iftar", "ur": "افطار پر یہ بھی پڑھا جاتا ہے", "hi": "इफ़्तार पर यह भी पढ़ा जाता है", "bn": "ইফতারে এটিও পড়া হয়", "tl": "Sinasabi rin sa iftar", "tr": "İftarda bu da okunur", "id": "Juga dibaca saat berbuka"}, "ar": "اللّٰهُمَّ لَكَ صُمْتُ، وَعَلَى رِزْقِكَ أَفْطَرْتُ", "tr_": "Allahumma laka sumtu, wa 'ala rizqika aftartu.", "pr": {"hi": "अल्लाहुम्मा लका सुम्तु, व अला रिज़्क़िका अफ़्तर्तु।", "bn": "আল্লাহুম্মা লাকা সুমতু, ওয়া আলা রিযকিকা আফতারতু।", "tr": "Allâhümme leke sumtü ve alâ rızkıke eftartü.", "id": "Allāhumma laka ṣumtu, wa 'alā rizqika afṭartu."}, "m": {"en": "O Allah, for You I have fasted, and with Your provision I break my fast.", "ur": "اے اللہ! میں نے تیرے لیے روزہ رکھا اور تیرے رزق پر افطار کیا۔", "hi": "ऐ अल्लाह! मैंने तेरे लिए रोज़ा रखा और तेरे रिज़्क़ पर इफ़्तार किया।", "bn": "হে আল্লাহ! আমি তোমার জন্য রোজা রেখেছি এবং তোমার রিজিকে ইফতার করছি।", "tl": "O Allah, para sa Iyo ako nag-ayuno, at sa Iyong biyaya ako nagbubukas ng ayuno.", "tr": "Allah'ım! Senin için oruç tuttum ve Senin rızkınla iftar ettim.", "id": "Ya Allah, untuk-Mu aku berpuasa dan dengan rezeki-Mu aku berbuka."}, "src": "Sunan Abi Dawud 2358 (a weak chain; widely recited)", "note": {"en": "Scholars graded this narration as weak, but it is very widely recited. The dua above it is the stronger narration.", "ur": "علماء نے اس روایت کو ضعیف کہا ہے، لیکن یہ بہت عام پڑھی جاتی ہے۔ اوپر والی دعا کی سند زیادہ مضبوط ہے۔", "hi": "उलमा ने इस रिवायत को ज़ईफ़ कहा है, लेकिन यह बहुत आम पढ़ी जाती है। ऊपर वाली दुआ की सनद ज़्यादा मज़बूत है।", "bn": "আলেমগণ এই বর্ণনাকে দুর্বল বলেছেন, তবে এটি ব্যাপকভাবে পড়া হয়। উপরের দোয়াটির সনদ বেশি শক্তিশালী।", "tl": "Itinuring ng mga iskolar na mahina ang ulat na ito, ngunit malawak itong binibigkas. Mas matibay ang du'a sa itaas.", "tr": "Âlimler bu rivayeti zayıf saymıştır, ancak çok yaygın okunur. Üstteki duanın rivayeti daha sağlamdır.", "id": "Ulama menilai riwayat ini lemah, tetapi sangat lazim dibaca. Doa di atasnya lebih kuat riwayatnya."}}, {"id": "host", "cat": "iftar", "title": {"en": "For the host who gives you iftar", "ur": "افطار کرانے والے کے لیے دعا", "hi": "इफ़्तार कराने वाले के लिए दुआ", "bn": "ইফতার করানো ব্যক্তির জন্য দোয়া", "tl": "Para sa nagpakain sa iyo ng iftar", "tr": "İftar verene dua", "id": "Doa untuk yang memberi buka puasa"}, "ar": "أَفْطَرَ عِنْدَكُمُ الصَّائِمُونَ، وَأَكَلَ طَعَامَكُمُ الْأَبْرَارُ، وَصَلَّتْ عَلَيْكُمُ الْمَلَائِكَةُ", "tr_": "Aftara 'indakumus-sa'imun, wa akala ta'amakumul-abrar, wa sallat 'alaykumul-mala'ikah.", "pr": {"hi": "अफ़्तरा इन्दकुमुस्साइमून, व अकला तआमकुमुल अबरार, व सल्लत अलैकुमुल मलाइका।", "bn": "আফতারা ইনদাকুমুস সায়িমুন, ওয়া আকালা তাআমাকুমুল আবরার, ওয়া সাল্লাত আলাইকুমুল মালাইকাহ।", "tr": "Eftara indekümü's-sâimûn, ve ekele taâmekümü'l-ebrâr, ve sallet aleykümü'l-melâike.", "id": "Afṭara 'indakumuṣ ṣā'imūn, wa akala ṭa'āmakumul abrār, wa ṣallat 'alaikumul malā'ikah."}, "m": {"en": "May those who fast break their fast with you, may the righteous eat your food, and may the angels pray for you.", "ur": "روزہ دار تمہارے ہاں افطار کریں، نیک لوگ تمہارا کھانا کھائیں، اور فرشتے تمہارے لیے دعا کریں۔", "hi": "रोज़ेदार तुम्हारे यहाँ इफ़्तार करें, नेक लोग तुम्हारा खाना खाएँ, और फ़रिश्ते तुम्हारे लिए दुआ करें।", "bn": "রোজাদাররা তোমাদের কাছে ইফতার করুক, নেককাররা তোমাদের খাবার খাক, আর ফেরেশতারা তোমাদের জন্য দোয়া করুক।", "tl": "Nawa'y magbukas ng ayuno sa inyo ang mga nag-aayuno, kainin ng mabubuti ang inyong pagkain, at ipagdasal kayo ng mga anghel.", "tr": "Oruçlular yanınızda iftar etsin, iyiler yemeğinizi yesin ve melekler size dua etsin.", "id": "Semoga orang-orang yang berpuasa berbuka di tempat kalian, orang-orang baik memakan makanan kalian, dan para malaikat mendoakan kalian."}, "src": "Sunan Abi Dawud 3854"}, {"id": "bismillah", "cat": "iftar", "title": {"en": "Before eating (and if you forgot)", "ur": "کھانے سے پہلے (اور بھول جائیں تو)", "hi": "खाने से पहले (और भूल जाएँ तो)", "bn": "খাওয়ার আগে (ভুলে গেলে)", "tl": "Bago kumain (at kung nakalimutan)", "tr": "Yemekten önce (ve unutursanız)", "id": "Sebelum makan (dan jika lupa)"}, "ar": "بِسْمِ اللّٰهِ ... بِسْمِ اللّٰهِ أَوَّلَهُ وَآخِرَهُ", "tr_": "Bismillah. (If you forgot at the start:) Bismillahi awwalahu wa akhirah.", "pr": {"hi": "बिस्मिल्लाह। (शुरू में भूल जाएँ तो:) बिस्मिल्लाहि अव्वलहू व आख़िरह।", "bn": "বিসমিল্লাহ। (শুরুতে ভুলে গেলে:) বিসমিল্লাহি আওয়ালাহু ওয়া আখিরাহ।", "tr": "Bismillâh. (Başta unuttuysanız:) Bismillâhi evvelehû ve âhireh.", "id": "Bismillāh. (Jika lupa di awal:) Bismillāhi awwalahū wa ākhirah."}, "m": {"en": "In the name of Allah. (If you forgot:) In the name of Allah, at its beginning and its end.", "ur": "اللہ کے نام سے۔ (بھول جائیں تو:) اللہ کے نام سے، اس کے شروع میں اور آخر میں۔", "hi": "अल्लाह के नाम से। (भूल जाएँ तो:) अल्लाह के नाम से, इसके शुरू में और आख़िर में।", "bn": "আল্লাহর নামে। (ভুলে গেলে:) আল্লাহর নামে, এর শুরুতে ও শেষে।", "tl": "Sa ngalan ni Allah. (Kung nakalimutan:) Sa ngalan ni Allah, sa simula at sa wakas nito.", "tr": "Allah'ın adıyla. (Unuttuysanız:) Başında da sonunda da Allah'ın adıyla.", "id": "Dengan nama Allah. (Jika lupa:) Dengan nama Allah di awal dan akhirnya."}, "src": "Sunan Abi Dawud 3767 · Sunan at-Tirmidhi 1858"}, {"id": "after_meal", "cat": "iftar", "title": {"en": "After eating", "ur": "کھانے کے بعد", "hi": "खाने के बाद", "bn": "খাওয়ার পর", "tl": "Pagkatapos kumain", "tr": "Yemekten sonra", "id": "Setelah makan"}, "ar": "الْحَمْدُ لِلّٰهِ الَّذِي أَطْعَمَنِي هَذَا، وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ", "tr_": "Alhamdu lillahil-ladhi at'amani hadha, wa razaqanihi min ghayri hawlin minni wa la quwwah.", "pr": {"hi": "अल्हम्दु लिल्लाहिल्लज़ी अत्अमनी हाज़ा, व रज़क़नीहि मिन ग़ैरि हौलिन मिन्नी व ला क़ुव्वह।", "bn": "আলহামদু লিল্লাহিল্লাযি আতআমানি হাযা, ওয়া রাযাকানিহি মিন গাইরি হাওলিম মিন্নি ওয়ালা কুওয়াহ।", "tr": "Elhamdü lillâhillezî at'amenî hâzâ ve rezakanîhi min ğayri havlin minnî ve lâ kuvveh.", "id": "Alḥamdu lillāhilladzī aṭ'amanī hādzā, wa razaqanīhi min ghairi ḥaulin minnī wa lā quwwah."}, "m": {"en": "All praise is for Allah, who fed me this and provided it for me without any strength or power of my own.", "ur": "تمام تعریفیں اللہ کے لیے ہیں جس نے مجھے یہ کھلایا اور میری کسی طاقت و قوت کے بغیر مجھے عطا کیا۔", "hi": "सारी तारीफ़ अल्लाह के लिए है जिसने मुझे यह खिलाया और मेरी किसी ताक़त के बिना मुझे दिया।", "bn": "সব প্রশংসা আল্লাহর, যিনি আমাকে এটি খাওয়ালেন এবং আমার কোনো শক্তি-সামর্থ্য ছাড়াই এটি দান করলেন।", "tl": "Lahat ng papuri ay kay Allah na nagpakain sa akin nito at nagbigay nito nang walang sarili kong lakas o kapangyarihan.", "tr": "Bana bunu yediren ve benden hiçbir güç ve kuvvet olmaksızın bunu rızık olarak veren Allah'a hamdolsun.", "id": "Segala puji bagi Allah yang telah memberiku makanan ini dan merezekikannya kepadaku tanpa daya dan kekuatan dariku."}, "src": "Sunan Abi Dawud 4023 · Sunan at-Tirmidhi 3458"}, {"id": "fasting_reply", "cat": "fast", "title": {"en": "If someone argues with you while fasting", "ur": "روزے میں کوئی جھگڑے تو", "hi": "रोज़े में कोई झगड़े तो", "bn": "রোজা অবস্থায় কেউ ঝগড়া করলে", "tl": "Kung may makipagtalo habang nag-aayuno", "tr": "Oruçluyken biri sataşırsa", "id": "Jika ada yang mengajak bertengkar saat puasa"}, "ar": "إِنِّي صَائِمٌ، إِنِّي صَائِمٌ", "tr_": "Inni sa'im, inni sa'im.", "pr": {"hi": "इन्नी साइम, इन्नी साइम।", "bn": "ইন্নি সায়িম, ইন্নি সায়িম।", "tr": "İnnî sâim, innî sâim.", "id": "Innī ṣā'im, innī ṣā'im."}, "m": {"en": "I am fasting, I am fasting.", "ur": "میں روزے سے ہوں، میں روزے سے ہوں۔", "hi": "मैं रोज़े से हूँ, मैं रोज़े से हूँ।", "bn": "আমি রোজাদার, আমি রোজাদার।", "tl": "Ako ay nag-aayuno, ako ay nag-aayuno.", "tr": "Ben oruçluyum, ben oruçluyum.", "id": "Aku sedang berpuasa, aku sedang berpuasa."}, "src": "Sahih al-Bukhari 1904 · Sahih Muslim 1151"}, {"id": "qadr", "cat": "night", "title": {"en": "Laylat al-Qadr", "ur": "لیلۃ القدر کی دعا", "hi": "लैलतुल क़द्र की दुआ", "bn": "লাইলাতুল কদরের দোয়া", "tl": "Laylat al-Qadr", "tr": "Kadir Gecesi duası", "id": "Doa Lailatul Qadar"}, "ar": "اللّٰهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي", "tr_": "Allahumma innaka 'afuwwun tuhibbul-'afwa fa'fu 'anni.", "pr": {"hi": "अल्लाहुम्मा इन्नका अफ़ुव्वुन तुहिब्बुल अफ़्वा फ़अ्फ़ु अन्नी।", "bn": "আল্লাহুম্মা ইন্নাকা আফুউন তুহিব্বুল আফওয়া ফাফু আন্নি।", "tr": "Allâhümme inneke afüvvün tühibbü'l-afve fa'fü annî.", "id": "Allāhumma innaka 'afuwwun tuḥibbul 'afwa fa'fu 'annī."}, "m": {"en": "O Allah, You are the One who pardons, and You love to pardon, so pardon me.", "ur": "اے اللہ! تو معاف کرنے والا ہے، معافی کو پسند کرتا ہے، پس مجھے معاف فرما دے۔", "hi": "ऐ अल्लाह! तू माफ़ करने वाला है, माफ़ी को पसंद करता है, तो मुझे माफ़ फ़रमा दे।", "bn": "হে আল্লাহ! তুমি ক্ষমাশীল, ক্ষমা করতে ভালোবাসো, তাই আমাকে ক্ষমা করো।", "tl": "O Allah, Ikaw ang Mapagpatawad at mahal Mo ang pagpapatawad, kaya patawarin Mo ako.", "tr": "Allah'ım! Sen affedicisin, affetmeyi seversin; beni affet.", "id": "Ya Allah, Engkau Maha Pemaaf dan menyukai pemaafan, maka maafkanlah aku."}, "src": "Sunan at-Tirmidhi 3513 (the Prophet ﷺ taught it to Aisha RA)"}, {"id": "qunut", "cat": "night", "title": {"en": "Dua in Witr (Qunut)", "ur": "وتر کی دعا (قنوت)", "hi": "वित्र की दुआ (क़ुनूत)", "bn": "বিতরের দোয়া (কুনুত)", "tl": "Du'a sa Witr (Qunut)", "tr": "Vitirde kunut duası", "id": "Doa qunut witir"}, "ar": "اللّٰهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ، فَإِنَّكَ تَقْضِي وَلَا يُقْضَى عَلَيْكَ، وَإِنَّهُ لَا يَذِلُّ مَنْ وَالَيْتَ، تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ", "tr_": "Allahummahdini fiman hadayt, wa 'afini fiman 'afayt, wa tawallani fiman tawallayt, wa barik li fima a'tayt, wa qini sharra ma qadayt, fa innaka taqdi wa la yuqda 'alayk, wa innahu la yadhillu man walayt, tabarakta Rabbana wa ta'alayt.", "pr": {"hi": "अल्लाहुम्मह्दिनी फ़ीमन हदैत, व आफ़िनी फ़ीमन आफ़ैत, व तवल्लनी फ़ीमन तवल्लैत, व बारिक ली फ़ीमा अअ्तैत, व क़िनी शर्रा मा क़ज़ैत, फ़इन्नका तक़्ज़ी व ला युक़्ज़ा अलैक, व इन्नहू ला यज़िल्लु मन वालैत, तबारक्ता रब्बना व तआलैत।", "bn": "আল্লাহুম্মাহদিনি ফিমান হাদাইত, ওয়া আফিনি ফিমান আফাইত, ওয়া তাওয়াল্লানি ফিমান তাওয়াল্লাইত, ওয়া বারিক লি ফিমা আতাইত, ওয়া কিনি শাররা মা কাদাইত, ফাইন্নাকা তাকদি ওয়ালা ইউকদা আলাইক, ওয়া ইন্নাহু লা ইয়াযিল্লু মান ওয়ালাইত, তাবারাকতা রাব্বানা ওয়া তাআলাইত।", "tr": "Allâhümme'hdinî fîmen hedeyt, ve âfinî fîmen âfeyt, ve tevellenî fîmen teveleyt, ve bârik lî fîmâ a'tayt, ve kınî şerra mâ kadayt, fe inneke takdî ve lâ yukdâ aleyk, ve innehû lâ yezillü men vâleyt, tebârekte Rabbenâ ve teâleyt.", "id": "Allāhummahdinī fīman hadait, wa 'āfinī fīman 'āfait, wa tawallanī fīman tawallait, wa bārik lī fīmā a'ṭait, wa qinī syarra mā qaḍait, fa innaka taqḍī wa lā yuqḍā 'alaik, wa innahū lā yadzillu man wālait, tabārakta Rabbanā wa ta'ālait."}, "m": {"en": "O Allah, guide me among those You have guided, keep me well among those You have kept well, take care of me among those You take care of, bless what You have given me, and protect me from the harm of what You have decreed. You decree and nothing is decreed over You. The one You befriend is never humbled. Blessed and exalted are You, our Lord.", "ur": "اے اللہ! مجھے ہدایت دے ان میں جنہیں تو نے ہدایت دی، مجھے عافیت دے ان میں جنہیں تو نے عافیت دی، میری سرپرستی فرما ان میں جن کی تو نے سرپرستی کی، جو تو نے دیا اس میں برکت دے، اور جو تو نے فیصلہ کیا اس کے شر سے بچا۔ تو ہی فیصلہ کرتا ہے، تجھ پر کوئی فیصلہ نہیں ہوتا۔ جسے تو دوست بنائے وہ ذلیل نہیں ہوتا۔ اے ہمارے رب! تو بابرکت اور بلند ہے۔", "hi": "ऐ अल्लाह! मुझे हिदायत दे उनमें जिन्हें तूने हिदायत दी, मुझे आफ़ियत दे उनमें जिन्हें तूने आफ़ियत दी, मेरी सरपरस्ती फ़रमा उनमें जिनकी तूने सरपरस्ती की, जो तूने दिया उसमें बरकत दे, और जो तूने फ़ैसला किया उसके शर से बचा। तू ही फ़ैसला करता है, तुझ पर कोई फ़ैसला नहीं होता। जिसे तू दोस्त बनाए वह ज़लील नहीं होता। ऐ हमारे रब! तू बाबरकत और बुलंद है।", "bn": "হে আল্লাহ! যাদের তুমি হেদায়েত দিয়েছ, তাদের মধ্যে আমাকেও হেদায়েত দাও; যাদের তুমি নিরাপত্তা দিয়েছ, তাদের মধ্যে আমাকেও নিরাপত্তা দাও; যাদের তুমি অভিভাবক হয়েছ, আমারও অভিভাবক হও; যা দিয়েছ তাতে বরকত দাও; আর তোমার ফয়সালার অনিষ্ট থেকে রক্ষা করো। তুমিই ফয়সালা করো, তোমার উপর কেউ ফয়সালা করে না। তুমি যার বন্ধু, সে কখনো অপমানিত হয় না। হে আমাদের রব! তুমি বরকতময় ও মহান।", "tl": "O Allah, gabayan Mo ako kasama ng mga ginabayan Mo, pagalingin Mo ako kasama ng mga pinagaling Mo, alagaan Mo ako kasama ng mga inaalagaan Mo, pagpalain ang ibinigay Mo sa akin, at ingatan ako sa pinsala ng Iyong itinakda. Ikaw ang nagtatakda at walang nagtatakda laban sa Iyo. Ang Iyong kaibigan ay hindi kailanman maaaba. Mapagpala at Kataas-taasan Ka, aming Panginoon.", "tr": "Allah'ım! Hidayet verdiklerinle beraber beni de hidayete erdir; afiyet verdiklerinle beraber bana da afiyet ver; dost edindiklerinle beraber beni de dost edin; verdiklerini bana mübarek kıl ve hükmettiğin şeyin şerrinden beni koru. Çünkü Sen hükmedersin, Sana kimse hükmedemez. Senin dost edindiğin asla zelil olmaz. Rabbimiz! Sen yücesin, mübareksin.", "id": "Ya Allah, berilah aku petunjuk bersama orang yang Engkau beri petunjuk, berilah aku kesehatan bersama orang yang Engkau beri kesehatan, uruslah aku bersama orang yang Engkau urus, berkahilah apa yang Engkau berikan kepadaku, dan lindungilah aku dari keburukan apa yang Engkau takdirkan. Engkaulah yang menetapkan dan tidak ada yang menetapkan atas-Mu. Tidak akan hina orang yang Engkau lindungi. Mahaberkah Engkau, wahai Tuhan kami, dan Mahatinggi."}, "src": "Sunan Abi Dawud 1425 · Sunan at-Tirmidhi 464", "note": {"en": "Some schools recite a different Qunut (\"Allahumma inna nasta'inuka…\"). Follow the practice of your school or your imam.", "ur": "کچھ مسالک میں دوسری دعائے قنوت (اللّٰهُمَّ إِنَّا نَسْتَعِينُكَ…) پڑھی جاتی ہے۔ اپنے مسلک یا امام کے طریقے پر چلیں۔", "hi": "कुछ मसलकों में दूसरी दुआ-ए-क़ुनूत (अल्लाहुम्मा इन्ना नस्तईनुका…) पढ़ी जाती है। अपने मसलक या इमाम के तरीक़े पर चलें।", "bn": "কিছু মাজহাবে অন্য দোয়া কুনুত (আল্লাহুম্মা ইন্না নাসতাইনুকা…) পড়া হয়। আপনার মাজহাব বা ইমামের পদ্ধতি অনুসরণ করুন।", "tl": "May mga paaralang ibang Qunut ang binibigkas (\"Allahumma inna nasta'inuka…\"). Sundin ang gawi ng iyong paaralan o imam.", "tr": "Bazı mezheplerde farklı bir kunut (Allâhümme innâ neste'înüke…) okunur. Mezhebinizin veya imamınızın uygulamasına uyun.", "id": "Sebagian mazhab membaca qunut yang lain (\"Allāhumma innā nasta'īnuka…\"). Ikuti amalan mazhab atau imam Anda."}}, {"id": "after_witr", "cat": "night", "title": {"en": "After Witr", "ur": "وتر کے بعد", "hi": "वित्र के बाद", "bn": "বিতরের পর", "tl": "Pagkatapos ng Witr", "tr": "Vitirden sonra", "id": "Setelah witir"}, "ar": "سُبْحَانَ الْمَلِكِ الْقُدُّوسِ (×3)", "tr_": "Subhanal-Malikil-Quddus (3 times).", "pr": {"hi": "सुब्हानल मलिकिल क़ुद्दूस (3 बार)।", "bn": "সুবহানাল মালিকিল কুদ্দুস (৩ বার)।", "tr": "Sübhâne'l-Meliki'l-Kuddûs (3 kez).", "id": "Subḥānal Malikil Quddūs (3 kali)."}, "m": {"en": "Glory be to the King, the Most Holy (three times).", "ur": "پاک ہے بادشاہ، نہایت پاکیزہ (تین بار)۔", "hi": "पाक है बादशाह, बहुत पाकीज़ा (तीन बार)।", "bn": "পবিত্র মহান অধিপতি, অতি পবিত্র (তিনবার)।", "tl": "Luwalhati sa Hari, ang Kabanal-banalan (tatlong beses).", "tr": "Mülkün sahibi, her türlü eksiklikten münezzeh olan Allah'ı tesbih ederim (3 kez).", "id": "Mahasuci Raja Yang Mahasuci (3 kali)."}, "src": "Sunan Abi Dawud 1430 · Sunan an-Nasa'i 1699"}, {"id": "forgive", "cat": "daily", "title": {"en": "Asking forgiveness", "ur": "استغفار", "hi": "इस्तिग़फ़ार", "bn": "ইস্তিগফার", "tl": "Paghingi ng tawad", "tr": "İstiğfar", "id": "Istighfar"}, "ar": "أَسْتَغْفِرُ اللّٰهَ وَأَتُوبُ إِلَيْهِ", "tr_": "Astaghfirullaha wa atubu ilayh.", "pr": {"hi": "अस्तग़फ़िरुल्लाहा व अतूबु इलैह।", "bn": "আসতাগফিরুল্লাহা ওয়া আতুবু ইলাইহ।", "tr": "Estağfirullâhe ve etûbü ileyh.", "id": "Astaghfirullāha wa atūbu ilaih."}, "m": {"en": "I seek Allah's forgiveness and I turn back to Him.", "ur": "میں اللہ سے معافی مانگتا ہوں اور اسی کی طرف رجوع کرتا ہوں۔", "hi": "मैं अल्लाह से माफ़ी माँगता हूँ और उसी की तरफ़ लौटता हूँ।", "bn": "আমি আল্লাহর কাছে ক্ষমা চাই এবং তাঁর দিকে ফিরে যাই।", "tl": "Humihingi ako ng tawad kay Allah at nagbabalik-loob sa Kanya.", "tr": "Allah'tan bağışlanma dilerim ve O'na tövbe ederim.", "id": "Aku memohon ampun kepada Allah dan bertobat kepada-Nya."}, "src": "Sahih al-Bukhari 6307 (the Prophet ﷺ said it more than 70 times a day)"}, {"id": "rabbana", "cat": "daily", "title": {"en": "Good in this life and the next", "ur": "دنیا و آخرت کی بھلائی", "hi": "दुनिया और आख़िरत की भलाई", "bn": "দুনিয়া ও আখিরাতের কল্যাণ", "tl": "Kabutihan sa buhay na ito at sa kabila", "tr": "Dünya ve ahiret iyiliği", "id": "Kebaikan dunia dan akhirat"}, "ar": "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", "tr_": "Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina 'adhaban-nar.", "pr": {"hi": "रब्बना आतिना फ़िद्दुन्या हसनतंव व फ़िल आख़िरति हसनतंव व क़िना अज़ाबन्नार।", "bn": "রাব্বানা আতিনা ফিদ দুনইয়া হাসানাতাও ওয়া ফিল আখিরাতি হাসানাতাও ওয়া কিনা আযাবান নার।", "tr": "Rabbenâ âtinâ fi'd-dünyâ haseneten ve fi'l-âhirati haseneten ve kınâ azâbe'n-nâr.", "id": "Rabbanā ātinā fid dunyā ḥasanatan wa fil ākhirati ḥasanatan wa qinā 'adzāban nār."}, "m": {"en": "Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.", "ur": "اے ہمارے رب! ہمیں دنیا میں بھلائی دے اور آخرت میں بھلائی دے اور ہمیں آگ کے عذاب سے بچا۔", "hi": "ऐ हमारे रब! हमें दुनिया में भलाई दे और आख़िरत में भलाई दे और हमें आग के अज़ाब से बचा।", "bn": "হে আমাদের রব! আমাদের দুনিয়ায় কল্যাণ দাও, আখিরাতে কল্যাণ দাও এবং আগুনের শাস্তি থেকে রক্ষা করো।", "tl": "Aming Panginoon, bigyan Mo kami ng kabutihan sa mundong ito at kabutihan sa Kabilang-buhay, at iligtas Mo kami sa parusa ng Apoy.", "tr": "Rabbimiz! Bize dünyada da iyilik ver, ahirette de iyilik ver ve bizi ateş azabından koru.", "id": "Ya Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan lindungilah kami dari azab neraka."}, "src": "Qur'an 2:201"}, {"id": "parents", "cat": "daily", "title": {"en": "For your parents", "ur": "والدین کے لیے دعا", "hi": "माँ-बाप के लिए दुआ", "bn": "বাবা-মায়ের জন্য দোয়া", "tl": "Para sa mga magulang", "tr": "Anne baba için dua", "id": "Doa untuk orang tua"}, "ar": "رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", "tr_": "Rabbir-hamhuma kama rabbayani saghira.", "pr": {"hi": "रब्बिर्हम्हुमा कमा रब्बयानी सग़ीरा।", "bn": "রাব্বির হামহুমা কামা রাব্বায়ানি সাগিরা।", "tr": "Rabbirhamhümâ kemâ rabbeyânî sağîrâ.", "id": "Rabbirḥamhumā kamā rabbayānī ṣaghīrā."}, "m": {"en": "My Lord, have mercy on them both, as they raised me when I was small.", "ur": "اے میرے رب! ان دونوں پر رحم فرما جیسے انہوں نے بچپن میں میری پرورش کی۔", "hi": "ऐ मेरे रब! उन दोनों पर रहम फ़रमा जैसे उन्होंने बचपन में मेरी परवरिश की।", "bn": "হে আমার রব! তাঁদের দুজনের প্রতি দয়া করো, যেমন তাঁরা শৈশবে আমাকে লালন-পালন করেছেন।", "tl": "Aking Panginoon, kaawaan Mo silang dalawa, gaya ng pagpapalaki nila sa akin noong ako'y maliit.", "tr": "Rabbim! Onlar beni küçükken nasıl yetiştirdilerse, Sen de onlara öyle merhamet et.", "id": "Ya Tuhanku, sayangilah keduanya sebagaimana mereka mendidikku di waktu kecil."}, "src": "Qur'an 17:24"}, {"id": "takbeer", "cat": "eid", "title": {"en": "Eid takbeer", "ur": "عید کی تکبیر", "hi": "ईद की तकबीर", "bn": "ঈদের তাকবির", "tl": "Takbeer ng Eid", "tr": "Bayram tekbiri", "id": "Takbir hari raya"}, "ar": "اللّٰهُ أَكْبَرُ، اللّٰهُ أَكْبَرُ، لَا إِلٰهَ إِلَّا اللّٰهُ، وَاللّٰهُ أَكْبَرُ، اللّٰهُ أَكْبَرُ، وَلِلّٰهِ الْحَمْدُ", "tr_": "Allahu akbar, Allahu akbar, la ilaha illallah, wallahu akbar, Allahu akbar, wa lillahil-hamd.", "pr": {"hi": "अल्लाहु अकबर, अल्लाहु अकबर, ला इलाहा इल्लल्लाह, वल्लाहु अकबर, अल्लाहु अकबर, व लिल्लाहिल हम्द।", "bn": "আল্লাহু আকবার, আল্লাহু আকবার, লা ইলাহা ইল্লাল্লাহ, ওয়াল্লাহু আকবার, আল্লাহু আকবার, ওয়া লিল্লাহিল হামদ।", "tr": "Allâhu ekber, Allâhu ekber, lâ ilâhe illallâhu vallâhu ekber, Allâhu ekber ve lillâhi'l-hamd.", "id": "Allāhu akbar, Allāhu akbar, lā ilāha illallāh, wallāhu akbar, Allāhu akbar, wa lillāhil ḥamd."}, "m": {"en": "Allah is the Greatest, Allah is the Greatest. There is no god but Allah. Allah is the Greatest, Allah is the Greatest, and all praise is for Allah.", "ur": "اللہ سب سے بڑا ہے، اللہ سب سے بڑا ہے، اللہ کے سوا کوئی معبود نہیں، اللہ سب سے بڑا ہے، اللہ سب سے بڑا ہے، اور تمام تعریفیں اللہ کے لیے ہیں۔", "hi": "अल्लाह सबसे बड़ा है, अल्लाह सबसे बड़ा है, अल्लाह के सिवा कोई माबूद नहीं, अल्लाह सबसे बड़ा है, अल्लाह सबसे बड़ा है, और सारी तारीफ़ अल्लाह के लिए है।", "bn": "আল্লাহ সর্বশ্রেষ্ঠ, আল্লাহ সর্বশ্রেষ্ঠ, আল্লাহ ছাড়া কোনো উপাস্য নেই, আল্লাহ সর্বশ্রেষ্ঠ, আল্লাহ সর্বশ্রেষ্ঠ, আর সব প্রশংসা আল্লাহর।", "tl": "Si Allah ang Pinakadakila, si Allah ang Pinakadakila. Walang diyos kundi si Allah. Si Allah ang Pinakadakila, si Allah ang Pinakadakila, at kay Allah ang lahat ng papuri.", "tr": "Allah en büyüktür, Allah en büyüktür. Allah'tan başka ilah yoktur. Allah en büyüktür, Allah en büyüktür ve hamd Allah'a mahsustur.", "id": "Allah Mahabesar, Allah Mahabesar. Tidak ada tuhan selain Allah. Allah Mahabesar, Allah Mahabesar, dan segala puji bagi Allah."}, "src": "Reported from Ibn Mas'ud (RA), Musannaf Ibn Abi Shaybah"}, {"id": "eid_greet", "cat": "eid", "title": {"en": "Eid greeting", "ur": "عید کی مبارکباد", "hi": "ईद की मुबारकबाद", "bn": "ঈদের শুভেচ্ছা", "tl": "Pagbati sa Eid", "tr": "Bayram tebriki", "id": "Ucapan hari ra n başka ilah yoktur", "id": "Tiada tuhan selain Allah"}, "pr": {"hi": "ला इलाहा इल्लल्लाह", "bn": "লা ইলাহা ইল্লাল্লাহ", "tr": "Lâ ilâhe illallâh", "id": "Lā ilāha illallāh"}}, {"id": "istighfar", "ar": "أَسْتَغْفِرُ اللّٰهَ", "tr_": "Astaghfirullah", "n": 100, "m": {"en": "I seek Allah's forgiveness", "ur": "میں اللہ سے معافی مانگتا ہوں", "hi": "मैं अल्लाह से माफ़ी माँगता हूँ", "bn": "আমি আল্লাহর কাছে ক্ষমা চাই", "tl": "Humihingi ako ng tawad kay Allah", "tr": "Allah'tan bağışlanma dilerim", "id": "Aku memohon ampun kepada Allah"}, "pr": {"hi": "अस्तग़फ़िरुल्लाह", "bn": "আসতাগফিরুল্লাহ", "tr": "Estağfirullâh", "id": "Astaghfirullāh"}}, {"id": "salawat", "ar": "اللّٰهُمَّ صَلِّ عَلَى مُحَمَّدٍ", "tr_": "Allahumma salli 'ala Muhammad", "n": 100, "m": {"en": "O Allah, send blessings on Muhammad ﷺ", "ur": "اے اللہ! محمد ﷺ پر رحمت نازل فرما", "hi": "ऐ अल्लाह! मुहम्मद ﷺ पर रहमत नाज़िल फ़रमा", "bn": "হে আল্লাহ! মুহাম্মদ ﷺ-এর উপর রহমত বর্ষণ করো", "tl": "O Allah, pagpalain Mo si Muhammad ﷺ", "tr": "Allah'ım! Muhammed'e ﷺ salât eyle", "id": "Ya Allah, limpahkanlah shalawat kepada Muhammad ﷺ"}, "pr": {"hi": "अल्लाहुम्मा सल्लि अला मुहम्मद", "bn": "আল্লাহুম্মা সাল্লি আলা মুহাম্মাদ", "tr": "Allâhümme salli alâ Muhammed", "id": "Allāhumma ṣalli 'alā Muḥammad"}}, {"id": "tasbih2", "ar": "سُبْحَانَ اللّٰهِ وَبِحَمْدِهِ", "tr_": "SubhanAllahi wa bihamdih", "n": 100, "m": {"en": "Glory and praise be to Allah", "ur": "اللہ پاک ہے اپنی تعریف کے ساتھ", "hi": "अल्लाह पाक है अपनी तारीफ़ के साथ", "bn": "আল্লাহ পবিত্র, সব প্রশংসা তাঁর", "tl": "Luwalhati at papuri kay Allah", "tr": "Allah'ı hamd ile tesbih ederim", "id": "Mahasuci Allah dan segala puji bagi-Nya"}, "pr": {"hi": "सुब्हानल्लाहि व बिहम्दिही", "bn": "সুবহানাল্লাহি ওয়া বিহামদিহি", "tr": "Sübhânallâhi ve bihamdihî", "id": "Subḥānallāhi wa biḥamdih"}}], "JOURNAL": [{"en": "What do I most want to change in myself this Ramadan?", "ur": "اس رمضان میں اپنے اندر سب سے زیادہ کیا بدلنا چاہتا/چاہتی ہوں؟", "hi": "इस रमज़ान मैं अपने अंदर सबसे ज़्यादा क्या बदलना चाहता/चाहती हूँ?", "bn": "এই রমজানে নিজের মধ্যে সবচেয়ে বেশি কী বদলাতে চাই?", "tl": "Ano ang pinakagusto kong baguhin sa sarili ngayong Ramadan?", "tr": "Bu Ramazan kendimde en çok neyi değiştirmek istiyorum?", "id": "Apa yang paling ingin saya ubah dari diri saya Ramadan ini?"}, {"en": "How did my first fast feel? What helped?", "ur": "پہلا روزہ کیسا لگا؟ کس چیز نے مدد کی؟", "hi": "पहला रोज़ा कैसा लगा? किस चीज़ ने मदद की?", "bn": "প্রথম রোজা কেমন লাগল? কী সাহায্য করল?", "tl": "Kumusta ang unang araw ng ayuno? Ano ang nakatulong?", "tr": "İlk orucum nasıl geçti? Ne yardımcı oldu?", "id": "Bagaimana rasanya puasa pertama? Apa yang membantu?"}, {"en": "Which blessing do I usually take for granted?", "ur": "کون سی نعمت کو میں عام طور پر معمولی سمجھتا/سمجھتی ہوں؟", "hi": "किस नेमत को मैं आम तौर पर मामूली समझता/समझती हूँ?", "bn": "কোন নেয়ামতকে আমি সাধারণত গুরুত্ব দিই না?", "tl": "Anong biyaya ang madalas kong hindi napapansin?", "tr": "Hangi nimeti genelde hafife alıyorum?", "id": "Nikmat apa yang biasanya saya anggap biasa saja?"}, {"en": "Who do I want to make dua for today, and why?", "ur": "آج میں کس کے لیے دعا کرنا چاہتا/چاہتی ہوں، اور کیوں؟", "hi": "आज मैं किसके लिए दुआ करना चाहता/चाहती हूँ, और क्यों?", "bn": "আজ আমি কার জন্য দোয়া করতে চাই, এবং কেন?", "tl": "Para kanino ko gustong mag-du'a ngayon, at bakit?", "tr": "Bugün kime dua etmek istiyorum, neden?", "id": "Untuk siapa saya ingin berdoa hari ini, dan mengapa?"}, {"en": "Which verse or hadith has stayed with me this week?", "ur": "اس ہفتے کون سی آیت یا حدیث میرے ذہن میں رہی؟", "hi": "इस हफ़्ते कौन सी आयत या हदीस मेरे ज़ेहन में रही?", "bn": "এই সপ্তাহে কোন আয়াত বা হাদিস মনে গেঁথে আছে?", "tl": "Anong talata o hadith ang tumatak sa akin ngayong linggo?", "tr": "Bu hafta hangi ayet veya hadis aklımda kaldı?", "id": "Ayat atau hadis apa yang membekas minggu ini?"}, {"en": "What habit am I trying to leave behind?", "ur": "کون سی عادت چھوڑنے کی کوشش کر رہا/رہی ہوں؟", "hi": "कौन सी आदत छोड़ने की कोशिश कर रहा/रही हूँ?", "bn": "কোন অভ্যাস ছাড়ার চেষ্টা করছি?", "tl": "Anong ugali ang sinusubukan kong iwan?", "tr": "Hangi alışkanlığımı bırakmaya çalışıyorum?", "id": "Kebiasaan apa yang sedang saya coba tinggalkan?"}, {"en": "How can I make my prayers more focused?", "ur": "اپنی نماز میں زیادہ توجہ کیسے لاؤں؟", "hi": "अपनी नमाज़ में ज़्यादा ध्यान कैसे लाऊँ?", "bn": "নামাজে কীভাবে আরও মনোযোগী হতে পারি?", "tl": "Paano ko mas mapagtutuunan ang aking mga dasal?", "tr": "Namazlarımda nasıl daha fazla huşu sağlayabilirim?", "id": "Bagaimana agar shalat saya lebih khusyuk?"}, {"en": "One week in. What am I proud of so far?", "ur": "ایک ہفتہ گزر گیا۔ اب تک کس بات پر فخر ہے؟", "hi": "एक हफ़्ता गुज़र गया। अब तक किस बात पर गर्व है?", "bn": "এক সপ্তাহ পার হলো। এখন পর্যন্ত কী নিয়ে গর্বিত?", "tl": "Isang linggo na. Ano ang ipinagmamalaki ko sa ngayon?", "tr": "Bir hafta geçti. Şimdiye kadar neyle gurur duyuyorum?", "id": "Seminggu berlalu. Apa yang saya banggakan sejauh ini?"}, {"en": "Who could I invite for iftar or help this week?", "ur": "اس ہفتے کسے افطار پر بلا سکتا/سکتی ہوں یا کس کی مدد کر سکتا/سکتی ہوں؟", "hi": "इस हफ़्ते किसे इफ़्तार पर बुला सकता/सकती हूँ या किसकी मदद कर सकता/सकती हूँ?", "bn": "এই সপ্তাহে কাকে ইফতারে ডাকতে বা সাহায্য করতে পারি?", "tl": "Sino ang maaari kong anyayahan sa iftar o tulungan ngayong linggo?", "tr": "Bu hafta kimi iftara davet edebilir veya kime yardım edebilirim?", "id": "Siapa yang bisa saya undang berbuka atau bantu minggu ini?"}, {"en": "What does patience (sabr) look like in my day?", "ur": "میرے دن میں صبر کیسا نظر آتا ہے؟", "hi": "मेरे दिन में सब्र कैसा दिखता है?", "bn": "আমার দিনে ধৈর্য (সবর) কেমন দেখায়?", "tl": "Paano makikita ang pagtitiyaga (sabr) sa araw ko?", "tr": "Günümde sabır neye benziyor?", "id": "Seperti apa kesabaran dalam hari saya?"}, {"en": "Is there someone I need to forgive?", "ur": "کیا کوئی ہے جسے مجھے معاف کرنا چاہیے؟", "hi": "क्या कोई है जिसे मुझे माफ़ करना चाहिए?", "bn": "এমন কেউ কি আছে যাকে আমার ক্ষমা করা দরকার?", "tl": "May tao bang kailangan kong patawarin?", "tr": "Affetmem gereken biri var mı?", "id": "Adakah seseorang yang perlu saya maafkan?"}, {"en": "What made me smile today?", "ur": "آج کس بات نے مجھے مسکرایا؟", "hi": "आज किस बात ने मुझे मुस्कुराया?", "bn": "আজ কী আমাকে হাসাল?", "tl": "Ano ang nagpangiti sa akin ngayon?", "tr": "Bugün beni ne gülümsetti?", "id": "Apa yang membuat saya tersenyum hari ini?"}, {"en": "How am I using my time between iftar and sleep?", "ur": "افطار اور سونے کے درمیان وقت کیسے گزار رہا/رہی ہوں؟", "hi": "इफ़्तार और सोने के बीच का वक़्त कैसे गुज़ार रहा/रही हूँ?", "bn": "ইফতার আর ঘুমের মাঝের সময় কীভাবে কাটাচ্ছি?", "tl": "Paano ko ginagamit ang oras mula iftar hanggang pagtulog?", "tr": "İftar ile uyku arasındaki zamanı nasıl kullanıyorum?", "id": "Bagaimana saya memakai waktu antara berbuka dan tidur?"}, {"en": "What would I like to ask Allah for, in my own words?", "ur": "میں اپنے الفاظ میں اللہ سے کیا مانگنا چاہتا/چاہتی ہوں؟", "hi": "मैं अपने अल्फ़ाज़ में अल्लाह से क्या माँगना चाहता/चाहती हूँ?", "bn": "নিজের ভাষায় আল্লাহর কাছে কী চাইতে চাই?", "tl": "Ano ang gusto kong hilingin kay Allah, sa sarili kong salita?", "tr": "Kendi sözlerimle Allah'tan ne istemek isterim?", "id": "Apa yang ingin saya minta kepada Allah dengan kata-kata saya sendiri?"}, {"en": "Halfway there. What do I want the second half to look like?", "ur": "آدھا رمضان گزر گیا۔ باقی آدھا کیسا ہو؟", "hi": "आधा रमज़ान गुज़र गया। बाक़ी आधा कैसा हो?", "bn": "অর্ধেক রমজান পার হলো। বাকি অর্ধেক কেমন হোক?", "tl": "Kalahati na. Ano ang gusto kong mangyari sa ikalawang kalahati?", "tr": "Yarıyı geçtik. İkinci yarının nasıl olmasını istiyorum?", "id": "Sudah setengah jalan. Ingin seperti apa paruh keduanya?"}, {"en": "Which family member can I show more kindness to?", "ur": "خاندان کے کس فرد کے ساتھ زیادہ مہربانی کر سکتا/سکتی ہوں؟", "hi": "परिवार के किस सदस्य के साथ ज़्यादा मेहरबानी कर सकता/सकती हूँ?", "bn": "পরিবারের কার প্রতি আরও দয়ালু হতে পারি?", "tl": "Sinong kapamilya ang maaari kong pakitaan ng higit na kabaitan?", "tr": "Hangi aile üyeme daha nazik davranabilirim?", "id": "Anggota keluarga mana yang bisa lebih saya sayangi?"}, {"en": "What have I learned about myself from fasting?", "ur": "روزے سے اپنے بارے میں کیا سیکھا؟", "hi": "रोज़े से अपने बारे में क्या सीखा?", "bn": "রোজা থেকে নিজের সম্পর্কে কী শিখলাম?", "tl": "Ano ang natutunan ko tungkol sa sarili sa pag-aayuno?", "tr": "Oruçtan kendim hakkında ne öğrendim?", "id": "Apa yang saya pelajari tentang diri saya dari berpuasa?"}, {"en": "What small good deed can I do quietly today?", "ur": "آج کون سا چھوٹا نیک کام خاموشی سے کر سکتا/سکتی ہوں؟", "hi": "आज कौन सा छोटा नेक काम चुपचाप कर सकता/सकती हूँ?", "bn": "আজ কোন ছোট ভালো কাজটি চুপচাপ করতে পারি?", "tl": "Anong maliit na mabuting gawa ang magagawa ko nang tahimik ngayon?", "tr": "Bugün sessizce hangi küçük iyiliği yapabilirim?", "id": "Amal baik kecil apa yang bisa saya lakukan diam-diam hari ini?"}, {"en": "How has my relationship with the Qur'an grown?", "ur": "قرآن سے میرا تعلق کیسے بڑھا ہے؟", "hi": "क़ुरआन से मेरा रिश्ता कैसे बढ़ा है?", "bn": "কুরআনের সাথে আমার সম্পর্ক কীভাবে বেড়েছে?", "tl": "Paano lumago ang ugnayan ko sa Qur'an?", "tr": "Kur'an'la bağım nasıl gelişti?", "id": "Bagaimana hubungan saya dengan Al-Qur'an bertumbuh?"}, {"en": "What am I hoping for in the last ten nights?", "ur": "آخری دس راتوں سے کیا امید رکھتا/رکھتی ہوں؟", "hi": "आख़िरी दस रातों से क्या उम्मीद रखता/रखती हूँ?", "bn": "শেষ দশ রাতে কী আশা করছি?", "tl": "Ano ang inaasam ko sa huling sampung gabi?", "tr": "Son on geceden ne umuyorum?", "id": "Apa harapan saya di sepuluh malam terakhir?"}, {"en": "Write your dua list for Laylat al-Qadr.", "ur": "لیلۃ القدر کے لیے اپنی دعاؤں کی فہرست لکھیں۔", "hi": "लैलतुल क़द्र के लिए अपनी दुआओं की सूची लिखें।", "bn": "লাইলাতুল কদরের জন্য দোয়ার তালিকা লিখুন।", "tl": "Isulat ang listahan ng iyong du'a para sa Laylat al-Qadr.", "tr": "Kadir Gecesi için dua listenizi yazın.", "id": "Tulis daftar doa Anda untuk Lailatul Qadar."}, {"en": "What do I want to be forgiven for?", "ur": "میں کس بات کی معافی چاہتا/چاہتی ہوں؟", "hi": "मैं किस बात की माफ़ी चाहता/चाहती हूँ?", "bn": "আমি কীসের জন্য ক্ষমা চাই?", "tl": "Para saan ko gustong mapatawad?", "tr": "Neyin affedilmesini istiyorum?", "id": "Untuk apa saya ingin diampuni?"}, {"en": "Who taught me about Islam? Make dua for them.", "ur": "مجھے اسلام کس نے سکھایا؟ ان کے لیے دعا کریں۔", "hi": "मुझे इस्लाम किसने सिखाया? उनके लिए दुआ करें।", "bn": "আমাকে কে ইসলাম শিখিয়েছেন? তাঁদের জন্য দোয়া করুন।", "tl": "Sino ang nagturo sa akin ng Islam? Ipagdasal sila.", "tr": "Bana İslam'ı kim öğretti? Onlara dua edin.", "id": "Siapa yang mengajari saya tentang Islam? Doakan mereka."}, {"en": "What does a good night of worship look like for me?", "ur": "میرے لیے عبادت کی ایک اچھی رات کیسی ہے؟", "hi": "मेरे लिए इबादत की एक अच्छी रात कैसी है?", "bn": "আমার জন্য ইবাদতের একটি ভালো রাত কেমন?", "tl": "Ano ang itsura ng isang mabuting gabi ng pagsamba para sa akin?", "tr": "Benim için güzel bir ibadet gecesi nasıl olur?", "id": "Seperti apa malam ibadah yang baik bagi saya?"}, {"en": "Which part of Ramadan will I miss most?", "ur": "رمضان کی کون سی بات سب سے زیادہ یاد آئے گی؟", "hi": "रमज़ान की कौन सी बात सबसे ज़्यादा याद आएगी?", "bn": "রমজানের কোন অংশটি সবচেয়ে বেশি মিস করব?", "tl": "Anong bahagi ng Ramadan ang pinakamamimiss ko?", "tr": "Ramazan'ın en çok neyini özleyeceğim?", "id": "Bagian Ramadan mana yang paling akan saya rindukan?"}, {"en": "Which good habit will I keep after Ramadan?", "ur": "رمضان کے بعد کون سی اچھی عادت جاری رکھوں گا/گی؟", "hi": "रमज़ान के बाद कौन सी अच्छी आदत जारी रखूँगा/रखूँगी?", "bn": "রমজানের পরে কোন ভালো অভ্যাসটি ধরে রাখব?", "tl": "Anong mabuting ugali ang ipagpapatuloy ko pagkatapos ng Ramadan?", "tr": "Ramazan'dan sonra hangi güzel alışkanlığı sürdüreceğim?", "id": "Kebiasaan baik apa yang akan saya pertahankan setelah Ramadan?"}, {"en": "How can I help someone in need before Eid?", "ur": "عید سے پہلے کسی ضرورت مند کی مدد کیسے کر سکتا/سکتی ہوں؟", "hi": "ईद से पहले किसी ज़रूरतमंद की मदद कैसे कर सकता/सकती हूँ?", "bn": "ঈদের আগে কীভাবে কোনো অভাবীকে সাহায্য করতে পারি?", "tl": "Paano ako makakatulong sa nangangailangan bago ang Eid?", "tr": "Bayramdan önce ihtiyaç sahibi birine nasıl yardım edebilirim?", "id": "Bagaimana saya bisa membantu orang yang membutuhkan sebelum Lebaran?"}, {"en": "What am I most grateful for this Ramadan?", "ur": "اس رمضان میں سب سے زیادہ کس بات کا شکر گزار ہوں؟", "hi": "इस रमज़ान में सबसे ज़्यादा किस बात का शुक्रगुज़ार हूँ?", "bn": "এই রমজানে সবচেয়ে বেশি কীসের জন্য কৃতজ্ঞ?", "tl": "Ano ang pinakaipinagpapasalamat ko ngayong Ramadan?", "tr": "Bu Ramazan en çok neye şükrediyorum?", "id": "Apa yang paling saya syukuri Ramadan ini?"}, {"en": "A letter to myself for next Ramadan.", "ur": "اگلے رمضان کے لیے اپنے نام ایک خط۔", "hi": "अगले रमज़ान के लिए ख़ुद को एक ख़त।", "bn": "আগামী রমজানের জন্য নিজের কাছে একটি চিঠি।", "tl": "Isang liham para sa sarili sa susunod na Ramadan.", "tr": "Gelecek Ramazan için kendime bir mektup.", "id": "Surat untuk diri sendiri di Ramadan berikutnya."}, {"en": "How will I welcome Eid with my family?", "ur": "اپنے گھر والوں کے ساتھ عید کا استقبال کیسے کروں گا/گی؟", "hi": "अपने घरवालों के साथ ईद का स्वागत कैसे करूँगा/करूँगी?", "bn": "পরিবারের সাথে কীভাবে ঈদকে স্বাগত জানাব?", "tl": "Paano ko sasalubungin ang Eid kasama ang pamilya?", "tr": "Bayramı ailemle nasıl karşılayacağım?", "id": "Bagaimana saya menyambut Lebaran bersama keluarga?"}], "HEALTH": [{"en": "Don't skip suhoor. Slow-release foods like oats, wholegrain bread, eggs and yoghurt keep you going for longer.", "ur": "سحری نہ چھوڑیں۔ دلیہ، گندم کی روٹی، انڈے اور دہی جیسی دیر سے ہضم ہونے والی غذائیں زیادہ دیر توانائی دیتی ہیں۔", "hi": "सहरी न छोड़ें। दलिया, गेहूँ की रोटी, अंडे और दही जैसी धीरे पचने वाली चीज़ें ज़्यादा देर ताक़त देती हैं।", "bn": "সাহরি বাদ দেবেন না। ওটস, লাল আটার রুটি, ডিম ও দইয়ের মতো ধীরে হজম হওয়া খাবার দীর্ঘক্ষণ শক্তি দেয়।", "tl": "Huwag laktawan ang suhoor. Ang oats, whole-grain na tinapay, itlog at yoghurt ay nagbibigay ng lakas nang mas matagal.", "tr": "Sahuru atlamayın. Yulaf, tam tahıllı ekmek, yumurta ve yoğurt gibi yavaş sindirilen besinler sizi daha uzun süre tok tutar.", "id": "Jangan lewatkan sahur. Makanan yang lambat dicerna seperti oat, roti gandum, telur, dan yoghurt membuat kenyang lebih lama."}, {"en": "Open your fast with water and dates, as the Prophet ﷺ did, then eat your meal slowly.", "ur": "نبی ﷺ کی طرح پانی اور کھجور سے افطار کریں، پھر آرام سے کھانا کھائیں۔", "hi": "नबी ﷺ की तरह पानी और खजूर से इफ़्तार करें, फिर आराम से खाना खाएँ।", "bn": "নবী ﷺ-এর মতো পানি ও খেজুর দিয়ে ইফতার করুন, তারপর ধীরে খাবার খান।", "tl": "Buksan ang ayuno sa tubig at datiles, gaya ng Propeta ﷺ, saka kumain nang dahan-dahan.", "tr": "Peygamberimiz ﷺ gibi orucunuzu su ve hurmayla açın, sonra yemeğinizi yavaşça yiyin.", "id": "Berbukalah dengan air dan kurma seperti Nabi ﷺ, lalu makanlah perlahan."}, {"en": "Drink little and often between iftar and suhoor rather than a lot at once.", "ur": "افطار سے سحری تک ایک ساتھ بہت سا پانی پینے کے بجائے تھوڑا تھوڑا بار بار پئیں۔", "hi": "इफ़्तार से सहरी तक एक साथ बहुत सा पानी पीने के बजाय थोड़ा-थोड़ा बार-बार पिएँ।", "bn": "ইফতার থেকে সাহরি পর্যন্ত একবারে অনেক পানি না খেয়ে অল্প অল্প করে বারবার পান করুন।", "tl": "Uminom nang paunti-unti at madalas mula iftar hanggang suhoor sa halip na marami nang isang beses.", "tr": "İftar ile sahur arasında bir seferde çok su içmek yerine az az ve sık için.", "id": "Minumlah sedikit-sedikit tapi sering antara berbuka dan sahur, bukan banyak sekaligus."}, {"en": "Go easy on fried, salty and very sugary foods: they make you thirstier the next day.", "ur": "تلی ہوئی، نمکین اور بہت میٹھی چیزیں کم کھائیں: یہ اگلے دن پیاس بڑھاتی ہیں۔", "hi": "तली हुई, नमकीन और बहुत मीठी चीज़ें कम खाएँ: ये अगले दिन प्यास बढ़ाती हैं।", "bn": "ভাজা, নোনতা ও খুব মিষ্টি খাবার কম খান: এগুলো পরদিন তৃষ্ণা বাড়ায়।", "tl": "Bawasan ang pritong, maalat at sobrang matamis na pagkain: nagpapauhaw ang mga ito kinabukasan.", "tr": "Kızartma, tuzlu ve çok şekerli yiyecekleri azaltın; ertesi gün susatırlar.", "id": "Kurangi gorengan, makanan asin, dan yang sangat manis: semuanya membuat lebih haus esok hari."}, {"en": "A gentle walk after iftar or Taraweeh helps digestion and energy.", "ur": "افطار یا تراویح کے بعد ہلکی چہل قدمی ہاضمے اور توانائی کے لیے اچھی ہے۔", "hi": "इफ़्तार या तरावीह के बाद हल्की सैर हाज़मे और ताक़त के लिए अच्छी है।", "bn": "ইফতার বা তারাবির পর হালকা হাঁটা হজম ও শক্তির জন্য ভালো।", "tl": "Ang maikling paglalakad pagkatapos ng iftar o Taraweeh ay nakakatulong sa panunaw at lakas.", "tr": "İftar veya teravihten sonra hafif bir yürüyüş sindirime ve enerjiye iyi gelir.", "id": "Jalan santai setelah berbuka atau tarawih membantu pencernaan dan stamina."}, {"en": "Try to keep a regular sleep pattern, and take a short nap in the day if you can.", "ur": "سونے کا معمول برقرار رکھنے کی کوشش کریں، اور ہو سکے تو دن میں تھوڑا آرام کر لیں۔", "hi": "सोने का रूटीन बनाए रखने की कोशिश करें, और हो सके तो दिन में थोड़ा आराम कर लें।", "bn": "ঘুমের নিয়ম বজায় রাখার চেষ্টা করুন, সম্ভব হলে দিনে অল্প বিশ্রাম নিন।", "tl": "Panatilihin ang regular na tulog, at umidlip sandali sa araw kung kaya.", "tr": "Düzenli uyumaya çalışın, mümkünse gün içinde kısa bir şekerleme yapın.", "id": "Usahakan pola tidur teratur, dan tidur siang sebentar jika bisa."}, {"en": "If you take medicine, have a long-term condition, or are pregnant or breastfeeding, speak to your doctor before Ramadan.", "ur": "اگر آپ دوا لیتے ہیں، کوئی پرانی بیماری ہے، یا حاملہ ہیں یا دودھ پلاتی ہیں تو رمضان سے پہلے ڈاکٹر سے مشورہ کریں۔", "hi": "अगर आप दवा लेते हैं, कोई पुरानी बीमारी है, या गर्भवती हैं या दूध पिलाती हैं तो रमज़ान से पहले डॉक्टर से सलाह लें।", "bn": "ওষুধ খেলে, দীর্ঘমেয়াদি অসুখ থাকলে, বা গর্ভবতী বা স্তন্যদানকারী হলে রমজানের আগে ডাক্তারের পরামর্শ নিন।", "tl": "Kung umiinom ng gamot, may pangmatagalang sakit, o buntis o nagpapasuso, kumonsulta sa doktor bago ang Ramadan.", "tr": "İlaç kullanıyorsanız, süreğen bir hastalığınız varsa, hamile veya emziriyorsanız Ramazan'dan önce doktorunuza danışın.", "id": "Jika minum obat, punya penyakit menahun, atau sedang hamil atau menyusui, konsultasikan ke dokter sebelum Ramadan."}, {"en": "Feeling dizzy, confused or faint? Break your fast and drink: your health comes first, and the fast can be made up.", "ur": "چکر، الجھن یا بے ہوشی محسوس ہو تو روزہ کھول کر پانی پئیں: صحت پہلے ہے، روزہ بعد میں قضا ہو سکتا ہے۔", "hi": "चक्कर, उलझन या बेहोशी महसूस हो तो रोज़ा खोलकर पानी पिएँ: सेहत पहले है, रोज़ा बाद में क़ज़ा हो सकता है।", "bn": "মাথা ঘোরা, বিভ্রান্তি বা অজ্ঞান ভাব হলে রোজা ভেঙে পানি পান করুন: স্বাস্থ্য আগে, রোজা পরে কাজা করা যায়।", "tl": "Nahihilo, nalilito o parang mahihimatay? Buksan ang ayuno at uminom: mauna ang kalusugan, at mababayaran ang ayuno.", "tr": "Baş dönmesi, bilinç bulanıklığı veya baygınlık hissederseniz orucu bozup su için; sağlık önce gelir, oruç kaza edilebilir.", "id": "Pusing, bingung, atau mau pingsan? Batalkan puasa dan minum: kesehatan nomor satu, puasa bisa diganti."}], "EXEMPT": [{"en": "People who are ill: make the fasts up later when well.", "ur": "بیمار: صحت یاب ہو کر بعد میں قضا کریں۔", "hi": "बीमार: ठीक होकर बाद में क़ज़ा करें।", "bn": "অসুস্থ ব্যক্তি: সুস্থ হয়ে পরে কাজা করবেন।", "tl": "Mga may sakit: bayaran ang ayuno kapag magaling na.", "tr": "Hastalar: iyileşince kaza ederler.", "id": "Orang sakit: mengganti puasa setelah sembuh."}, {"en": "Travellers on a long journey: make the fasts up later.", "ur": "لمبے سفر پر مسافر: بعد میں قضا کریں۔", "hi": "लंबे सफ़र पर मुसाफ़िर: बाद में क़ज़ा करें।", "bn": "দীর্ঘ সফরের মুসাফির: পরে কাজা করবেন।", "tl": "Mga naglalakbay nang malayo: bayaran ang ayuno pagkatapos.", "tr": "Uzun yolculuktaki misafirler: sonra kaza ederler.", "id": "Musafir dalam perjalanan jauh: mengganti di hari lain."}, {"en": "Women during their period or after childbirth: make the fasts up later.", "ur": "حیض یا نفاس والی خواتین: بعد میں قضا کریں۔", "hi": "माहवारी या प्रसव के बाद की हालत में औरतें: बाद में क़ज़ा करें।", "bn": "মাসিক বা প্রসব-পরবর্তী অবস্থায় নারী: পরে কাজা করবেন।", "tl": "Kababaihang may regla o bagong panganak: bayaran ang ayuno pagkatapos.", "tr": "Âdet veya lohusalık hâlindeki kadınlar: sonra kaza ederler.", "id": "Wanita haid atau nifas: mengganti di hari lain."}, {"en": "Pregnant or breastfeeding women who fear for themselves or the baby: make up later or pay fidya, depending on your school.", "ur": "حاملہ یا دودھ پلانے والی خواتین جنہیں اپنے یا بچے کے لیے خطرہ ہو: اپنے مسلک کے مطابق قضا یا فدیہ۔", "hi": "गर्भवती या दूध पिलाने वाली औरतें जिन्हें अपने या बच्चे के लिए ख़तरा हो: अपने मसलक के मुताबिक़ क़ज़ा या फ़िदया।", "bn": "গর্ভবতী বা স্তন্যদানকারী নারী যারা নিজের বা শিশুর জন্য আশঙ্কা করেন: মাজহাব অনুযায়ী কাজা বা ফিদিয়া।", "tl": "Buntis o nagpapasusong babaeng nangangamba para sa sarili o sa sanggol: bayaran o magbigay ng fidya, ayon sa iyong paaralan.", "tr": "Kendisi veya bebeği için endişe eden hamile ya da emziren kadınlar: mezhebinize göre kaza veya fidye.", "id": "Wanita hamil atau menyusui yang khawatir pada dirinya atau bayinya: mengganti atau membayar fidyah, sesuai mazhab."}, {"en": "Elderly people or those with a long-term illness who cannot fast: pay fidya instead.", "ur": "بزرگ یا لمبی بیماری والے جو روزہ نہیں رکھ سکتے: اس کے بدلے فدیہ دیں۔", "hi": "बुज़ुर्ग या लंबी बीमारी वाले जो रोज़ा नहीं रख सकते: इसके बदले फ़िदया दें।", "bn": "বয়স্ক বা দীর্ঘমেয়াদি অসুস্থ যারা রোজা রাখতে পারেন না: পরিবর্তে ফিদিয়া দেবেন।", "tl": "Matatanda o may matagal na sakit na hindi makapag-ayuno: magbigay ng fidya.", "tr": "Oruç tutamayan yaşlılar veya süreğen hastalar: yerine fidye verirler.", "id": "Lansia atau penderita sakit menahun yang tidak mampu puasa: membayar fidyah."}, {"en": "Children before puberty don't have to fast, but many love trying a few hours or half days.", "ur": "بلوغت سے پہلے بچوں پر روزہ فرض نہیں، لیکن بہت سے بچے چند گھنٹے یا آدھا دن رکھنا پسند کرتے ہیں۔", "hi": "बालिग़ होने से पहले बच्चों पर रोज़ा फ़र्ज़ नहीं, लेकिन बहुत से बच्चे कुछ घंटे या आधा दिन रखना पसंद करते हैं।", "bn": "বালেগ হওয়ার আগে শিশুদের রোজা ফরজ নয়, তবে অনেকে কয়েক ঘণ্টা বা আধা দিন রাখতে ভালোবাসে।", "tl": "Hindi obligado ang mga batang hindi pa nagbibinata/nagdadalaga, pero marami ang gustong sumubok nang ilang oras o kalahating araw.", "tr": "Ergenlikten önce çocuklar oruçla yükümlü değildir, ama pek çoğu birkaç saat ya da yarım gün denemeyi sever.", "id": "Anak-anak sebelum balig tidak wajib puasa, tetapi banyak yang senang mencoba beberapa jam atau setengah hari."}], "QADR_FACTS": [{"en": "\"The Night of Decree is better than a thousand months.\" (Qur'an 97:3)", "ur": "\"شبِ قدر ہزار مہینوں سے بہتر ہے۔\" (قرآن 97:3)", "hi": "\"शब-ए-क़द्र हज़ार महीनों से बेहतर है।\" (क़ुरआन 97:3)", "bn": "\"কদরের রাত হাজার মাসের চেয়ে উত্তম।\" (কুরআন ৯৭:৩)", "tl": "\"Ang Gabi ng Takdang Kapasyahan ay higit na mabuti kaysa isang libong buwan.\" (Qur'an 97:3)", "tr": "\"Kadir Gecesi bin aydan daha hayırlıdır.\" (Kur'an 97:3)", "id": "\"Malam kemuliaan itu lebih baik daripada seribu bulan.\" (Al-Qur'an 97:3)"}, {"en": "The Prophet ﷺ said: \"Seek it in the odd nights of the last ten nights of Ramadan.\" (Sahih al-Bukhari 2017)", "ur": "نبی ﷺ نے فرمایا: \"اسے رمضان کی آخری دس راتوں کی طاق راتوں میں تلاش کرو۔\" (صحیح بخاری 2017)", "hi": "नबी ﷺ ने फ़रमाया: \"इसे रमज़ान की आख़िरी दस रातों की ताक़ रातों में तलाश करो।\" (सहीह बुख़ारी 2017)", "bn": "নবী ﷺ বলেছেন: \"রমজানের শেষ দশ রাতের বিজোড় রাতগুলোতে একে খোঁজো।\" (সহিহ বুখারি ২০১৭)", "tl": "Sinabi ng Propeta ﷺ: \"Hanapin ito sa mga gabing odd ng huling sampung gabi ng Ramadan.\" (Sahih al-Bukhari 2017)", "tr": "Peygamber ﷺ şöyle buyurdu: \"Onu Ramazan'ın son on gecesinin tek gecelerinde arayın.\" (Buhârî 2017)", "id": "Nabi ﷺ bersabda: \"Carilah ia pada malam-malam ganjil di sepuluh malam terakhir Ramadan.\" (Shahih al-Bukhari 2017)"}, {"en": "In the last ten nights the Prophet ﷺ would pray through the night, wake his family and strive harder than at any other time. (Sahih al-Bukhari 2024)", "ur": "آخری عشرے میں نبی ﷺ رات بھر عبادت کرتے، گھر والوں کو جگاتے اور سب سے زیادہ محنت کرتے۔ (صحیح بخاری 2024)", "hi": "आख़िरी अशरे में नबी ﷺ रात भर इबादत करते, घरवालों को जगाते और सबसे ज़्यादा मेहनत करते। (सहीह बुख़ारी 2024)", "bn": "শেষ দশকে নবী ﷺ সারারাত ইবাদত করতেন, পরিবারকে জাগাতেন এবং সবচেয়ে বেশি চেষ্টা করতেন। (সহিহ বুখারি ২০২৪)", "tl": "Sa huling sampung gabi, nagdarasal ang Propeta ﷺ buong gabi, ginigising ang pamilya at higit na nagsisikap kaysa ibang panahon. (Sahih al-Bukhari 2024)", "tr": "Son on gecede Peygamber ﷺ geceyi ibadetle geçirir, ailesini uyandırır ve her zamankinden çok gayret ederdi. (Buhârî 2024)", "id": "Pada sepuluh malam terakhir, Nabi ﷺ menghidupkan malam, membangunkan keluarganya, dan bersungguh-sungguh melebihi waktu lain. (Shahih al-Bukhari 2024)"}], "NIGHT_PLAN": [{"en": "Pray Maghrib, Isha and Taraweeh, in congregation if you can", "ur": "مغرب، عشاء اور تراویح، ہو سکے تو جماعت کے ساتھ", "hi": "मग़रिब, इशा और तरावीह, हो सके तो जमाअत के साथ", "bn": "মাগরিব, এশা ও তারাবি, সম্ভব হলে জামাতে", "tl": "Magdasal ng Maghrib, Isha at Taraweeh, sa jama'ah kung kaya", "tr": "Akşam, yatsı ve teravihi mümkünse cemaatle kılın", "id": "Shalat Magrib, Isya, dan Tarawih, berjamaah jika bisa"}, {"en": "Read or listen to some Qur'an", "ur": "کچھ قرآن پڑھیں یا سنیں", "hi": "कुछ क़ुरआन पढ़ें या सुनें", "bn": "কিছু কুরআন পড়ুন বা শুনুন", "tl": "Magbasa o makinig ng Qur'an", "tr": "Biraz Kur'an okuyun veya dinleyin", "id": "Baca atau dengarkan Al-Qur'an"}, {"en": "Make the Laylat al-Qadr dua many times", "ur": "لیلۃ القدر کی دعا بار بار پڑھیں", "hi": "लैलतुल क़द्र की दुआ बार-बार पढ़ें", "bn": "লাইলাতুল কদরের দোয়া বারবার পড়ুন", "tl": "Bigkasin nang madalas ang du'a ng Laylat al-Qadr", "tr": "Kadir Gecesi duasını çokça okuyun", "id": "Perbanyak doa Lailatul Qadar"}, {"en": "Go through your own dua list", "ur": "اپنی دعاؤں کی فہرست پڑھیں", "hi": "अपनी दुआओं की सूची पढ़ें", "bn": "নিজের দোয়ার তালিকা পড়ুন", "tl": "Basahi     case "geo":
      if (!navigator.geolocation) { toast(t("loc_fail")); break; }
      navigator.geolocation.getCurrentPosition(p => { S.loc = {lat: p.coords.latitude, lng: p.coords.longitude, tz: Intl.DateTimeFormat().resolvedOptions().timeZone}; S.city = "loc"; rr(); }, () => toast(t("loc_fail")), {timeout: 10000}); break;
    case "qg": S.qGoal = +a.dataset.val; rr(); break;
    case "juz": S.juz[i] = !S.juz[i]; rr(); break;
    case "dsel": dsel = a.dataset.id; render(); break;
    case "dh": { S.dc[dsel] = (S.dc[dsel] || 0) + 1; S.dt[dsel] = (S.dt[dsel] || 0) + 1; const td = dayIdx(); if (inRamadan(td)) dd(td).z = 1; buzz(); rr(); break; }
    case "dhu": if (S.dc[dsel] > 0) { S.dc[dsel]--; S.dt[dsel] = Math.max(0, (S.dt[dsel] || 0) - 1); } rr(); break;
    case "dhr": S.dc[dsel] = 0; rr(); break;
    case "np": S.np[a.dataset.nt] = S.np[a.dataset.nt] || []; S.np[a.dataset.nt][i] = !S.np[a.dataset.nt][i]; rr(); break;
    case "ik": S.itk[i] = !S.itk[i]; rr(); break;
    case "ec": S.eidc[i] = !S.eidc[i]; rr(); break;
    case "zb": S.zk.basis = a.dataset.val; rr(); break;
    case "cur": S.cur = a.dataset.val; S.curSet = true; rr(); break;
    case "sqAdd": { const amt = num(val("sqA")); if (amt > 0) { S.sq.push({a: amt, n: val("sqN").trim(), dt: today()}); const td = dayIdx(); if (inRamadan(td)) dd(td).s = 1; rr(); } break; }
    case "sqDel": S.sq.splice(i, 1); rr(); break;
    case "shopAdd": { const x = val("shopIn").trim(); if (x) { S.shop.push({t: x, on: false}); rr(); document.getElementById("shopIn")?.focus(); } break; }
    case "shopTog": S.shop[i].on = !S.shop[i].on; rr(); break;
    case "shopDel": S.shop.splice(i, 1); rr(); break;
    case "kidAdd": { const x = val("kidIn").trim(); if (x) { S.kids.push({n: x, st: {}}); rr(); } break; }
    case "kidDel": if (await ask(`${t("delete")}: ${S.kids[i].n}?`)) { S.kids.splice(i, 1); rr(); } break;
    case "ks": { const k = S.kids[+a.dataset.c]; k.st = k.st || {}; k.st[kday] = k.st[kday] || []; k.st[kday][i] = !k.st[kday][i]; if (k.st[kday][i]) buzz(); rr(); break; }
    case "eiAdd": { const nm = val("eiN").trim(), amt = num(val("eiA")); if (nm && amt > 0) { S.eidi.push({n: nm, a: amt, k: val("eiK") || "give"}); rr(); } break; }
    case "eiDel": S.eidi.splice(i, 1); rr(); break;
    case "gfAdd": { const nm = val("gfN").trim(), g = val("gfG").trim(); if (nm || g) { S.gifts.push({n: nm, g, on: false}); rr(); } break; }
    case "gfTog": S.gifts[i].on = !S.gifts[i].on; rr(); break;
    case "gfDel": S.gifts.splice(i, 1); rr(); break;
    case "dnav": { const d = +a.dataset.d, k = a.dataset.k, cl = x => Math.min(S.len, Math.max(1, x + d));
      if (k === "m") mday = cl(mday); if (k === "j") jday = cl(jday); if (k === "k") kday = cl(kday); render(); break; }
    case "unlockCode": { const c = val("code").trim().toUpperCase(); if (!c) break;
      if (await sha256(c) === CODE_HASH) { try { localStorage.setItem("ramadan-licence", CODE_HASH); } catch(err) {} location.reload(); } else toast(t("code_bad")); break; }
    case "resetAll": if (await ask(t("reset_q"))) { const keep = {lang: S.lang, theme: S.theme, city: S.city, loc: S.loc, method: S.method, asr: S.asr, adj: S.adj, start: S.start, len: S.len, cur: S.cur};
      try { localStorage.setItem(KEY, JSON.stringify(keep)); } catch(err) {} location.reload(); } break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter") { const id = e.target.id, map = {code: "unlockCode", shopIn: "shopAdd", kidIn: "kidAdd", sqN: "sqAdd", sqA: "sqAdd", eiA: "eiAdd", gfG: "gfAdd"};
  if (map[id]) document.querySelector(`[data-a="${map[id]}"]`)?.click(); else if (e.target.matches?.(".nav a,.tool")) e.target.click(); } });
let jt;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "dq") { dq = el.value; const pos = el.selectionStart; render(); const n = document.getElementById("dq"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (el.dataset.path) { const p = el.dataset.path; let v = el.value; if (p === "ar") v = +v;
    if (p === "cur") { v = v.replace(/[0-9.,\s-]/g, ""); if (el.value !== v) el.value = v; if (!v) return; S.curSet = true; }
    setPath(p, v); save(); if (p === "ar") document.documentElement.style.setProperty("--ar-size", v + "px"); updCalc();
    if (p.startsWith("jr.")) { clearTimeout(jt); const s = document.getElementById("jsaved"); if (s) { s.textContent = "…"; jt = setTimeout(() => s.textContent = "✓ " + t("saved"), 500); } } }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.sel) { const k = el.dataset.sel, v = el.value;
    if (k === "city") { S.city = v === "" ? null : v === "loc" ? "loc" : +v; if (typeof S.city === "number") { S.method = CITIES[S.city].m; if (!S.curSet && CUR[CITIES[S.city].c]) S.cur = CUR[CITIES[S.city].c]; } }
    else if (k === "asr") S.asr = +v; else S[k] = v; save(); render(); }
  if (el.dataset.tog) { S[el.dataset.tog] = el.checked; save(); }
  if (el.dataset.path && el.dataset.rr) { if (el.dataset.path === "start" && !/^\d{4}-\d{2}-\d{2}$/.test(el.value)) return; save(); render(); }
});
// live countdown: update the clock every second; redraw the page when a stage ends (e.g. at iftar)
setInterval(() => { const el = document.getElementById("cd"); if (!el || document.querySelector(".modal-bg")) return;
  const left = +el.dataset.at - Date.now(); if (left <= 0) { if (view === "home") render(); return; } el.textContent = hms(left); }, 1000);
render();
</script>

<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>

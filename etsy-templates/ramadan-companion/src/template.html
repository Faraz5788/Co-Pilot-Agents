/* ---------- dates & times ---------- */
function cityObj(){ if (S.city === "loc" && S.loc) return {n: t("my_loc"), c: "", ...S.loc}; if (S.city != null && CITIES[S.city]) return CITIES[S.city]; return null; }
const tz = () => { const c = cityObj(); return c ? c.tz : Intl.DateTimeFormat().resolvedOptions().timeZone; };
const ymd = s => s.split("-").map(Number);
function gdate(n){ const [y, m, d] = ymd(S.start); return new Date(Date.UTC(y, m - 1, d + n - 1)); }    // Ramadan day n -> date (UTC midnight)
function todayYMD(){ return new Intl.DateTimeFormat("en-CA", {timeZone: tz(), year: "numeric", month: "2-digit", day: "2-digit"}).format(new Date()); }
function dayIdx(){ const [y, m, d] = ymd(todayYMD()), [a, b, c] = ymd(S.start); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(a, b - 1, c)) / 864e5) + 1; }
const inRamadan = n => n >= 1 && n <= S.len;
function times(date){ const c = cityObj(); if (!c) return null; const M = PT_METHODS[S.method] || PT_METHODS.mwl;
  const r = prayTimes(date, c.lat, c.lng, {...M, asr: +S.asr}); for (const k in r) r[k] = new Date(+r[k] + (S.adj[k] || 0) * 60000);
  r.imsak = new Date(+r.fajr - 600000); return r; }
const fmtT = d => d && !isNaN(d) ? new Intl.DateTimeFormat(LOCALE[lang()], {hour: "numeric", minute: "2-digit", timeZone: tz()}).format(d) : "–";
const fmtD = (d, o) => new Intl.DateTimeFormat(LOCALE[lang()], {timeZone: "UTC", ...(o || {weekday: "short", day: "numeric", month: "short"})}).format(d);
const hms = ms => { ms = Math.max(0, ms); const h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3); return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; };
function status(){
  const n = dayIdx(), c = cityObj(), now = new Date();
  if (n > S.len) return {k: "eid", n};
  if (n < 1) {
    if (c && n === 0) { const a = times(gdate(0)); if (now >= a.maghrib) return {k: "suhoor_in", at: times(gdate(1)).fajr, n}; }
    return {k: "starts_in", days: 1 - n, n};
  }
  if (!c) return {k: "day", n};
  const a = times(gdate(n)); if (now < a.fajr) return {k: "suhoor_in", at: a.fajr, n}; if (now < a.maghrib) return {k: "iftar_in", at: a.maghrib, n};
  if (n < S.len) return {k: "suhoor_in", at: times(gdate(n + 1)).fajr, n};
  return {k: "eve", n};
}
const curDay = () => { const n = dayIdx(); return Math.min(Math.max(n, 1), S.len); };
const dd = n => (S.d[n] = S.d[n] || {f: "", p: [0,0,0,0,0], t: 0, q: 0, s: 0, g: 0, w: 0, z: 0});
const score = n => { const x = S.d[n]; if (!x) return 0; return (x.f === "y" ? 1 : 0) + x.p.reduce((a, b) => a + b, 0) + x.t + (x.q > 0 ? 1 : 0) + x.s + x.g; };
const money = v => S.cur + (Math.round((+v || 0) * 100) / 100).toLocaleString(LOCALE[lang()], {maximumFractionDigits: 2});
const num = v => { const x = parseFloat(v); return isNaN(x) ? 0 : x; };

/* ---------- shared bits ---------- */
function toast(m){ const el = document.createElement("div"); el.className = "toast"; el.textContent = m; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }
function buzz(){ try { navigator.vibrate && navigator.vibrate(30); } catch(e) {} }
function ring(p, label, size = 110){ const r = size / 2 - 9, c = 2 * Math.PI * r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--soft)" stroke-width="10" fill="none"/>${p > 0 ? `<circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--ok)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${c * Math.min(p, 1)} ${c}"/>` : ""}</svg><b>${label}</b></div>`; }
function prn(x){ const own = x.pr && x.pr[lang()];
  if (!own) return `<div class="tl">${esc(x.tr_)}</div>`;
  return `<div class="tl own">${esc(own)}</div>${["hi","bn"].includes(lang()) ? `<div class="tl lat">${esc(x.tr_)}</div>` : ""}`; }
const getFull = () => `<a class="btn sm gold" href="${ETSY_URL}" target="_blank" rel="noopener" style="text-decoration:none">${esc(t("get_full"))}</a>`;
const lockCard = (title, sub) => `<div class="card lockc"><div class="lk">🔒</div><div><h3 style="margin:0 0 4px">${esc(title)}</h3>${sub ? `<p style="margin:0 0 8px;color:var(--mute)">${esc(sub)}</p>` : ""}<p style="margin:0 0 10px;font-weight:600;color:var(--gold)">${esc(t("locked"))}</p>${getFull()}</div></div>`;
async function sha256(x){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(x)); return [...new Uint8Array(b)].map(v => v.toString(16).padStart(2, "0")).join(""); }
function duaCard(d, i){
  if (DEMO && i >= DEMO_DUAS) return lockCard(L(d.title), L(CATS[d.cat]));
  const fav = S.fav.includes(d.id);
  return `<div class="card dua"><div class="dhead"><div><h3 style="margin-bottom:4px">${esc(L(d.title))}</h3><span class="pill">${esc(L(CATS[d.cat]))}</span></div>
   <button class="star" data-a="fav" data-id="${d.id}" aria-label="${esc(t("favourites"))}">${fav ? "★" : "☆"}</button></div>
   <div class="ar" lang="ar">${esc(d.ar)}</div>${S.translit ? prn(d) : ""}
   <div class="mn">${esc(L(d.m))}</div>${lang() !== "en" && S.english ? `<div class="en">${esc(d.m.en)}</div>` : ""}
   ${d.note ? `<div class="note">💡 ${esc(L(d.note))}</div>` : ""}<div class="src">${esc(t("source"))}: ${esc(d.src)}</div></div>`;
}
const duaById = id => DUAS.find(d => d.id === id);
const dayNav = (k, n) => `<div class="row" style="justify-content:space-between;margin-bottom:12px"><button class="btn ghost sm" data-a="dnav" data-k="${k}" data-d="-1" ${n <= 1 ? "disabled" : ""}>‹ ${esc(t("prev"))}</button><b>${esc(t("day"))} ${n} · ${esc(fmtD(gdate(n)))}</b><button class="btn ghost sm" data-a="dnav" data-k="${k}" data-d="1" ${n >= S.len ? "disabled" : ""}>${esc(t("next"))} ›</button></div>`;
const checklist = (items, store, act) => items.map((it, i) => { const on = !!store[i]; return `<div class="it ${on ? "on" : ""}"><button class="chk ${on ? "on" : ""}" data-a="${act}" data-i="${i}" aria-pressed="${on}">${on ? "✓" : ""}</button><span>${esc(typeof it === "string" ? it : L(it))}</span></div>`; }).join("");

/* ---------- views ---------- */

  let cd;
  if (st.k === "starts_in") cd = `<div class="k">${esc(t("starts_in"))}</div><div class="big">${st.days} ${esc(t("days"))}</div><div style="color:var(--mute)">${esc(fmtD(gdate(1), {weekday: "long", day: "numeric", month: "long", year: "numeric"}))}</div>`;
  else if (st.k === "eid" || st.k === "eve") cd = `<div class="k">${esc(t("day_x"))} ${S.len} ✓</div><div class="big">${esc(t("eid_mub"))}</div>`;
  else if (st.k === "day") cd = `<div class="k">${esc(t("day_x"))} ${n}</div><div class="big">${esc(fmtD(gdate(n), {weekday: "long", day: "numeric", month: "long"}))}</div>`;
  else cd = `<div class="k">${esc(t(st.k))}${inRamadan(n) ? ` · ${esc(t("day_x"))} ${n}` : ""}</div><div class="big" id="cd" data-at="${+st.at}">${hms(st.at - new Date())}</div><div style="color:var(--mute)">${esc(fmtT(st.at))} · ${esc(c.n)}</div>`;
  const tn = c ? times(gdate(today || (n < 1 ? 1 : S.len))) : null, hl = st.k === "iftar_in" ? "maghrib" : st.k === "suhoor_in" ? "fajr" : "";

    `<div class="notice" style="margin-top:14px">📍 ${esc(t("set_city"))} <button class="btn sm" style="margin-inline-start:8px" data-v="times">${esc(t("choose_city"))}</button></div>`;
  const fasted = Object.values(S.d).filter(x => x.f === "y").length;

  const dua = DUAS[((today || 1) - 1) % (DEMO ? DEMO_DUAS : DUAS.length)];
  return `<div class="hero"><div class="salam" lang="ar">رَمَضَان مُبَارَك</div><h1>${esc(t("hero_t"))}</h1><p>${esc(t("hero_s"))}</p>
    <div class="chips">${LANGS.map(([cc, nn]) => `<button class="chip ${lang() === cc ? "on" : ""}" data-a="lang" data-l="${cc}">${esc(nn)}</button>`).join("")}</div></div>
   <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr);margin-top:16px" id="homeTop">
    <div class="card"><div class="cdcard"><div>${cd}</div></div>${timeline}</div>
    <div class="card center"><div class="k">${esc(t("tracker"))}</div>${ring(fasted / S.len, `${fasted}/${S.len}`)}<div style="color:var(--mute);font-weight:600">${esc(t("fasts_kept"))}</div><button class="btn sm" data-v="tracker">${esc(t("tracker"))} →</button></div>
   </div>
   <div class="grid g2" style="margin-top:16px">${quick}<div><div class="k" style="margin:4px 0 8px">${esc(t("dua_today"))}</div>${duaCard(dua, 0)}</div></div>
   <div class="k" style="margin:22px 0 8px">${esc(t("quick"))}</div>
   <div class="grid g4">${[["dhikr","📿"],["quran","📖"],["last10","✨"],["charity","💝"],["meals","🍲"],["family","🧒"],["eid","🎉"],["journal","📝"]].map(([v, e]) => `<div class="card tool" data-v="${v}" tabindex="0"><span class="e">${e}</span><b>${esc(t(v))}</b></div>`).join("")}</div>`;
}
function dayForm(n, compact){

  return `<div class="lbl">${esc(t("fast"))}</div><div class="chips"><button class="chip ${x.f === "y" ? "ok" : ""}" data-a="fst" data-n="${n}" data-val="y">✓ ${esc(t("fasted"))}</button>${reasons.map(r => `<button class="chip ${x.f === r ? "on" : ""}" data-a="fst" data-n="${n}" data-val="${r}">${esc(t(r))}</button>`).join("")}</div>
   <div class="lbl">${esc(t("prayers"))}</div><div class="prs">${pn.map((p, i) => `<button class="chip ${x.p[i] ? "ok" : ""}" data-a="pr" data-n="${n}" data-i="${i}">${esc(t(p))}</button>`).join("")}</div>
   <div class="chips" style="margin-top:10px">${[["t","taraweeh","🌙"],["s","sadaqah","💝"],["g","good_deed","🌱"],["z","dhikr_t","📿"]].map(([k, lab, e]) => `<button class="chip ${x[k] ? "ok" : ""}" data-a="tg" data-n="${n}" data-k="${k}">${e} ${esc(t(lab))}</button>`).join("")}</div>
   <div class="spread" style="margin-top:12px"><span class="lbl" style="margin:0">📖 ${esc(t("q_pages"))}</span><span class="stepper"><button class="btn ghost sm" data-a="qp" data-n="${n}" data-d="-1">−</button><b>${x.q}</b><button class="btn ghost sm" data-a="qp" data-n="${n}" data-d="1">+1</button><button class="btn ghost sm" data-a="qp" data-n="${n}" data-d="5">+5</button></span></div>
   ${compact ? "" : `<div class="lbl">💧 ${esc(t("water"))}</div>${glasses(n)}`}`;
}
const glasses = n => `<div class="glass">${Array.from({length: 8}, (_, i) => `<button class="${dd(n).w > i ? "on" : ""}" data-a="wt" data-n="${n}" data-val="${i + 1}" aria-label="${i + 1}">${dd(n).w > i ? "💧" : ""}</button>`).join("")}</div>`;
function vTimes(){
  const c = cityObj(), groups = {};
  CITIES.forEach(ci => (groups[ci.c] = groups[ci.c] || []).push(ci));
  const citySel = `<select class="inp" data-sel="city"><option value="">— ${esc(t("choose_city"))} —</option>${S.loc ? `<option value="loc" ${S.city === "loc" ? "selected" : ""}>📍 ${esc(t("my_loc"))}</option>` : ""}${Object.entries(groups).map(([g, list]) => `<optgroup label="${esc(g)}">${list.map(ci => `<option value="${ci.id}" ${S.city === ci.id ? "selected" : ""}>${esc(ci.n)}</option>`).join("")}</optgroup>`).join("")}</select>`;
  const settings = `<div class="card"><h3>📍 ${esc(t("location"))}</h3>${citySel}<button class="btn ghost sm" style="margin-top:10px" data-a="geo">📡 ${esc(t("use_loc"))}</button>
    <label class="lbl">${esc(t("method"))}</label><select class="inp" data-sel="method">${Object.entries(PT_METHODS).map(([k, m]) => `<option value="${k}" ${S.method === k ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
    <label class="lbl">${esc(t("asr_m"))}</label><select class="inp" data-sel="asr"><option value="1" ${+S.asr === 1 ? "selected" : ""}>${esc(t("asr_std"))}</option><option value="2" ${+S.asr === 2 ? "selected" : ""}>${esc(t("asr_han"))}</option></select></div>
   <div class="card"><h3>🌙 ${esc(t("start_date"))}</h3><input type="date" class="inp" style="border-radius:14px;width:100%" value="${esc(S.start)}" data-path="start" data-rr="1">
    <label class="lbl">${esc(t("length"))}</label><div class="chips">${[29, 30].map(v => `<button class="chip ${S.len === v ? "on" : ""}" data-a="len" data-val="${v}">${v} ${esc(t("days"))}</button>`).join("")}</div>
    <p class="notice" style="margin:12px 0 0">${esc(t("moon_note"))}</p></div>
   <div class="card"><h3>⏱️ ${esc(t("adjust"))}</h3><p style="margin:0 0 10px;color:var(--mute);font-size:14px">${esc(t("adjust_s"))}</p><div class="adj">${["fajr","sunrise","dhuhr","asr","maghrib","isha"].map(k => `<div><small>${esc(t(k))}</small><div class="row" style="justify-content:center;gap:6px"><button data-a="adj" data-k="${k}" data-d="-1">−</button><b>${S.adj[k] > 0 ? "+" : ""}${S.adj[k]}</b><button data-a="adj" data-k="${k}" data-d="1">+</button></div></div>`).join("")}</div></div>`;
  const td = dayIdx();

    </tbody></table></div><p style="color:var(--mute);font-size:13px;margin:10px 0 0">${esc(t("imsak_note"))} ✦ = ${esc(t("last10"))}</p></div>` :

  return `<div class="top"><div><h1>${esc(t("times"))}</h1><p>${esc(t("times_sub"))}</p></div></div><div class="grid g3">${settings}</div>${table}`;
}
function vTracker(){
  const n0 = curDay(); if (tday == null || tday > S.len) tday = n0;
  const td = dayIdx();
  const grid = `<div class="days">${Array.from({length: S.len}, (_, i) => { const n = i + 1, x = S.d[n], sc = score(n), lock = DEMO && n > DEMO_DAYS;
    const cls = lock ? "lock" : x && x.f && x.f !== "y" ? "miss" : sc >= 9 ? "full" : sc > 0 ? "part" : "";
    return `<button class="dbtn ${cls} ${n === tday ? "sel" : ""} ${n === td ? "today" : ""}" data-a="tday" data-n="${n}">${lock ? "🔒" : n}<small>${esc(fmtD(gdate(n), {day: "numeric", month: "short"}))}</small></button>`; }).join("")}</div>`;
  const detail = DEMO && tday > DEMO_DAYS ? lockCard(`${t("day")} ${tday}`, t("tracker_sub")) :
    `<div class="card"><div class="spread"><h3 style="margin:0">${esc(t("day"))} ${tday} · ${esc(fmtD(gdate(tday), {weekday: "long", day: "numeric", month: "long"}))}</h3>${ring(score(tday) / 10, `${score(tday)}/10`, 64)}</div>${dayForm(tday)}</div>`;
  const missed = Object.values(S.d).filter(x => x.f && x.f !== "y").length, left = Math.max(0, missed - S.madeUp);
  const tot = {fast: 0, pr: 0, tar: 0, q: 0, g: 0};
  Object.values(S.d).forEach(x => { tot.fast += x.f === "y"; tot.pr += x.p.reduce((a, b) => a + b, 0); tot.tar += x.t; tot.q += x.q; tot.g += x.g; });
  const dh = Object.values(S.dt).reduce((a, b) => a + b, 0), sq = S.sq.reduce((a, b) => a + num(b.a), 0), jn = Object.values(S.jr).filter(j => (j.t || "").trim() || (j.g || "").trim()).length;
  const stats = [[tot.fast, t("fasts_kept")], [tot.pr, t("prayers_prayed")], [tot.tar, t("tar_nights")], [tot.q, t("pages_read")], [dh, t("dhikr_count")], [money(sq), t("given")], [tot.g, t("good_deeds")], [jn, t("journal")]];
  return `<div class="top"><div><h1>${esc(t("tracker"))}</h1><p>${esc(t("tracker_sub"))}</p></div></div>

}
function vQuran(){
  const total = 604 * S.qGoal, read = Object.values(S.d).reduce((a, x) => a + x.q, 0), n = dayIdx();
  const daysLeft = n < 1 ? S.len : Math.max(1, S.len - n + 1), left = Math.max(0, total - read);
  const perDay = Math.ceil(left / daysLeft), expected = n < 1 ? 0 : Math.round(total * Math.min(n - 1, S.len) / S.len);
  return `<div class="top"><div><h1>${esc(t("quran"))}</h1><p>${esc(t("quran_sub"))}</p></div></div>
   <div class="grid g2"><div class="card"><h3>🎯 ${esc(t("goal"))}</h3><div class="chips">${[1, 2, 3].map(g => `<button class="chip ${S.qGoal === g ? "on" : ""}" data-a="qg" data-val="${g}">${g} ${esc(t(g > 1 ? "khatams" : "khatam"))}</button>`).join("")}</div>

     <div class="bar" style="margin-top:14px"><i style="width:${Math.min(100, read / total * 100)}%"></i></div>
     <p class="notice" style="margin:12px 0 0">${esc(t(read >= expected ? "on_track" : "behind"))}</p></div>
    <div class="card"><h3>📗 ${esc(t("juz"))}</h3><p style="margin:0 0 10px;color:var(--mute);font-size:14px">${esc(t("juz_s"))}</p><div class="juz">${Array.from({length: 30}, (_, i) => `<button class="${S.juz[i] ? "on" : ""}" data-a="juz" data-i="${i}">${i + 1}</button>`).join("")}</div>
     <div class="bar" style="margin-top:14px"><i style="width:${S.juz.filter(Boolean).length / 30 * 100}%"></i></div></div></div>`;
}

  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" style="text-align:center"><div style="display:flex;justify-content:center">${ICON}</div><div lang="ar" style="font-family:var(--f-ar);font-size:28px;color:var(--gold);margin-top:8px">رَمَضَان مُبَارَك</div>
   <h2 style="margin:6px 0 4px">Ramadan Companion</h2><p style="color:var(--mute);margin:0 0 16px">Choose your language · اپنی زبان منتخب کریں · अपनी भाषा चुनें · ভাষা নির্বাচন করুন · Pumili ng wika · Dil seçin · Pilih bahasa</p>
   <div class="chips langpick" style="justify-content:center">${LANGS.map(([c, n]) => `<button class="chip" data-pick="${c}">${esc(n)}</button>`).join("")}</div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => { const c = e.target.dataset.pick; if (c) { S.lang = c; save(); bg.remove(); render(); } });
}
function ask(msg){ return new Promise(res => { const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" style="max-width:420px"><p style="margin-top:0;font-weight:600">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-r="0">${esc(t("cancel"))}</button><button class="btn" data-r="1">${esc(t("yes"))}</button></div></div>`;
  document.body.appendChild(bg); bg.addEventListener("click", e => { const r = e.target.dataset.r; if (r != null) { bg.remove(); res(r === "1"); } }); }); }
function setPath(path, val){ const ks = path.split("."); let o = S; for (let i = 0; i < ks.length - 1; i++) o = (o[ks[i]] = o[ks[i]] || {}); o[ks[ks.length - 1]] = val; }
const val = id => (document.getElementById(id) || {}).value || "";
const today = () => new Intl.DateTimeFormat(LOCALE[lang()], {day: "numeric", month: "short"}).format(new Date());

document.addEventListener("click", async e => {
  const v = e.target.closest("[data-v]"); if (v && V[v.dataset.v] && !e.target.closest(".modal")) { view = v.dataset.v; render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest("[data-a]"); if (!a || e.target.closest(".modal")) return; const act = a.dataset.a, n = +a.dataset.n, i = +a.dataset.i;
  const rr = () => { save(); render(); };
  switch (act) {
    case "lang": S.lang = a.dataset.l; rr(); break;
    case "theme": S.theme = a.dataset.m; rr(); break;
    case "fav": S.fav = S.fav.includes(a.dataset.id) ? S.fav.filter(x => x !== a.dataset.id) : [...S.fav, a.dataset.id]; rr(); break;
    case "cat": dcat = a.dataset.c; render(); break;
    case "fst": dd(n).f = dd(n).f === a.dataset.val ? "" : a.dataset.val; rr(); break;
    case "pr": dd(n).p[i] = dd(n).p[i] ? 0 : 1; rr(); break;
    case "tg": dd(n)[a.dataset.k] = dd(n)[a.dataset.k] ? 0 : 1; rr(); break;
    case "qp": dd(n).q = Math.max(0, dd(n).q + +a.dataset.d); rr(); break;
    case "wt": dd(n).w = dd(n).w === +a.dataset.val ? +a.dataset.val - 1 : +a.dataset.val; rr(); break;
    case "tday": tday = n; render(); break;
    case "mu": S.madeUp = Math.max(0, S.madeUp + +a.dataset.d); rr(); break;
    case "len": S.len = +a.dataset.val; rr(); break;
    case "adj": S.adj[a.dataset.k] = Math.max(-30, Math.min(30, (S.adj[a.dataset.k] || 0) + +a.dataset.d)); rr(); break;
    case "geo":
      if (!navigator.geolocation) { toast(t("loc_fail")); break; }
      navigator.geolocation.getCurrentPosition(p => { S.loc = {lat: p.coords.latitude, lng: p.coords.longitude, tz: Intl.DateTimeFormat().resolvedOptions().timeZone}; S.city = "loc"; rr(); }, () => toast(t("loc_fail")), {timeout: 10000}); break;
    case "qg": S.qGoal = +a.dataset.val; rr(); break;
    case "juz": S.juz[i] = !S.juz[i]; rr(); break;
    case "dsel": dsel = a.dataset.id; render(); break;
    case "dh": { S.dc[dsel] = (S.dc[dsel] || 0) + 1; S.dt[dsel] = (S.dt[dsel] || 0) + 1; const td = dayIdx(); if (inRamadan(td)) dd(td).z = 1; buzz(); rr(); break; }
    case "dhu": if (S.dc[dsel] > 0) { S.dc[dsel]--; S.dt[dsel] = Math.max(0, (S.dt[dsel] || 0) - 1); } rr(); break;
    case "dhr": S.dc[dsel] = 0; rr(); break;
    case "np": S.np[a.dataset.nt] = S.np[a.dataset.nt] || []; S.np[a.dataset.nt][i] = !S.np[a.dataset.nt][i]; rr(); break;
    case "ik": S.itk[i] = !S.itk[i]; rr(); break;
    case "ec": S.eidc[i] = !S.eidc[i]; rr(); break;
    case "zb": S.zk.basis = a.dataset.val; rr(); break;
    case "sqAdd": { const amt = num(val("sqA")); if (amt > 0) { S.sq.push({a: amt, n: val("sqN").trim(), dt: today()}); const td = dayIdx(); if (inRamadan(td)) dd(td).s = 1; rr(); } break; }
    case "sqDel": S.sq.splice(i, 1); rr(); break;
    case "shopAdd": { const x = val("shopIn").trim(); if (x) { S.shop.push({t: x, on: false}); rr(); document.getElementById("shopIn")?.focus(); } break; }
    case "shopTog": S.shop[i].on = !S.shop[i].on; rr(); break;
    case "shopDel": S.shop.splice(i, 1); rr(); break;
    case "kidAdd": { const x = val("kidIn").trim(); if (x) { S.kids.push({n: x, st: {}}); rr(); } break; }
    case "kidDel": if (await ask(`${t("delete")}: ${S.kids[i].n}?`)) { S.kids.splice(i, 1); rr(); } break;
    case "ks": { const k = S.kids[+a.dataset.c]; k.st = k.st || {}; k.st[kday] = k.st[kday] || []; k.st[kday][i] = !k.st[kday][i]; if (k.st[kday][i]) buzz(); rr(); break; }
    case "eiAdd": { const nm = val("eiN").trim(), amt = num(val("eiA")); if (nm && amt > 0) { S.eidi.push({n: nm, a: amt, k: val("eiK") || "give"}); rr(); } break; }
    case "eiDel": S.eidi.splice(i, 1); rr(); break;
    case "gfAdd": { const nm = val("gfN").trim(), g = val("gfG").trim(); if (nm || g) { S.gifts.push({n: nm, g, on: false}); rr(); } break; }
    case "gfTog": S.gifts[i].on = !S.gifts[i].on; rr(); break;
    case "gfDel": S.gifts.splice(i, 1); rr(); break;
    case "dnav": { const d = +a.dataset.d, k = a.dataset.k, cl = x => Math.min(S.len, Math.max(1, x + d));
      if (k === "m") mday = cl(mday); if (k === "j") jday = cl(jday); if (k === "k") kday = cl(kday); render(); break; }
    case "unlockCode": { const c = val("code").trim().toUpperCase(); if (!c) break;
      if (await sha256(c) === CODE_HASH) { try { localStorage.setItem("ramadan-licence", CODE_HASH); } catch(err) {} location.reload(); } else toast(t("code_bad")); break; }
    case "resetAll": if (await ask(t("reset_q"))) { const keep = {lang: S.lang, theme: S.theme, city: S.city, loc: S.loc, method: S.method, asr: S.asr, adj: S.adj, start: S.start, len: S.len, cur: S.cur};
      try { localStorage.setItem(KEY, JSON.stringify(keep)); } catch(err) {} location.reload(); } break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter") { const id = e.target.id, map = {code: "unlockCode", shopIn: "shopAdd", kidIn: "kidAdd", sqN: "sqAdd", sqA: "sqAdd", eiA: "eiAdd", gfG: "gfAdd"};
  if (map[id]) document.querySelector(`[data-a="${map[id]}"]`)?.click(); else if (e.target.matches?.(".nav a,.tool")) e.target.click(); } });
let jt;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "dq") { dq = el.value; const pos = el.selectionStart; render(); const n = document.getElementById("dq"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (el.dataset.path) { const p = el.dataset.path; let v = el.type === "number" || el.type === "range" ? el.value : el.value; if (p === "ar") v = +v;
    setPath(p, v); save(); if (p === "ar") document.documentElement.style.setProperty("--ar-size", v + "px"); updCalc();
    if (p.startsWith("jr.")) { clearTimeout(jt); const s = document.getElementById("jsaved"); if (s) { s.textContent = "…"; jt = setTimeout(() => s.textContent = "✓ " + t("saved"), 500); } } }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.sel) { const k = el.dataset.sel, v = el.value;
    if (k === "city") { S.city = v === "" ? null : v === "loc" ? "loc" : +v; if (typeof S.city === "number") S.method = CITIES[S.city].m; }
    else if (k === "asr") S.asr = +v; else S[k] = v; save(); render(); }
  if (el.dataset.tog) { S[el.dataset.tog] = el.checked; save(); }
  if (el.dataset.path && el.dataset.rr) { if (el.dataset.path === "start" && !/^\d{4}-\d{2}-\d{2}$/.test(el.value)) return; save(); render(); }
});
// live countdown: update the clock every second; redraw the page when a stage ends (e.g. at iftar)
setInterval(() => { const el = document.getElementById("cd"); if (!el || document.querySelector(".modal-bg")) return;
  const left = +el.dataset.at - Date.now(); if (left <= 0) { if (view === "home") render(); return; } el.textContent = hms(left); }, 1000);
render();
</script>

ुआ", "bn": "সফরের দোয়া", "tl": "Du'a sa paglalakbay", "tr": "Yolculuk duası", "id": "Doa naik kendaraan / bepergian"}, "ar": "اللّٰهُ أَكْبَرُ، اللّٰهُ أَكْبَرُ، اللّٰهُ أَكْبَرُ، سُبْحَانَ الَّذِي سَخَّرَ لَنَا هٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَىٰ رَبِّنَا لَمُنْقَلِبُونَ", "tr_": "Allahu akbar, Allahu akbar, Allahu akbar. Subhanal-ladhi sakh-khara lana hadha wa ma kunna lahu muqrinin, wa inna ila Rabbina la-munqalibun.", "m": {"en": "Allah is the Greatest (three times). Glory be to the One who made this travel easy for us, which we could not have done ourselves. And to our Lord we will surely return.", "ur": "اللہ سب سے بڑا ہے (تین بار)۔ پاک ہے وہ ذات جس نے اسے ہمارے قابو میں کر دیا، ہم خود اسے قابو میں نہیں کر سکتے تھے، اور ہم اپنے رب ہی کی طرف لوٹنے والے ہیں۔", "hi": "अल्लाह सबसे बड़ा है (तीन बार)। पाक है वह जिसने इसे हमारे बस में कर दिया, हम ख़ुद ऐसा नहीं कर सकते थे, और हम अपने रब की ओर ही लौटने वाले हैं।", "bn": "আল্লাহ সবচেয়ে মহান (তিনবার)। পবিত্র সেই সত্তা, যিনি একে আমাদের বশীভূত করেছেন, অথচ আমরা নিজেরা তা পারতাম না। আর আমরা অবশ্যই আমাদের রবের দিকে ফিরে যাব।", "tl": "Si Allah ang Pinakadakila (tatlong beses). Luwalhati sa Kanya na nagpadali nito para sa amin, na hindi namin kayang gawin nang mag-isa. At sa aming Panginoon kami ay tiyak na babalik.", "tr": "Allah en büyüktür (üç kez). Bunu bizim hizmetimize veren Allah'ı tesbih ederiz; biz buna kendi gücümüzle sahip olamazdık. Şüphesiz biz Rabbimize döneceğiz.", "id": "Allah Maha Besar (tiga kali). Maha Suci Dia yang telah menundukkan ini untuk kami, padahal kami tidak mampu menguasainya. Dan sesungguhnya kepada Tuhan kamilah kami akan kembali."}, "src": "Qur'an 43:13–14 · Sahih Muslim", "pr": {"hi": "अल्लाहु अकबर, अल्लाहु अकबर, अल्लाहु अकबर। सुब्हानल्लज़ी सख़्ख़-र लना हाज़ा व मा कुन्ना लहू मुक़रिनीन, व इन्ना इला रब्बिना लमुन्क़लिबून।", "bn": "আল্লাহু আকবার, আল্লাহু আকবার, আল্লাহু আকবার। সুবহানাল্লাযি সাখখারা লানা হাযা ওয়া মা কুন্না লাহু মুকরিনিন, ওয়া ইন্না ইলা রাব্বিনা লামুনকালিবুন।", "tr": "Allâhu ekber, Allâhu ekber, Allâhu ekber. Sübhânellezî sehhara lenâ hâzâ ve mâ künnâ lehû mukrinîn, ve innâ ilâ Rabbinâ le-munkalibûn.", "id": "Allāhu akbar, Allāhu akbar, Allāhu akbar. Subḥānalladzī sakhkhara lanā hādzā wa mā kunnā lahū muqrinīn, wa innā ilā Rabbinā lamunqalibūn."}}, {"id": "niyyah", "cat": "ihram", "title": {"en": "Intention for Umrah", "ur": "عمرے کی نیت", "hi": "उमराह की नीयत", "bn": "উমরাহর নিয়ত", "tl": "Intensiyon para sa Umrah", "tr": "Umre niyeti", "id": "Niat Umrah"}, "ar": "لَبَّيْكَ اللّٰهُمَّ عُمْرَةً", "tr_": "Labbayk Allahumma 'Umrah.", "m": {"en": "Here I am, O Allah, for Umrah. Say this at the miqat when you make your intention, before you cross it.", "ur": "حاضر ہوں اے اللہ، عمرے کے لیے۔ یہ میقات پر نیت کرتے وقت، میقات سے گزرنے سے پہلے کہیں۔", "hi": "हाज़िर हूँ ऐ अल्लाह, उमराह के लिए। इसे मीक़ात पर नीयत करते समय, मीक़ात पार करने से पहले कहें।", "bn": "আমি হাজির, হে আল্লাহ, উমরাহর জন্য। মিকাত পার হওয়ার আগে নিয়ত করার সময় এটি বলুন।", "tl": "Narito ako, O Allah, para sa Umrah. Sabihin ito sa miqat kapag nagnanais ka na, bago ito tawirin.", "tr": "Buyur Allah'ım, umre için buradayım. Bunu mîkatı geçmeden önce niyet ederken söyleyin.", "id": "Aku penuhi panggilan-Mu ya Allah untuk Umrah. Ucapkan ini di miqat saat berniat, sebelum melewatinya."}, "src": "Sahih Muslim (practice of the Prophet ﷺ)", "pr": {"hi": "लब्बैक अल्लाहुम्मा उमरह।", "bn": "লাব্বাইক আল্লাহুম্মা উমরাহ।", "tr": "Lebbeyk Allâhümme umre.", "id": "Labbaik Allāhumma 'umrah."}}, {"id": "talbiyah", "cat": "ihram", "title": {"en": "Talbiyah", "ur": "تلبیہ", "hi": "तल्बिया", "bn": "তালবিয়া", "tl": "Talbiyah", "tr": "Telbiye", "id": "Talbiyah"}, "ar": "لَبَّيْكَ اللّٰهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكَ", "tr_": "Labbayk Allahumma labbayk, labbayka la sharika laka labbayk, innal-hamda wan-ni'mata laka wal-mulk, la sharika lak.", "m": {"en": "Here I am, O Allah, here I am. Here I am, You have no partner, here I am. All praise, all blessings and all sovereignty belong to You. You have no partner.", "ur": "حاضر ہوں اے اللہ، حاضر ہوں۔ حاضر ہوں، تیرا کوئی شریک نہیں، حاضر ہوں۔ بے شک ساری تعریف، نعمت اور بادشاہی تیری ہی ہے، تیرا کوئی شریک نہیں۔", "hi": "हाज़िर हूँ ऐ अल्लाह, हाज़िर हूँ। हाज़िर हूँ, तेरा कोई शरीक नहीं, हाज़िर हूँ। बेशक सारी तारीफ़, नेमत और बादशाहत तेरी ही है, तेरा कोई शरीक नहीं।", "bn": "আমি হাজির, হে আল্লাহ, আমি হাজির। আমি হাজির, আপনার কোনো শরিক নেই, আমি হাজির। নিশ্চয়ই সকল প্রশংসা, নিয়ামত ও রাজত্ব আপনারই। আপনার কোনো শরিক নেই।", "tl": "Narito ako, O Allah, narito ako. Narito ako, wala Kang katambal, narito ako. Ang lahat ng papuri, biyaya at kapangyarihan ay sa Iyo. Wala Kang katambal.", "tr": "Buyur Allah'ım, buyur! Buyur, Senin hiçbir ortağın yoktur, buyur! Hamd, nimet ve mülk Senindir. Senin hiçbir ortağın yoktur.", "id": "Aku penuhi panggilan-Mu ya Allah, aku penuhi panggilan-Mu. Aku penuhi panggilan-Mu, tiada sekutu bagi-Mu. Sesungguhnya segala puji, nikmat, dan kerajaan adalah milik-Mu. Tiada sekutu bagi-Mu."}, "src": "Sahih al-Bukhari · Sahih Muslim", "note": {"en": "Men say it aloud, women quietly. Repeat it often from the miqat until you start tawaf."}, "pr": {"hi": "लब्बैक अल्लाहुम्मा लब्बैक, लब्बैका ला शरीका लका लब्बैक, इन्नल हम्दा वन्निअ्मता लका वल्मुल्क, ला शरीका लक।", "bn": "লাব্বাইক আল্লাহুম্মা লাব্বাইক, লাব্বাইকা লা শারিকা লাকা লাব্বাইক, ইন্নাল হামদা ওয়ান নি'মাতা লাকা ওয়াল মুলক, লা শারিকা লাক।", "tr": "Lebbeyk Allâhümme lebbeyk, lebbeyke lâ şerîke leke lebbeyk, inne'l-hamde ve'n-ni'mete leke ve'l-mülk, lâ şerîke lek.", "id": "Labbaik Allāhumma labbaik, labbaika lā syarīka laka labbaik, innal ḥamda wan ni'mata laka wal mulk, lā syarīka lak."}}, {"id": "enter_masjid", "cat": "masjid", "title": {"en": "Entering the masjid", "ur": "مسجد میں داخل ہونے کی دعا", "hi": "मस्जिद में दाख़िल होने की दुआ", "bn": "মসজিদে প্রবেশের দোয়া", "tl": "Pagpasok sa masjid", "tr": "Mescide girerken", "id": "Doa masuk masjid"}, "ar": "بِسْمِ اللّٰهِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَىٰ رَسُولِ اللّٰهِ، اللّٰهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", "tr_": "Bismillah, was-salatu was-salamu 'ala Rasulillah. Allahummaf-tah li abwaba rahmatik.", "m": {"en": "In the name of Allah, and peace and blessings be upon the Messenger of Allah. O Allah, open the doors of Your mercy for me.", "ur": "اللہ کے نام سے، اور درود و سلام ہو اللہ کے رسول پر۔ اے اللہ! میرے لیے اپنی رحمت کے دروازے کھول دے۔", "hi": "अल्लाह के नाम से, और दुरूद व सलाम हो अल्लाह के रसूल पर। ऐ अल्लाह! मेरे लिए अपनी रहमत के दरवाज़े खोल दे।", "bn": "আল্লাহর নামে, এবং আল্লাহর রাসুলের উপর দরুদ ও সালাম। হে আল্লাহ, আমার জন্য আপনার রহমতের দরজাগুলো খুলে দিন।", "tl": "Sa ngalan ni Allah, at kapayapaan at pagpapala sa Sugo ni Allah. O Allah, buksan Mo para sa akin ang mga pinto ng Iyong awa.", "tr": "Allah'ın adıyla. Salât ve selam Allah'ın Resûlü'ne olsun. Allah'ım, bana rahmetinin kapılarını aç.", "id": "Dengan nama Allah, shalawat dan salam atas Rasulullah. Ya Allah, bukakanlah untukku pintu-pintu rahmat-Mu."}, "src": "Sahih Muslim · Sunan Abu Dawud", "note": {"en": "Enter with your right foot first."}, "pr": {"hi": "बिस्मिल्लाह, वस्सलातु वस्सलामु अला रसूलिल्लाह। अल्लाहुम्मफ़्तह ली अब्वाबा रह्मतिक।", "bn": "বিসমিল্লাহ, ওয়াস সালাতু ওয়াস সালামু আলা রাসূলিল্লাহ। আল্লাহুম্মাফতাহ লি আবওয়াবা রাহমাতিক।", "tr": "Bismillâh, ve's-salâtü ve's-selâmü alâ Rasûlillâh. Allâhümme'ftah lî ebvâbe rahmetik.", "id": "Bismillāh, waṣ ṣalātu was salāmu 'alā Rasūlillāh. Allāhummaftaḥ lī abwāba raḥmatik."}}, {"id": "leave_masjid", "cat": "masjid", "title": {"en": "Leaving the masjid", "ur": "مسجد سے نکلنے کی دعا", "hi": "मस्जिद से निकलने की दुआ", "bn": "মসজিদ থেকে বের হওয়ার দোয়া", "tl": "Paglabas sa masjid", "tr": "Mescitten çıkarken", "id": "Doa keluar masjid"}, "ar": "بِسْمِ اللّٰهِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَىٰ رَسُولِ اللّٰهِ، اللّٰهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", "tr_": "Bismillah, was-salatu was-salamu 'ala Rasulillah. Allahumma inni as'aluka min fadlik.", "m": {"en": "In the name of Allah, and peace and blessings be upon the Messenger of Allah. O Allah, I ask You for Your bounty.", "ur": "اللہ کے نام سے، اور درود و سلام ہو اللہ کے رسول پر۔ اے اللہ! میں تجھ سے تیرا فضل مانگتا ہوں۔", "hi": "अल्लाह के नाम से, और दुरूद व सलाम हो अल्लाह के रसूल पर। ऐ अल्लाह! मैं तुझसे तेरा फ़ज़्ल माँगता हूँ।", "bn": "আল্লাহর নামে, এবং আল্লাহর রাসুলের উপর দরুদ ও সালাম। হে আল্লাহ, আমি আপনার অনুগ্রহ প্রার্থনা করি।", "tl": "Sa ngalan ni Allah, at kapayapaan at pagpapala sa Sugo ni Allah. O Allah, hinihiling ko ang Iyong biyaya.", "tr": "Allah'ın adıyla. Salât ve selam Allah'ın Resûlü'ne olsun. Allah'ım, Senden lütfunu isterim.", "id": "Dengan nama Allah, shalawat dan salam atas Rasulullah. Ya Allah, aku memohon karunia-Mu."}, "src": "Sahih Muslim · Sunan Abu Dawud", "note": {"en": "Leave with your left foot first."}, "pr": {"hi": "बिस्मिल्लाह, वस्सलातु वस्सलामु अला रसूलिल्लाह। अल्लाहुम्मा इन्नी अस्अलुका मिन फ़ज़्लिक।", "bn": "বিসমিল্লাহ, ওয়াস সালাতু ওয়াস সালামু আলা রাসূলিল্লাহ। আল্লাহুম্মা ইন্নি আসআলুকা মিন ফাদলিক।", "tr": "Bismillâh, ve's-salâtü ve's-selâmü alâ Rasûlillâh. Allâhümme innî es'elüke min fadlik.", "id": "Bismillāh, waṣ ṣalātu was salāmu 'alā Rasūlillāh. Allāhumma innī as'aluka min faḍlik."}}, {"id": "see_kaaba", "cat": "tawaf", "title": {"en": "When you first see the Kaaba", "ur": "کعبہ پر پہلی نظر", "hi": "काबा पर पहली नज़र", "bn": "প্রথম কাবা দেখার সময়", "tl": "Unang pagkakita sa Kaaba", "tr": "Kâbe'yi ilk gördüğünüzde", "id": "Saat pertama melihat Ka'bah"}, "ar": "اللّٰهُ أَكْبَرُ", "tr_": "Allahu akbar.", "m": {"en": "Allah is the Greatest. There is no fixed dua for this moment in the authentic narrations. Many scholars encourage you to make sincere dua from your heart, in any language.", "ur": "اللہ سب سے بڑا ہے۔ صحیح روایات میں اس لمحے کی کوئی مخصوص دعا نہیں۔ بہت سے علماء دل سے، کسی بھی زبان میں دعا کرنے کی ترغیب دیتے ہیں۔", "hi": "अल्लाह सबसे बड़ा है। सही रिवायतों में इस पल की कोई तय दुआ नहीं है। कई उलमा दिल से, किसी भी भाषा में दुआ करने की सलाह देते हैं।", "bn": "আল্লাহ সবচেয়ে মহান। সহিহ বর্ণনায় এই মুহূর্তের জন্য নির্দিষ্ট কোনো দোয়া নেই। অনেক আলেম যে কোনো ভাষায় মন থেকে আন্তরিক দোয়া করতে উৎসাহিত করেন।", "tl": "Si Allah ang Pinakadakila. Walang tiyak na du'a para sa sandaling ito sa mga tunay na salaysay. Hinihikayat ng maraming iskolar na mag-du'a nang taos-puso, sa anumang wika.", "tr": "Allah en büyüktür. Sahih rivayetlerde bu an için belirli bir dua yoktur. Pek çok âlim, herhangi bir dilde içten dua etmenizi tavsiye eder.", "id": "Allah Maha Besar. Tidak ada doa khusus untuk saat ini dalam riwayat yang sahih. Banyak ulama menganjurkan berdoa dengan tulus dari hati, dalam bahasa apa pun."}, "src": "Guidance", "pr": {"hi": "अल्लाहु अकबर।", "bn": "আল্লাহু আকবার।", "tr": "Allâhu ekber.", "id": "Allāhu akbar."}}, {"id": "start_round", "cat": "tawaf", "title": {"en": "Start of each round (Black Stone)", "ur": "ہر چکر کے آغاز پر (حجرِ اسود)", "hi": "हर चक्कर की शुरुआत (हजर-ए-असवद)", "bn": "প্রতি চক্করের শুরুতে (হাজরে আসওয়াদ)", "tl": "Simula ng bawat ikot (Itim na Bato)", "tr": "Her şavtın başında (Hacerü'l-Esved)", "id": "Awal setiap putaran (Hajar Aswad)"}, "ar": "بِسْمِ اللّٰهِ وَاللّٰهُ أَكْبَرُ", "tr_": "Bismillahi wallahu akbar.", "m": {"en": "In the name of Allah, and Allah is the Greatest. Face the Black Stone, raise your right hand towards it and say this at the start of every round.", "ur": "اللہ کے نام سے، اور اللہ سب سے بڑا ہے۔ ہر چکر کے آغاز پر حجرِ اسود کی طرف رخ کر کے دایاں ہاتھ اٹھائیں اور یہ کہیں۔", "hi": "अल्लाह के नाम से, और अल्लाह सबसे बड़ा है। हर चक्कर की शुरुआत में हजर-ए-असवद की ओर मुँह करके दायाँ हाथ उठाएँ और यह कहें।", "bn": "আল্লাহর নামে, আর আল্লাহ সবচেয়ে মহান। প্রতি চক্করের শুরুতে হাজরে আসওয়াদের দিকে মুখ করে ডান হাত তুলে এটি বলুন।", "tl": "Sa ngalan ni Allah, at si Allah ang Pinakadakila. Humarap sa Itim na Bato, itaas ang kanang kamay patungo rito at sabihin ito sa simula ng bawat ikot.", "tr": "Allah'ın adıyla, Allah en büyüktür. Her şavtın başında Hacerü'l-Esved'e dönüp sağ elinizi ona doğru kaldırarak bunu söyleyin.", "id": "Dengan nama Allah, dan Allah Maha Besar. Menghadap Hajar Aswad, angkat tangan kanan ke arahnya dan ucapkan ini di awal setiap putaran."}, "src": "Reported from Ibn Umar (al-Bayhaqi)", "pr": {"hi": "बिस्मिल्लाहि वल्लाहु अकबर।", "bn": "বিসমিল্লাহি ওয়াল্লাহু আকবার।", "tr": "Bismillâhi vallâhu ekber.", "id": "Bismillāhi wallāhu akbar."}}, {"id": "rabbana", "cat": "tawaf", "title": {"en": "Between the Yemeni Corner and the Black Stone", "ur": "رکنِ یمانی اور حجرِ اسود کے درمیان", "hi": "रुक्न-ए-यमानी और हजर-ए-असवद के बीच", "bn": "রুকনে ইয়ামানি ও হাজরে আসওয়াদের মাঝে", "tl": "Sa pagitan ng Sulok ng Yemen at Itim na Bato", "tr": "Rükn-i Yemânî ile Hacerü'l-Esved arasında", "id": "Antara Rukun Yamani dan Hajar Aswad"}, "ar": "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", "tr_": "Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina 'adhaban-nar.", "m": {"en": "Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.", "ur": "اے ہمارے رب! ہمیں دنیا میں بھلائی دے اور آخرت میں بھلائی دے، اور ہمیں آگ کے عذاب سے بچا۔", "hi": "ऐ हमारे रब! हमें दुनिया में भलाई दे और आख़िरत में भलाई दे, और हमें आग के अज़ाब से बचा।", "bn": "হে আমাদের রব, আমাদের দুনিয়াতে কল্যাণ দিন এবং আখিরাতে কল্যাণ দিন, আর আমাদের আগুনের শাস্তি থেকে রক্ষা করুন।", "tl": "Aming Panginoon, bigyan Mo kami ng kabutihan sa mundong ito at kabutihan sa Kabilang-buhay, at iligtas Mo kami sa parusa ng Apoy.", "tr": "Rabbimiz! Bize dünyada iyilik ver, ahirette de iyilik ver ve bizi ateş azabından koru.", "id": "Ya Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan lindungilah kami dari azab neraka."}, "src": "Qur'an 2:201 · Sunan Abu Dawud", "pr": {"hi": "रब्बना आतिना फ़िद्दुन्या हसनतंव व फ़िल आख़िरति हसनतंव व क़िना अज़ाबन्नार।", "bn": "রাব্বানা আতিনা ফিদ দুনইয়া হাসানাতাও ওয়া ফিল আখিরাতি হাসানাতাও ওয়া কিনা আযাবান নার।", "tr": "Rabbenâ âtinâ fi'd-dünyâ haseneten ve fi'l-âhirati haseneten ve kınâ azâbe'n-nâr.", "id": "Rabbanā ātinā fid dunyā ḥasanatan wa fil ākhirati ḥasanatan wa qinā 'adzāban nār."}}, {"id": "maqam", "cat": "tawaf", "title": {"en": "At Maqam Ibrahim", "ur": "مقامِ ابراہیم پر", "hi": "मक़ाम-ए-इब्राहीम पर", "bn": "মাকামে ইব্রাহিমে", "tl": "Sa Maqam Ibrahim", "tr": "Makam-ı İbrahim'de", "id": "Di Maqam Ibrahim"}, "ar": "وَاتَّخِذُوا مِنْ مَقَامِ إِبْرَاهِيمَ مُصَلًّى", "tr_": "Wattakhidhu mim-maqami Ibrahima musalla.", "m": {"en": "\"And take the station of Ibrahim as a place of prayer.\" Recite this, then pray 2 rak'ah behind Maqam Ibrahim if there is space (anywhere in the masjid is fine). Many recite Surah al-Kafirun in the first and Surah al-Ikhlas in the second.", "ur": "\"اور مقامِ ابراہیم کو نماز کی جگہ بناؤ۔\" یہ پڑھیں، پھر اگر جگہ ہو تو مقامِ ابراہیم کے پیچھے دو رکعت پڑھیں (مسجد میں کہیں بھی پڑھ سکتے ہیں)۔ پہلی رکعت میں سورۃ الکافرون اور دوسری میں سورۃ الاخلاص پڑھنا مسنون ہے۔", "hi": "\"और मक़ाम-ए-इब्राहीम को नमाज़ की जगह बनाओ।\" यह पढ़ें, फिर जगह हो तो मक़ाम-ए-इब्राहीम के पीछे दो रकअत पढ़ें (मस्जिद में कहीं भी पढ़ सकते हैं)। पहली में सूरह अल-काफ़िरून और दूसरी में सूरह अल-इख़लास पढ़ना सुन्नत है।", "bn": "\"আর মাকামে ইব্রাহিমকে নামাজের স্থান বানাও।\" এটি পড়ুন, তারপর জায়গা থাকলে মাকামে ইব্রাহিমের পেছনে দুই রাকাত পড়ুন (মসজিদের যে কোনো স্থানেও পড়া যায়)। প্রথম রাকাতে সূরা কাফিরুন ও দ্বিতীয় রাকাতে সূরা ইখলাস পড়া সুন্নত।", "tl": "\"At gawin ninyong dasalan ang kinatatayuan ni Ibrahim.\" Bigkasin ito, saka magdasal ng 2 rak'ah sa likod ng Maqam Ibrahim kung may puwang (puwede kahit saan sa masjid). Sunnah na basahin ang Surah al-Kafirun sa una at Surah al-Ikhlas sa ikalawa.", "tr": "\"İbrahim'in makamından kendinize bir namaz yeri edinin.\" Bunu okuyun, sonra yer varsa Makam-ı İbrahim'in arkasında 2 rekât kılın (mescidin herhangi bir yerinde de olur). Birinci rekâtta Kâfirûn, ikincide İhlâs okumak sünnettir.", "id": "\"Dan jadikanlah maqam Ibrahim sebagai tempat shalat.\" Bacalah ini, lalu shalat 2 rakaat di belakang Maqam Ibrahim jika ada tempat (di mana pun di masjid juga boleh). Disunnahkan membaca Surah al-Kafirun di rakaat pertama dan al-Ikhlas di rakaat kedua."}, "src": "Qur'an 2:125 · Sahih Muslim", "pr": {"hi": "वत्तख़िज़ू मिम्मक़ामि इब्राहीमा मुसल्ला।", "bn": "ওয়াত্তাখিযু মিম মাকামি ইবরাহিমা মুসাল্লা।", "tr": "Vettehızû min makâmi İbrâhîme musallâ.", "id": "Wattakhidzū mim maqāmi Ibrāhīma muṣallā."}}, {"id": "zamzam", "cat": "tawaf", "title": {"en": "Drinking Zamzam", "ur": "زمزم پیتے وقت", "hi": "ज़मज़म पीते समय", "bn": "জমজম পান করার সময়", "tl": "Pag-inom ng Zamzam", "tr": "Zemzem içerken", "id": "Minum air Zamzam"}, "ar": "اللّٰهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا وَاسِعًا، وَشِفَاءً مِنْ كُلِّ دَاءٍ", "tr_": "Allahumma inni as'aluka 'ilman nafi'an, wa rizqan wasi'an, wa shifa'an min kulli da'.", "m": {"en": "O Allah, I ask You for beneficial knowledge, plentiful provision and healing from every illness. The Prophet ﷺ said Zamzam is for whatever it is drunk for, so you may ask for anything good.", "ur": "اے اللہ! میں تجھ سے نفع دینے والا علم، کشادہ رزق اور ہر بیماری سے شفا مانگتا ہوں۔ نبی ﷺ نے فرمایا کہ زمزم جس نیت سے پیا جائے اسی کے لیے ہے، اس لیے کوئی بھی نیک دعا کریں۔", "hi": "ऐ अल्लाह! मैं तुझसे फ़ायदा देने वाला इल्म, कुशादा रोज़ी और हर बीमारी से शिफ़ा माँगता हूँ। नबी ﷺ ने फ़रमाया कि ज़मज़म जिस नीयत से पिया जाए उसी के लिए है, इसलिए कोई भी नेक दुआ करें।", "bn": "হে আল্লাহ, আমি আপনার কাছে উপকারী জ্ঞান, প্রশস্ত রিজিক এবং সব রোগ থেকে আরোগ্য চাই। নবী ﷺ বলেছেন, জমজম যে উদ্দেশ্যে পান করা হয় তার জন্যই, তাই যে কোনো ভালো দোয়া করুন।", "tl": "O Allah, hinihiling ko sa Iyo ang kapaki-pakinabang na kaalaman, masaganang kabuhayan at lunas sa bawat sakit. Sinabi ng Propeta ﷺ na ang Zamzam ay para sa anumang layunin ng pag-inom nito, kaya humiling ng anumang mabuti.", "tr": "Allah'ım, Senden faydalı ilim, geniş rızık ve her hastalıktan şifa isterim. Peygamber ﷺ zemzemin ne niyetle içilirse onun için olduğunu bildirmiştir; dilediğiniz hayrı isteyebilirsiniz.", "id": "Ya Allah, aku memohon kepada-Mu ilmu yang bermanfaat, rezeki yang luas, dan kesembuhan dari segala penyakit. Nabi ﷺ bersabda air Zamzam sesuai niat peminumnya, jadi mohonlah kebaikan apa pun."}, "src": "Commonly recited (attributed to Ibn Abbas) · hadith in Sunan Ibn Majah", "note": {"en": "Face the qiblah, say Bismillah and drink in three sips."}, "pr": {"hi": "अल्लाहुम्मा इन्नी अस्अलुका इल्मन नाफ़िअन, व रिज़्क़न वासिअन, व शिफ़ाअन मिन कुल्लि दा।", "bn": "আল্লাহুম্মা ইন্নি আসআলুকা ইলমান নাফিআন, ওয়া রিযকান ওয়াসিআন, ওয়া শিফাআন মিন কুল্লি দা।", "tr": "Allâhümme innî es'elüke ilmen nâfi'an, ve rızkan vâsi'an, ve şifâen min külli dâ'.", "id": "Allāhumma innī as'aluka 'ilman nāfi'an, wa rizqan wāsi'an, wa syifā'an min kulli dā'."}}, {"id": "safa_ayah", "cat": "sai", "title": {"en": "Approaching Safa", "ur": "صفا کے قریب", "hi": "सफ़ा के पास", "bn": "সাফার কাছে পৌঁছে", "tl": "Paglapit sa Safa", "tr": "Safa'ya yaklaşırken", "id": "Mendekati bukit Shafa"}, "ar": "إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَائِرِ اللّٰهِ ۝ أَبْدَأُ بِمَا بَدَأَ اللّٰهُ بِهِ", "tr_": "Innas-Safa wal-Marwata min sha'a'irillah. Abda'u bima bada'allahu bih.", "m": {"en": "\"Indeed, Safa and Marwah are among the symbols of Allah.\" I begin with what Allah began with. Say this only once, as you approach Safa at the start of Sa'i.", "ur": "\"بے شک صفا اور مروہ اللہ کی نشانیوں میں سے ہیں۔\" میں اسی سے شروع کرتا ہوں جس سے اللہ نے شروع کیا۔ یہ صرف ایک بار، سعی کے آغاز میں صفا کے قریب کہیں۔", "hi": "\"बेशक सफ़ा और मरवा अल्लाह की निशानियों में से हैं।\" मैं उसी से शुरू करता हूँ जिससे अल्लाह ने शुरू किया। इसे सिर्फ़ एक बार, सई की शुरुआत में सफ़ा के पास कहें।", "bn": "\"নিশ্চয়ই সাফা ও মারওয়া আল্লাহর নিদর্শনগুলোর অন্তর্ভুক্ত।\" আল্লাহ যা দিয়ে শুরু করেছেন, আমি তা দিয়েই শুরু করছি। সাঈর শুরুতে সাফার কাছে মাত্র একবার এটি বলুন।", "tl": "\"Tunay na ang Safa at Marwah ay kabilang sa mga sagisag ni Allah.\" Sinisimulan ko ang sinimulan ni Allah. Sabihin ito nang isang beses lamang, paglapit sa Safa sa simula ng Sa'i.", "tr": "\"Şüphesiz Safa ile Merve Allah'ın nişanelerindendir.\" Allah'ın başladığı yerden başlıyorum. Bunu yalnızca bir kez, sa'yin başında Safa'ya yaklaşırken söyleyin.", "id": "\"Sesungguhnya Shafa dan Marwah adalah sebagian dari syiar Allah.\" Aku memulai dengan apa yang Allah mulai. Ucapkan sekali saja, saat mendekati Shafa di awal Sa'i."}, "src": "Qur'an 2:158 · Sahih Muslim", "pr": {"hi": "इन्नस्सफ़ा वल्मर्वता मिन शआइरिल्लाह। अब्दउ बिमा बदअल्लाहु बिह।", "bn": "ইন্নাস সাফা ওয়াল মারওয়াতা মিন শাআইরিল্লাহ। আবদাউ বিমা বাদাআল্লাহু বিহ।", "tr": "İnne's-Safâ ve'l-Mervete min şeâirillâh. Ebdeü bimâ bedeallâhu bih.", "id": "Innaṣ Ṣafā wal Marwata min sya'ā'irillāh. Abda'u bimā bada'allāhu bih."}}, {"id": "on_hills", "cat": "sai", "title": {"en": "On Safa and Marwah", "ur": "صفا اور مروہ پر", "hi": "सफ़ा और मरवा पर", "bn": "সাফা ও মারওয়ার উপর", "tl": "Sa ibabaw ng Safa at Marwah", "tr": "Safa ve Merve üzerinde", "id": "Di atas Shafa dan Marwah"}, "ar": "اللّٰهُ أَكْبَرُ، اللّٰهُ أَكْبَرُ، اللّٰهُ أَكْبَرُ، لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ، لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ، أَنْجَزَ وَعْدَهُ، وَنَصَرَ عَبْدَهُ، وَهَزَمَ الْأَحْزَابَ وَحْدَهُ", "tr_": "Allahu akbar, Allahu akbar, Allahu akbar. La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamd, wa huwa 'ala kulli shay'in qadir. La ilaha illallahu wahdah, anjaza wa'dah, wa nasara 'abdah, wa hazamal-ahzaba wahdah.", "m": {"en": "Allah is the Greatest (three times). There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over all things. There is no god but Allah alone. He fulfilled His promise, helped His servant and defeated the confederates alone. Face the Kaaba, say this, make your own dua, and repeat it three times.", "ur": "اللہ سب سے بڑا ہے (تین بار)۔ اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں، اسی کی بادشاہی ہے اور اسی کی تعریف، اور وہ ہر چیز پر قادر ہے۔ اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس نے اپنا وعدہ پورا کیا، اپنے بندے کی مدد کی اور اکیلے ہی لشکروں کو شکست دی۔ کعبہ کی طرف رخ کر کے یہ کہیں، اپنی دعا کریں اور تین بار دہرائیں۔", "hi": "अल्लाह सबसे बड़ा है (तीन बार)। अल्लाह के सिवा कोई माबूद नहीं, वह अकेला है, उसका कोई शरीक नहीं, उसी की बादशाहत है और उसी की तारीफ़, और वह हर चीज़ पर क़ादिर है। अल्लाह के सिवा कोई माबूद नहीं, उसने अपना वादा पूरा किया, अपने बंदे की मदद की और अकेले ही लश्करों को हराया। काबा की ओर मुँह करके यह कहें, अपनी दुआ करें और तीन बार दोहराएँ।", "bn": "আল্লাহ সবচেয়ে মহান (তিনবার)। আল্লাহ ছাড়া কোনো উপাস্য নেই, তিনি এক, তাঁর কোনো শরিক নেই, রাজত্ব ও প্রশংসা তাঁরই, এবং তিনি সব কিছুর উপর ক্ষমতাবান। আল্লাহ ছাড়া কোনো উপাস্য নেই, তিনি এক, তিনি তাঁর প্রতিশ্রুতি পূর্ণ করেছেন, তাঁর বান্দাকে সাহায্য করেছেন এবং একাই সম্মিলিত বাহিনীকে পরাজিত করেছেন। কাবার দিকে মুখ করে এটি বলুন, নিজের দোয়া করুন এবং তিনবার পুনরাবৃত্তি করুন।", "tl": "Si Allah ang Pinakadakila (tatlong beses). Walang diyos maliban kay Allah lamang, walang katambal. Sa Kanya ang kapangyarihan at papuri, at Siya ay may kakayahan sa lahat ng bagay. Walang diyos maliban kay Allah lamang. Tinupad Niya ang Kanyang pangako, tinulungan ang Kanyang alipin at tinalo nang mag-isa ang mga magkakampi. Humarap sa Kaaba, sabihin ito, mag-du'a, at ulitin nang tatlong beses.", "tr": "Allah en büyüktür (üç kez). Allah'tan başka ilah yoktur; O tektir, ortağı yoktur. Mülk O'nundur, hamd O'nadır ve O her şeye kadirdir. Allah'tan başka ilah yoktur; O tektir. Vaadini yerine getirdi, kuluna yardım etti ve düşman toplulukları tek başına bozguna uğrattı. Kâbe'ye dönüp bunu söyleyin, kendi duanızı edin ve üç kez tekrarlayın.", "id": "Allah Maha Besar (tiga kali). Tiada tuhan selain Allah semata, tiada sekutu bagi-Nya. Milik-Nya kerajaan dan pujian, dan Dia Maha Kuasa atas segala sesuatu. Tiada tuhan selain Allah semata. Dia menepati janji-Nya, menolong hamba-Nya, dan mengalahkan pasukan sekutu sendirian. Menghadap Ka'bah, ucapkan ini, berdoalah, dan ulangi tiga kali."}, "src": "Sahih Muslim (hadith of Jabir)", "pr": {"hi": "अल्लाहु अकबर, अल्लाहु अकबर, अल्लाहु अकबर। ला इलाहा इल्लल्लाहु वह्दहू ला शरीका लह, लहुल मुल्कु व लहुल हम्द, व हुवा अला कुल्लि शैइन क़दीर। ला इलाहा इल्लल्लाहु वह्दह, अन्जज़ा वअ्दह, व नसरा अब्दह, व हज़मल अहज़ाबा वह्दह।", "bn": "আল্লাহু আকবার, আল্লাহু আকবার, আল্লাহু আকবার। লা ইলাহা ইল্লাল্লাহু ওয়াহদাহু লা শারিকা লাহ, লাহুল মুলকু ওয়া লাহুল হামদ, ওয়া হুয়া আলা কুল্লি শাইইন কাদির। লা ইলাহা ইল্লাল্লাহু ওয়াহদাহ, আনজাযা ওয়া'দাহ, ওয়া নাসারা আবদাহ, ওয়া হাযামাল আহযাবা ওয়াহদাহ।", "tr": "Allâhu ekber, Allâhu ekber, Allâhu ekber. Lâ ilâhe illallâhu vahdehû lâ şerîke leh, lehü'l-mülkü ve lehü'l-hamd, ve hüve alâ külli şey'in kadîr. Lâ ilâhe illallâhu vahdeh, enceze va'deh, ve nasara abdeh, ve hezeme'l-ahzâbe vahdeh.", "id": "Allāhu akbar, Allāhu akbar, Allāhu akbar. Lā ilāha illallāhu waḥdahū lā syarīka lah, lahul mulku wa lahul ḥamd, wa huwa 'alā kulli syai'in qadīr. Lā ilāha illallāhu waḥdah, anjaza wa'dah, wa naṣara 'abdah, wa hazamal aḥzāba waḥdah."}}, {"id": "green_lights", "cat": "sai", "title": {"en": "Between the green lights", "ur": "سبز روشنیوں کے درمیان", "hi": "हरी बत्तियों के बीच", "bn": "সবুজ বাতির মাঝে", "tl": "Sa pagitan ng mga berdeng ilaw", "tr": "Yeşil ışıklar arasında", "id": "Di antara lampu hijau"}, "ar": "رَبِّ اغْفِرْ وَارْحَمْ، إِنَّكَ أَنْتَ الْأَعَزُّ الْأَكْرَمُ", "tr_": "Rabbighfir warham, innaka antal-a'azzul-akram.", "m": {"en": "My Lord, forgive and have mercy. You are the Most Mighty, the Most Generous. Men jog lightly between the green lights; women walk normally.", "ur": "اے میرے رب! بخش دے اور رحم فرما، بے شک تو سب سے زیادہ عزت والا اور سب سے زیادہ کرم والا ہے۔ مرد سبز روشنیوں کے درمیان ہلکا دوڑیں، خواتین عام رفتار سے چلیں۔", "hi": "ऐ मेरे रब! बख़्श दे और रहम फ़रमा, बेशक तू सबसे ज़्यादा इज़्ज़त वाला और सबसे ज़्यादा करम वाला है। पुरुष हरी बत्तियों के बीच हल्का दौड़ें, महिलाएँ सामान्य चलें।", "bn": "হে আমার রব, ক্ষমা করুন ও দয়া করুন। নিশ্চয়ই আপনি সর্বাধিক পরাক্রমশালী, সর্বাধিক মহানুভব। পুরুষরা সবুজ বাতির মাঝে হালকা দৌড়ান; মহিলারা স্বাভাবিকভাবে হাঁটুন।", "tl": "Panginoon ko, magpatawad Ka at maawa. Ikaw ang Pinakamakapangyarihan, ang Pinakamapagbigay. Ang mga lalaki ay bahagyang tumakbo sa pagitan ng mga berdeng ilaw; ang mga babae ay lumakad nang normal.", "tr": "Rabbim, bağışla ve merhamet et. Şüphesiz Sen en aziz ve en cömert olansın. Erkekler yeşil ışıklar arasında hafifçe koşar; kadınlar normal yürür.", "id": "Ya Tuhanku, ampunilah dan rahmatilah. Sesungguhnya Engkau Maha Perkasa lagi Maha Mulia. Laki-laki berlari kecil di antara lampu hijau; perempuan berjalan biasa."}, "src": "Commonly recited (reported from Ibn Mas'ud and Ibn Umar)", "pr": {"hi": "रब्बिग़्फ़िर वर्हम, इन्नका अन्तल अअज़्ज़ुल अक्रम।", "bn": "রাব্বিগফির ওয়ারহাম, ইন্নাকা আনতাল আআযযুল আকরাম।", "tr": "Rabbiğfir verham, inneke ente'l-eazzü'l-ekrem.", "id": "Rabbighfir warḥam, innaka antal a'azzul akram."}}, {"id": "accept", "cat": "general", "title": {"en": "Dua for acceptance", "ur": "قبولیت کی دعا", "hi": "क़बूलियत की दुआ", "bn": "কবুলের দোয়া", "tl": "Du'a para sa pagtanggap", "tr": "Kabul duası", "id": "Doa agar diterima"}, "ar": "رَبَّنَا تَقَبَّلْ مِنَّا، إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ", "tr_": "Rabbana taqabbal minna, innaka antas-Sami'ul-'Alim.", "m": {"en": "Our Lord, accept this from us. You are the All-Hearing, the All-Knowing. Ibrahim and Ismail made this dua while raising the foundations of the Kaaba.", "ur": "اے ہمارے رب! ہم سے قبول فرما، بے شک تو سب کچھ سننے والا، سب کچھ جاننے والا ہے۔ ابراہیم اور اسماعیل علیہما السلام نے کعبہ کی بنیادیں اٹھاتے ہوئے یہ دعا کی تھی۔", "hi": "ऐ हमारे रब! हमसे क़बूल फ़रमा, बेशक तू सब कुछ सुनने वाला, सब कुछ जानने वाला है। इब्राहीम और इस्माईल (अ.) ने काबा की नींव उठाते हुए यह दुआ की थी।", "bn": "হে আমাদের রব, আমাদের পক্ষ থেকে কবুল করুন। নিশ্চয়ই আপনি সর্বশ্রোতা, সর্বজ্ঞ। ইব্রাহিম ও ইসমাইল (আ.) কাবার ভিত্তি তোলার সময় এই দোয়া করেছিলেন।", "tl": "Aming Panginoon, tanggapin Mo ito mula sa amin. Ikaw ang Lubos na Nakaririnig, ang Lubos na Nakaaalam. Ginawa nina Ibrahim at Ismail ang du'a na ito habang itinatayo ang pundasyon ng Kaaba.", "tr": "Rabbimiz, bizden kabul buyur. Şüphesiz Sen her şeyi işiten ve bilensin. Hz. İbrahim ve Hz. İsmail bu duayı Kâbe'nin temellerini yükseltirken etmişlerdir.", "id": "Ya Tuhan kami, terimalah dari kami. Sesungguhnya Engkau Maha Mendengar lagi Maha Mengetahui. Ibrahim dan Ismail berdoa demikian saat meninggikan fondasi Ka'bah."}, "src": "Qur'an 2:127", "pr": {"hi": "रब्बना तक़ब्बल मिन्ना, इन्नका अन्तस्समीउल अलीम।", "bn": "রাব্বানা তাকাব্বাল মিন্না, ইন্নাকা আনতাস সামিউল আলিম।", "tr": "Rabbenâ tekabbel minnâ, inneke ente's-semîu'l-alîm.", "id": "Rabbanā taqabbal minnā, innaka antas samī'ul 'alīm."}}, {"id": "parents", "cat": "general", "title": {"en": "Dua for parents", "ur": "والدین کے لیے دعا", "hi": "माता-पिता के लिए दुआ", "bn": "বাবা-মায়ের জন্য দোয়া", "tl": "Du'a para sa mga magulang", "tr": "Anne baba için dua", "id": "Doa untuk orang tua"}, "ar": "رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", "tr_": "Rabbir-hamhuma kama rabbayani saghira.", "m": {"en": "My Lord, have mercy on them as they raised me when I was small.", "ur": "اے میرے رب! ان دونوں پر رحم فرما جیسے انہوں نے بچپن میں میری پرورش کی۔", "hi": "ऐ मेरे रब! उन दोनों पर रहम फ़रमा जैसे उन्होंने बचपन में मेरी परवरिश की।", "bn": "হে আমার রব, তাঁদের প্রতি দয়া করুন, যেমন তাঁরা ছোটবেলায় আমাকে লালন-পালন করেছেন।", "tl": "Panginoon ko, kaawaan Mo sila gaya ng pagpapalaki nila sa akin noong ako'y maliit pa.", "tr": "Rabbim, onlar beni küçükken nasıl yetiştirdilerse Sen de onlara öyle merhamet et.", "id": "Ya Tuhanku, sayangilah keduanya sebagaimana mereka mendidikku di waktu kecil."}, "src": "Qur'an 17:24", "pr": {"hi": "रब्बिर्हम्हुमा कमा रब्बयानी सग़ीरा।", "bn": "রাব্বির হামহুমা কামা রাব্বায়ানি সাগিরা।", "tr": "Rabbirhamhümâ kemâ rabbeyânî sağîrâ.", "id": "Rabbirḥamhumā kamā rabbayānī ṣaghīrā."}}, {"id": "salam_prophet", "cat": "madinah", "title": {"en": "Salam to the Prophet ﷺ", "ur": "نبی ﷺ پر سلام", "hi": "नबी ﷺ पर सलाम", "bn": "নবী ﷺ-কে সালাম", "tl": "Salam sa Propeta ﷺ", "tr": "Peygamber ﷺ'e selam", "id": "Salam kepada Nabi ﷺ"}, "ar": "السَّلَامُ عَلَيْكَ يَا رَسُولَ اللّٰهِ", "tr_": "As-salamu 'alayka ya Rasulallah.", "m": {"en": "Peace be upon you, O Messenger of Allah. Say this calmly and respectfully, with a low voice, as you pass his blessed grave.", "ur": "آپ پر سلام ہو، اے اللہ کے رسول۔ روضۂ مبارک کے سامنے سے گزرتے ہوئے یہ سکون، ادب اور دھیمی آواز سے کہیں۔", "hi": "आप पर सलाम हो, ऐ अल्लाह के रसूल। रौज़ा-ए-मुबारक के सामने से गुज़रते हुए यह सुकून, अदब और धीमी आवाज़ से कहें।", "bn": "আপনার উপর সালাম, হে আল্লাহর রাসুল। তাঁর পবিত্র কবরের পাশ দিয়ে যাওয়ার সময় শান্তভাবে, আদবের সঙ্গে ও নিচু স্বরে এটি বলুন।", "tl": "Kapayapaan ay sumaiyo, O Sugo ni Allah. Sabihin ito nang mahinahon at magalang, sa mahinang tinig, habang dumaraan sa kanyang pinagpalang libingan.", "tr": "Selam sana ey Allah'ın Resûlü. Mübarek kabrinin önünden geçerken bunu sakin, edepli ve alçak bir sesle söyleyin.", "id": "Salam sejahtera atasmu, wahai Rasulullah. Ucapkan dengan tenang, sopan, dan suara pelan saat melewati makam beliau yang mulia."}, "src": "Practice of the Companions (Ibn Umar) · Muwatta Malik", "pr": {"hi": "अस्सलामु अलैका या रसूलल्लाह।", "bn": "আসসালামু আলাইকা ইয়া রাসূলাল্লাহ।", "tr": "Es-selâmü aleyke yâ Rasûlallâh.", "id": "Assalāmu 'alaika yā Rasūlallāh."}}, {"id": "salam_companions", "cat": "madinah", "title": {"en": "Salam to Abu Bakr and Umar (RA)", "ur": "ابوبکر اور عمر رضی اللہ عنہما پر سلام", "hi": "अबू बक्र और उमर (र.) पर सलाम", "bn": "আবু বকর ও উমর (রা.)-কে সালাম", "tl": "Salam kina Abu Bakr at Umar (RA)", "tr": "Hz. Ebû Bekir ve Hz. Ömer'e selam", "id": "Salam kepada Abu Bakar dan Umar (RA)"}, "ar": "السَّلَامُ عَلَيْكَ يَا أَبَا بَكْرٍ، السَّلَامُ عَلَيْكَ يَا عُمَرُ", "tr_": "As-salamu 'alayka ya Aba Bakr. As-salamu 'alayka ya 'Umar.", "m": {"en": "Peace be upon you, O Abu Bakr. Peace be upon you, O Umar. They are buried beside the Prophet ﷺ; move a little to the right after greeting him.", "ur": "آپ پر سلام ہو اے ابوبکر۔ آپ پر سلام ہو اے عمر۔ دونوں نبی ﷺ کے پہلو میں مدفون ہیں؛ نبی ﷺ کو سلام کے بعد تھوڑا دائیں ہو جائیں۔", "hi": "आप पर सलाम हो ऐ अबू बक्र। आप पर सलाम हो ऐ उमर। दोनों नबी ﷺ के पास दफ़्न हैं; नबी ﷺ को सलाम के बाद थोड़ा दाईं ओर हो जाएँ।", "bn": "আপনার উপর সালাম, হে আবু বকর। আপনার উপর সালাম, হে উমর। তাঁরা নবী ﷺ-এর পাশে শায়িত; নবী ﷺ-কে সালাম দেওয়ার পর একটু ডানে সরে যান।", "tl": "Kapayapaan ay sumaiyo, O Abu Bakr. Kapayapaan ay sumaiyo, O Umar. Sila ay nakalibing sa tabi ng Propeta ﷺ; umusog nang kaunti sa kanan matapos siyang batiin.", "tr": "Selam sana ey Ebû Bekir. Selam sana ey Ömer. İkisi de Peygamber ﷺ'in yanında medfundur; O'na selam verdikten sonra biraz sağa ilerleyin.", "id": "Salam atasmu wahai Abu Bakar. Salam atasmu wahai Umar. Keduanya dimakamkan di samping Nabi ﷺ; bergeserlah sedikit ke kanan setelah memberi salam kepada beliau."}, "src": "Practice of Ibn Umar · Muwatta Malik", "pr": {"hi": "अस्सलामु अलैका या अबा बक्र। अस्सलामु अलैका या उमर।", "bn": "আসসালামু আলাইকা ইয়া আবা বাকর। আসসালামু আলাইকা ইয়া উমার।", "tr": "Es-selâmü aleyke yâ Ebâ Bekr. Es-selâmü aleyke yâ Ömer.", "id": "Assalāmu 'alaika yā Abā Bakr. Assalāmu 'alaika yā 'Umar."}}, {"id": "graves", "cat": "madinah", "title": {"en": "Visiting graves (Baqi, Uhud)", "ur": "قبرستان کی زیارت (بقیع، احد)", "hi": "क़ब्रिस्तान की ज़ियारत (बक़ी, उहुद)", "bn": "কবর জিয়ারত (বাকি, উহুদ)", "tl": "Pagbisita sa libingan (Baqi, Uhud)", "tr": "Kabir ziyareti (Bakî, Uhud)", "id": "Ziarah kubur (Baqi, Uhud)"}, "ar": "السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللّٰهُ بِكُمْ لَلَاحِقُونَ، أَسْأَلُ اللّٰهَ لَنَا وَلَكُمُ الْعَافِيَةَ", "tr_": "As-salamu 'alaykum ahlad-diyari minal-mu'minina wal-muslimin, wa inna in sha'Allahu bikum la-lahiqun, as'alullaha lana wa lakumul-'afiyah.", "m": {"en": "Peace be upon you, O believers and Muslims who dwell here. If Allah wills, we will join you. I ask Allah for wellbeing for us and for you.", "ur": "اے اس بستی کے مومنو اور مسلمانو! تم پر سلام ہو۔ اگر اللہ نے چاہا تو ہم بھی تم سے ملنے والے ہیں۔ میں اللہ سے اپنے اور تمہارے لیے عافیت مانگتا ہوں۔", "hi": "ऐ इस बस्ती के मोमिनो और मुसलमानो! तुम पर सलाम हो। अगर अल्लाह ने चाहा तो हम भी तुमसे मिलने वाले हैं। मैं अल्लाह से अपने और तुम्हारे लिए आफ़ियत माँगता हूँ।", "bn": "হে এই আবাসের মুমিন ও মুসলিমগণ, আপনাদের উপর সালাম। আল্লাহ চাইলে আমরাও আপনাদের সঙ্গে মিলিত হব। আমি আল্লাহর কাছে আমাদের ও আপনাদের জন্য নিরাপত্তা চাই।", "tl": "Kapayapaan ay sumainyo, O mga mananampalataya at Muslim na naninirahan dito. Kung loloobin ni Allah, kami ay susunod sa inyo. Hinihiling ko kay Allah ang kapakanan para sa amin at sa inyo.", "tr": "Selam size ey bu diyarın mümin ve Müslüman sakinleri. İnşallah biz de size kavuşacağız. Allah'tan bize ve size afiyet dilerim.", "id": "Salam atas kalian wahai penghuni kubur dari kalangan mukminin dan muslimin. Insya Allah kami akan menyusul kalian. Aku memohon kepada Allah keselamatan untuk kami dan kalian."}, "src": "Sahih Muslim", "pr": {"hi": "अस्सलामु अलैकुम अहलद्दियारि मिनल मुअ्मिनीना वल मुस्लिमीन, व इन्ना इन शा अल्लाहु बिकुम ललाहिक़ून, अस्अलुल्लाहा लना व लकुमुल आफ़िया।", "bn": "আসসালামু আলাইকুম আহলাদ দিয়ারি মিনাল মু'মিনিনা ওয়াল মুসলিমিন, ওয়া ইন্না ইনশাআল্লাহু বিকুম লালাহিকুন, আসআলুল্লাহা লানা ওয়া লাকুমুল আফিয়াহ।", "tr": "Es-selâmü aleyküm ehle'd-diyâri mine'l-mü'minîne ve'l-müslimîn, ve innâ inşâallâhu biküm lelâhikûn, es'elullâhe lenâ ve lekümü'l-âfiyeh.", "id": "Assalāmu 'alaikum ahlad diyāri minal mu'minīna wal muslimīn, wa innā in syā'allāhu bikum lalāḥiqūn, as'alullāha lanā wa lakumul 'āfiyah."}}], "CATS": {"journey": {"en": "Journey", "ur": "سفر", "hi": "सफ़र", "bn": "সফর", "tl": "Paglalakbay", "tr": "Yolculuk", "id": "Perjalanan"}, "ihram": {"en": "Ihram", "ur": "احرام", "hi": "एहराम", "bn": "ইহরাম", "tl": "Ihram", "tr": "İhram", "id": "Ihram"}, "masjid": {"en": "Masjid", "ur": "مسجد", "hi": "मस्जिद", "bn": "মসজিদ", "tl": "Masjid", "tr": "Mescit", "id": "Masjid"}, "tawaf": {"en": "Tawaf", "ur": "طواف", "hi": "तवाफ़", "bn": "তাওয়াফ", "tl": "Tawaf", "tr": "Tavaf", "id": "Tawaf"}, "sai": {"en": "Sa'i", "ur": "سعی", "hi": "सई", "bn": "সাঈ", "tl": "Sa'i", "tr": "Sa'y", "id": "Sa'i"}, "madinah": {"en": "Madinah", "ur": "مدینہ", "hi": "मदीना", "bn": "মদিনা", "tl": "Madinah", "tr": "Medine", "id": "Madinah"}, "general": {"en": "General", "ur": "عام", "hi": "आम", "bn": "সাধারণ", "tl": "Pangkalahatan", "tr": "Genel", "id": "Umum"}}, "STEPS": [{"id": "prepare", "duas": ["travel"], "title": {"en": "Before you travel", "ur": "سفر سے پہلے", "hi": "सफ़र से पहले", "bn": "সফরের আগে", "tl": "Bago maglakbay", "tr": "Yolculuktan önce", "id": "Sebelum berangkat"}, "pts": {"en": ["Make a sincere intention that your Umrah is for Allah alone.", "Check your passport, visa and any vaccines currently required (rules change, so check before you book).", "Install the official Nusuk app. You will need it to book the Rawdah in Madinah.", "Learn the steps and duas in this app before you go, and pack using the Checklist.", "Ask family and friends for forgiveness and settle any debts."], "ur": ["خالص نیت کریں کہ آپ کا عمرہ صرف اللہ کے لیے ہے۔", "پاسپورٹ، ویزا اور اس وقت درکار ویکسین چیک کریں (قوانین بدلتے رہتے ہیں، بکنگ سے پہلے تصدیق کریں)۔", "سرکاری نُسک (Nusuk) ایپ انسٹال کریں۔ مدینہ میں روضہ کی بکنگ کے لیے اس کی ضرورت ہوگی۔", "جانے سے پہلے اس ایپ میں مراحل اور دعائیں سیکھ لیں اور چیک لسٹ کے مطابق سامان باندھیں۔", "گھر والوں اور دوستوں سے معافی مانگیں اور قرض ادا کر دیں۔"], "hi": ["सच्ची नीयत करें कि आपका उमराह सिर्फ़ अल्लाह के लिए है।", "पासपोर्ट, वीज़ा और अभी ज़रूरी वैक्सीन जाँच लें (नियम बदलते रहते हैं, बुकिंग से पहले पुष्टि करें)।", "आधिकारिक नुसुक (Nusuk) ऐप इंस्टॉल करें। मदीना में रौज़ा की बुकिंग के लिए इसकी ज़रूरत होगी।", "जाने से पहले इस ऐप में चरण और दुआएँ सीख लें और चेकलिस्ट से सामान पैक करें।", "घर वालों और दोस्तों से माफ़ी माँगें और क़र्ज़ चुका दें।"], "bn": ["আন্তরিক নিয়ত করুন যে আপনার উমরাহ কেবল আল্লাহর জন্য।", "পাসপোর্ট, ভিসা এবং বর্তমানে প্রয়োজনীয় টিকা যাচাই করুন (নিয়ম বদলায়, বুকিংয়ের আগে নিশ্চিত হোন)।", "অফিসিয়াল নুসুক (Nusuk) অ্যাপ ইনস্টল করুন। মদিনায় রওজা বুকিংয়ের জন্য এটি লাগবে।", "যাওয়ার আগে এই অ্যাপে ধাপ ও দোয়া শিখে নিন এবং চেকলিস্ট দেখে গোছান।", "পরিবার ও বন্ধুদের কাছে ক্ষমা চান এবং ঋণ পরিশোধ করুন।"], "tl": ["Gumawa ng tapat na intensiyon na ang iyong Umrah ay para kay Allah lamang.", "Suriin ang pasaporte, visa at anumang bakunang kasalukuyang kailangan (nagbabago ang patakaran, kaya suriin bago mag-book).", "I-install ang opisyal na Nusuk app. Kakailanganin mo ito sa pag-book ng Rawdah sa Madinah.", "Pag-aralan ang mga hakbang at du'a sa app na ito bago umalis, at mag-impake gamit ang Checklist.", "Humingi ng tawad sa pamilya at kaibigan at bayaran ang mga utang."], "tr": ["Umrenizin yalnızca Allah için olduğuna dair samimi bir niyet edin.", "Pasaportunuzu, vizenizi ve şu anda gerekli aşıları kontrol edin (kurallar değişebilir, rezervasyondan önce teyit edin).", "Resmî Nusuk uygulamasını yükleyin. Medine'de Ravza randevusu için gerekecek.", "Gitmeden önce bu uygulamadaki adımları ve duaları öğrenin, bavulu Kontrol Listesi ile hazırlayın.", "Ailenizden ve dostlarınızdan helallik isteyin, borçlarınızı ödeyin."], "id": ["Luruskan niat bahwa Umrah Anda semata-mata karena Allah.", "Periksa paspor, visa, dan vaksin yang saat ini diwajibkan (aturan bisa berubah, cek sebelum memesan).", "Pasang aplikasi resmi Nusuk. Anda membutuhkannya untuk memesan Raudhah di Madinah.", "Pelajari langkah dan doa di aplikasi ini sebelum berangkat, dan berkemas dengan Daftar Periksa.", "Minta maaf kepada keluarga dan teman serta lunasi utang."]}}, {"id": "ihram", "duas": ["niyyah", "talbiyah"], "title": {"en": "Ihram at the miqat", "ur": "میقات پر احرام", "hi": "मीक़ात पर एहराम", "bn": "মিকাতে ইহরাম", "tl": "Ihram sa miqat", "tr": "Mîkatta ihram", "id": "Ihram di miqat"}, "pts": {"en": ["Take a bath (ghusl), trim nails and remove unwanted hair before ihram. Men may use perfume on the body before ihram, not on the ihram cloth.", "Men wear two plain white unstitched sheets. Women wear modest, loose everyday clothes and keep the face and hands uncovered.", "Pray 2 rak'ah if it is not a disliked time (many schools recommend this).", "Before you pass the miqat, make your intention and say: Labbayk Allahumma 'Umrah. On a plane, the crew usually announce when you are near the miqat.", "Begin the Talbiyah and keep saying it until you start tawaf.", "Now avoid: perfume, cutting hair or nails, marital relations, hunting, and (for men) stitched clothes or covering the head."], "ur": ["احرام سے پہلے غسل کریں، ناخن تراشیں اور غیر ضروری بال صاف کریں۔ مرد احرام سے پہلے جسم پر خوشبو لگا سکتے ہیں، احرام کے کپڑے پر نہیں۔", "مرد دو سادہ سفید بغیر سلی چادریں پہنیں۔ خواتین سادہ، ڈھیلے عام کپڑے پہنیں اور چہرہ و ہاتھ کھلے رکھیں۔", "اگر مکروہ وقت نہ ہو تو دو رکعت نماز پڑھیں (اکثر مکاتب اس کی ترغیب دیتے ہیں)۔", "میقات سے گزرنے سے پہلے نیت کریں اور کہیں: لبیک اللہم عمرۃ۔ ہوائی جہاز میں عملہ عموماً میقات قریب آنے پر اعلان کرتا ہے۔", "تلبیہ شروع کریں اور طواف شروع ہونے تک پڑھتے رہیں۔", "اب ان سے بچیں: خوشبو، بال یا ناخن کاٹنا، میاں بیوی کے تعلقات، شکار، اور (مردوں کے لیے) سلے کپڑے یا سر ڈھانپنا۔"], "hi": ["एहराम से पहले ग़ुस्ल करें, नाख़ून काटें और ग़ैर-ज़रूरी बाल साफ़ करें। पुरुष एहराम से पहले शरीर पर ख़ुशबू लगा सकते हैं, एहराम के कपड़े पर नहीं।", "पुरुष दो सादी सफ़ेद बिना सिली चादरें पहनें। महिलाएँ सादे, ढीले रोज़ के कपड़े पहनें और चेहरा व हाथ खुले रखें।", "अगर मकरूह वक़्त न हो तो दो रकअत नमाज़ पढ़ें (ज़्यादातर मसलक इसकी सलाह देते हैं)।", "मीक़ात पार करने से पहले नीयत करें और कहें: लब्बैक अल्लाहुम्मा उमरतन। हवाई जहाज़ में क्रू आमतौर पर मीक़ात पास आने पर एलान करते हैं।", "तल्बिया शुरू करें और तवाफ़ शुरू होने तक पढ़ते रहें।", "अब इनसे बचें: ख़ुशबू, बाल या नाख़ून काटना, पति-पत्नी के संबंध, शिकार, और (पुरुषों के लिए) सिले कपड़े या सिर ढकना।"], "bn": ["ইহরামের আগে গোসল করুন, নখ কাটুন ও অপ্রয়োজনীয় লোম পরিষ্কার করুন। পুরুষরা ইহরামের আগে শরীরে সুগন্ধি লাগাতে পারেন, ইহরামের কাপড়ে নয়।", "পুরুষরা দুটি সাদা সেলাইবিহীন চাদর পরুন। মহিলারা শালীন, ঢিলেঢালা সাধারণ পোশাক পরুন এবং মুখ ও হাত খোলা রাখুন।", "মাকরুহ সময় না হলে দুই রাকাত নামাজ পড়ুন (অনেক মাযহাব এটি উৎসাহিত করে)।", "মিকাত পার হওয়ার আগে নিয়ত করুন এবং বলুন: লাব্বাইক আল্লাহুম্মা উমরাহ। বিমানে সাধারণত মিকাতের কাছাকাছি এলে ঘোষণা দেওয়া হয়।", "তালবিয়া শুরু করুন এবং তাওয়াফ শুরু করা পর্যন্ত পড়তে থাকুন।", "এখন এগুলো থেকে বিরত থাকুন: সুগন্ধি, চুল বা নখ কাটা, দাম্পত্য সম্পর্ক, শিকার, এবং (পুরুষদের) সেলাই করা কাপড় বা মাথা ঢাকা।"], "tl": ["Maligo (ghusl), gupitin ang kuko at alisin ang hindi kailangang buhok bago mag-ihram. Ang mga lalaki ay maaaring maglagay ng pabango sa katawan bago mag-ihram, hindi sa tela ng ihram.", "Ang mga lalaki ay magsuot ng dalawang payak na puting telang walang tahi. Ang mga babae ay magsuot ng disente at maluwag na karaniwang damit, nakalantad ang mukha at kamay.", "Magdasal ng 2 rak'ah kung hindi ito oras na hindi kanais-nais (inirerekomenda ng maraming paaralan).", "Bago lumampas sa miqat, gawin ang intensiyon at sabihin: Labbayk Allahumma 'Umrah. Sa eroplano, kadalasang nag-aanunsyo ang crew kapag malapit na sa miqat.", "Simulan ang Talbiyah at patuloy itong bigkasin hanggang magsimula ang tawaf.", "Iwasan na ngayon: pabango, paggupit ng buhok o kuko, relasyong mag-asawa, pangangaso, at (para sa lalaki) damit na may tahi o pagtakip ng ulo."], "tr": ["İhramdan önce gusül abdesti alın, tırnaklarınızı kesin ve istenmeyen tüyleri temizleyin. Erkekler ihramdan önce vücuda koku sürebilir, ihram örtüsüne değil.", "Erkekler iki sade, beyaz, dikişsiz örtü giyer. Kadınlar tesettürlü, bol günlük kıyafetler giyer; yüz ve eller açık kalır.", "Kerahat vakti değilse 2 rekât namaz kılın (birçok mezhep bunu tavsiye eder).", "Mîkatı geçmeden niyet edin ve şöyle deyin: Lebbeyk Allahümme umreten. Uçakta mîkata yaklaşınca genellikle anons yapılır.", "Telbiyeye başlayın ve tavafa başlayana kadar söylemeye devam edin.", "Artık şunlardan kaçının: koku sürmek, saç veya tırnak kesmek, eşler arası ilişki, avlanmak ve (erkekler için) dikişli elbise giymek veya başı örtmek."], "id": ["Mandi (ghusl), potong kuku, dan bersihkan bulu yang tidak diinginkan sebelum ihram. Laki-laki boleh memakai wewangian di badan sebelum ihram, bukan di kain ihram.", "Laki-laki memakai dua kain putih polos tanpa jahitan. Perempuan memakai pakaian sehari-hari yang sopan dan longgar, wajah dan telapak tangan terbuka.", "Shalat 2 rakaat jika bukan waktu terlarang (dianjurkan banyak mazhab).", "Sebelum melewati miqat, berniat dan ucapkan: Labbaik Allahumma 'Umrah. Di pesawat, awak biasanya mengumumkan saat mendekati miqat.", "Mulailah membaca Talbiyah dan terus dibaca sampai memulai tawaf.", "Sekarang hindari: wewangian, memotong rambut atau kuku, hubungan suami istri, berburu, dan (bagi laki-laki) pakaian berjahit atau menutup kepala."]}}, {"id": "enter", "duas": ["enter_masjid", "see_kaaba"], "title": {"en": "Entering Masjid al-Haram", "ur": "مسجد الحرام میں داخلہ", "hi": "मस्जिद-अल-हराम में दाख़िला", "bn": "মসজিদুল হারামে প্রবেশ", "tl": "Pagpasok sa Masjid al-Haram", "tr": "Mescid-i Haram'a giriş", "id": "Masuk Masjidil Haram"}, "pts": {"en": ["Check in to your hotel, rest if needed and make wudu.", "Enter with your right foot and recite the dua for entering the masjid.", "When you see the Kaaba, take a moment. Make sincere dua from your heart.", "Keep your shoes in a bag with you, and agree a meeting point with your group in case you get separated."], "ur": ["ہوٹل میں سامان رکھیں، ضرورت ہو تو آرام کریں اور وضو کریں۔", "دایاں پاؤں پہلے رکھ کر داخل ہوں اور مسجد میں داخلے کی دعا پڑھیں۔", "کعبہ پر نظر پڑے تو ٹھہر جائیں اور دل سے دعا کریں۔", "جوتے تھیلے میں ساتھ رکھیں اور بچھڑ جانے کی صورت میں اپنے گروپ کے ساتھ ملنے کی جگہ طے کر لیں۔"], "hi": ["होटल में सामान रखें, ज़रूरत हो तो आराम करें और वुज़ू करें।", "दायाँ पैर पहले रखकर दाख़िल हों और मस्जिद में दाख़िले की दुआ पढ़ें।", "काबा पर नज़र पड़े तो ठहर जाएँ और दिल से दुआ करें।", "जूते थैले में साथ रखें और बिछड़ने की हालत के लिए अपने ग्रुप के साथ मिलने की जगह तय कर लें।"], "bn": ["হোটেলে উঠুন, প্রয়োজন হলে বিশ্রাম নিন এবং অজু করুন।", "ডান পা আগে দিয়ে প্রবেশ করুন এবং মসজিদে প্রবেশের দোয়া পড়ুন।", "কাবা দেখার সময় একটু থামুন এবং মন থেকে দোয়া করুন।", "জুতা ব্যাগে রেখে সঙ্গে রাখুন এবং হারিয়ে গেলে দলের সঙ্গে দেখা করার জায়গা ঠিক করে রাখুন।"], "tl": ["Mag-check in sa hotel, magpahinga kung kailangan at mag-wudu.", "Pumasok gamit ang kanang paa at bigkasin ang du'a sa pagpasok sa masjid.", "Pagkakita sa Kaaba, huminto sandali at mag-du'a nang taos-puso.", "Itago ang sapatos sa bag na dala mo, at magkasundo sa tagpuan ng grupo kung sakaling magkahiwalay."], "tr": ["Otelinize yerleşin, gerekirse dinlenin ve abdest alın.", "Sağ ayağınızla girin ve mescide giriş duasını okuyun.", "Kâbe'yi gördüğünüzde bir an durun ve içtenlikle dua edin.", "Ayakkabılarınızı bir torbada yanınızda taşıyın ve kaybolma ihtimaline karşı grubunuzla buluşma noktası belirleyin."], "id": ["Check-in di hotel, istirahat bila perlu, lalu berwudhu.", "Masuk dengan kaki kanan dan baca doa masuk masjid.", "Saat melihat Ka'bah, berhentilah sejenak dan berdoalah dengan tulus.", "Simpan sandal di tas yang Anda bawa, dan sepakati titik kumpul dengan rombongan jika terpisah."]}}, {"id": "tawaf", "duas": ["start_round", "rabbana"], "tool": "tawaf", "title": {"en": "Tawaf: 7 rounds of the Kaaba", "ur": "طواف: کعبہ کے سات چکر", "hi": "तवाफ़: काबा के सात चक्कर", "bn": "তাওয়াফ: কাবার সাত চক্কর", "tl": "Tawaf: 7 ikot sa Kaaba", "tr": "Tavaf: Kâbe etrafında 7 şavt", "id": "Tawaf: 7 putaran mengelilingi Ka'bah"}, "pts": {"en": ["You must have wudu. Stop the Talbiyah when you begin.", "Men uncover the right shoulder (idtiba') for the whole tawaf.", "Start at the line of the Black Stone. Face it, raise your right hand and say: Bismillahi wallahu akbar. Touch or kiss it only if it is easy; otherwise just point.", "Walk anti-clockwise with the Kaaba on your left. Men walk briskly (raml) in the first 3 rounds if possible.", "Between the Yemeni Corner and the Black Stone, recite: Rabbana atina fid-dunya hasanah… Elsewhere, make any dua or dhikr in any language.", "Use the Tawaf Counter to keep track of your 7 rounds."], "ur": ["وضو ضروری ہے۔ طواف شروع کرتے ہی تلبیہ بند کر دیں۔", "مرد پورے طواف میں دایاں کندھا کھلا رکھیں (اضطباع)۔", "حجرِ اسود کی سیدھ سے شروع کریں۔ اس کی طرف رخ کر کے دایاں ہاتھ اٹھائیں اور کہیں: بسم اللہ واللہ اکبر۔ آسانی ہو تو چھوئیں یا چومیں، ورنہ صرف اشارہ کریں۔", "کعبہ کو اپنے بائیں رکھ کر گھڑی کی سوئیوں کے الٹ چلیں۔ مرد ممکن ہو تو پہلے تین چکروں میں تیز چلیں (رمل)۔", "رکنِ یمانی اور حجرِ اسود کے درمیان پڑھیں: ربنا آتنا فی الدنیا حسنۃ… باقی جگہ کسی بھی زبان میں دعا یا ذکر کریں۔", "سات چکروں کی گنتی کے لیے طواف کاؤنٹر استعمال کریں۔"], "hi": ["वुज़ू ज़रूरी है। तवाफ़ शुरू करते ही तल्बिया बंद कर दें।", "पुरुष पूरे तवाफ़ में दायाँ कंधा खुला रखें (इज़्तिबा)।", "हजर-ए-असवद की सीध से शुरू करें। उसकी ओर मुँह करके दायाँ हाथ उठाएँ और कहें: बिस्मिल्लाहि वल्लाहु अकबर। आसानी हो तो छुएँ या चूमें, वरना सिर्फ़ इशारा करें।", "काबा को अपनी बाईं ओर रखकर घड़ी की उल्टी दिशा में चलें। पुरुष हो सके तो पहले तीन चक्करों में तेज़ चलें (रमल)।", "रुक्न-ए-यमानी और हजर-ए-असवद के बीच पढ़ें: रब्बना आतिना फ़िद्दुनिया हसनह… बाक़ी जगह किसी भी भाषा में दुआ या ज़िक्र करें।", "सात चक्करों की गिनती के लिए तवाफ़ काउंटर इस्तेमाल करें।"], "bn": ["অজু থাকা আবশ্যক। তাওয়াফ শুরু করলে তালবিয়া বন্ধ করুন।", "পুরুষরা পুরো তাওয়াফে ডান কাঁধ খোলা রাখুন (ইযতিবা)।", "হাজরে আসওয়াদের সোজা লাইন থেকে শুরু করুন। সেদিকে মুখ করে ডান হাত তুলে বলুন: বিসমিল্লাহি ওয়াল্লাহু আকবার। সহজ হলে স্পর্শ বা চুম্বন করুন, নইলে শুধু ইশারা করুন।", "কাবাকে বাম দিকে রেখে ঘড়ির কাঁটার উল্টো দিকে হাঁটুন। পুরুষরা সম্ভব হলে প্রথম তিন চক্করে দ্রুত হাঁটুন (রমল)।", "রুকনে ইয়ামানি ও হাজরে আসওয়াদের মাঝে পড়ুন: রাব্বানা আতিনা ফিদ্দুনিয়া হাসানাহ… অন্য জায়গায় যে কোনো ভাষায় দোয়া বা জিকির করুন।", "সাত চক্কর গোনার জন্য তাওয়াফ কাউন্টার ব্যবহার করুন।"], "tl": ["Kailangan mong may wudu. Ihinto ang Talbiyah kapag nagsimula ka.", "Ang mga lalaki ay ilantad ang kanang balikat (idtiba') sa buong tawaf.", "Magsimula sa linya ng Itim na Bato. Humarap dito, itaas ang kanang kamay at sabihin: Bismillahi wallahu akbar. Hawakan o halikan lamang kung madali; kung hindi, ituro na lang.", "Lumakad nang pakaliwa (counter-clockwise) na nasa kaliwa mo ang Kaaba. Ang mga lalaki ay maglakad nang mabilis (raml) sa unang 3 ikot kung kaya.", "Sa pagitan ng Sulok ng Yemen at Itim na Bato, bigkasin: Rabbana atina fid-dunya hasanah… Sa ibang bahagi, mag-du'a o dhikr sa anumang wika.", "Gamitin ang Pambilang ng Tawaf para mabilang ang 7 ikot."], "tr": ["Abdestli olmanız gerekir. Tavafa başlayınca telbiyeyi bırakın.", "Erkekler tavaf boyunca sağ omzu açık bırakır (ıztıba).", "Hacerü'l-Esved hizasından başlayın. Ona dönün, sağ elinizi kaldırıp şöyle deyin: Bismillahi vallahu ekber. Kolaysa dokunun veya öpün; değilse sadece işaret edin.", "Kâbe solunuzda kalacak şekilde saat yönünün tersine yürüyün. Erkekler mümkünse ilk 3 şavtta çalımlı yürür (remel).", "Rükn-i Yemânî ile Hacerü'l-Esved arasında okuyun: Rabbena âtina fi'd-dünya haseneh… Diğer yerlerde herhangi bir dilde dua ve zikir edin.", "7 şavtı takip etmek için Tavaf Sayacı'nı kullanın."], "id": ["Wajib dalam keadaan berwudhu. Hentikan Talbiyah saat memulai tawaf.", "Laki-laki membuka bahu kanan (idhtiba') selama tawaf.", "Mulai dari garis sejajar Hajar Aswad. Menghadap ke arahnya, angkat tangan kanan dan ucapkan: Bismillahi wallahu akbar. Sentuh atau cium hanya jika mudah; jika tidak, cukup berisyarat.", "Berjalan berlawanan arah jarum jam dengan Ka'bah di sisi kiri. Laki-laki berjalan cepat (raml) pada 3 putaran pertama jika bisa.", "Di antara Rukun Yamani dan Hajar Aswad, bacalah: Rabbana atina fid-dunya hasanah… Di tempat lain, berdoa atau berdzikir dalam bahasa apa pun.", "Gunakan Penghitung Tawaf untuk menghitung 7 putaran."]}}, {"id": "prayer", "duas": ["maqam", "zamzam"], "title": {"en": "2 rak'ah and Zamzam", "ur": "دو رکعت اور زمزم", "hi": "दो रकअत और ज़मज़म", "bn": "দুই রাকাত ও জমজম", "tl": "2 rak'ah at Zamzam", "tr": "2 rekât namaz ve zemzem", "id": "Shalat 2 rakaat dan Zamzam"}, "pts": {"en": ["Men cover the right shoulder again.", "Pray 2 rak'ah behind Maqam Ibrahim if there is space. If it is crowded, pray anywhere in the masjid.", "Drink Zamzam water, facing the qiblah, and make dua.", "Many people then return to the Black Stone to point to it before going to Safa (optional)."], "ur": ["مرد دوبارہ دایاں کندھا ڈھانپ لیں۔", "اگر جگہ ہو تو مقامِ ابراہیم کے پیچھے دو رکعت پڑھیں۔ رش ہو تو مسجد میں کہیں بھی پڑھ لیں۔", "قبلہ رخ ہو کر زمزم پئیں اور دعا کریں۔", "بہت سے لوگ صفا جانے سے پہلے حجرِ اسود کی طرف دوبارہ اشارہ کرتے ہیں (اختیاری)۔"], "hi": ["पुरुष फिर से दायाँ कंधा ढक लें।", "जगह हो तो मक़ाम-ए-इब्राहीम के पीछे दो रकअत पढ़ें। भीड़ हो तो मस्जिद में कहीं भी पढ़ लें।", "क़िबला की ओर मुँह करके ज़मज़म पिएँ और दुआ करें।", "बहुत से लोग सफ़ा जाने से पहले हजर-ए-असवद की ओर फिर से इशारा करते हैं (वैकल्पिक)।"], "bn": ["পুরুষরা আবার ডান কাঁধ ঢেকে নিন।", "জায়গা থাকলে মাকামে ইব্রাহিমের পেছনে দুই রাকাত পড়ুন। ভিড় থাকলে মসজিদের যে কোনো জায়গায় পড়ুন।", "কিবলামুখী হয়ে জমজম পান করুন এবং দোয়া করুন।", "অনেকে সাফায় যাওয়ার আগে আবার হাজরে আসওয়াদের দিকে ইশারা করেন (ঐচ্ছিক)।"], "tl": ["Ang mga lalaki ay takpan muli ang kanang balikat.", "Magdasal ng 2 rak'ah sa likod ng Maqam Ibrahim kung may puwang. Kung siksikan, magdasal kahit saan sa masjid.", "Uminom ng Zamzam na nakaharap sa qiblah, at mag-du'a.", "Marami ang bumabalik sa Itim na Bato upang ituro ito bago pumunta sa Safa (opsyonal)."], "tr": ["Erkekler sağ omzu tekrar örter.", "Yer varsa Makam-ı İbrahim'in arkasında 2 rekât kılın. Kalabalıksa mescidin herhangi bir yerinde kılın.", "Kıbleye dönerek zemzem için ve dua edin.", "Birçok kişi Safa'ya gitmeden önce tekrar Hacerü'l-Esved'e işaret eder (isteğe bağlı)."], "id": ["Laki-laki menutup kembali bahu kanan.", "Shalat 2 rakaat di belakang Maqam Ibrahim jika ada tempat. Jika ramai, shalat di mana saja di masjid.", "Minum air Zamzam menghadap kiblat, lalu berdoa.", "Banyak orang kembali berisyarat ke Hajar Aswad sebelum menuju Shafa (opsional)."]}}, {"id": "sai", "duas": ["safa_ayah", "on_hills", "green_lights"], "tool": "sai", "title": {"en": "Sa'i: 7 laps between Safa and Marwah", "ur": "سعی: صفا اور مروہ کے درمیان سات چکر", "hi": "सई: सफ़ा और मरवा के बीच सात चक्कर", "bn": "সাঈ: সাফা ও মারওয়ার মাঝে সাত চক্কর", "tl": "Sa'i: 7 lakad sa pagitan ng Safa at Marwah", "tr": "Sa'y: Safa ile Merve arasında 7 şavt", "id": "Sa'i: 7 kali antara Shafa dan Marwah"}, "pts": {"en": ["Go to Safa. As you approach it, recite: Innas-Safa wal-Marwata min sha'a'irillah… (once only).", "Climb a little, face the Kaaba, raise your hands, say the dhikr and make dua.", "Walk to Marwah. Men jog lightly between the green lights. That is lap 1.", "Marwah back to Safa is lap 2. You finish your 7th lap at Marwah.", "Wudu is recommended but not required for Sa'i. Use the Sa'i Counter to keep track."], "ur": ["صفا کی طرف جائیں۔ قریب پہنچ کر پڑھیں: إن الصفا والمروة من شعائر الله… (صرف ایک بار)۔", "تھوڑا اوپر چڑھیں، کعبہ کی طرف رخ کریں، ہاتھ اٹھائیں، ذکر کریں اور دعا مانگیں۔", "مروہ کی طرف چلیں۔ مرد سبز روشنیوں کے درمیان ہلکا دوڑیں۔ یہ پہلا چکر ہے۔", "مروہ سے صفا واپس دوسرا چکر ہے۔ ساتواں چکر مروہ پر ختم ہوتا ہے۔", "سعی کے لیے وضو مستحب ہے، فرض نہیں۔ گنتی کے لیے سعی کاؤنٹر استعمال کریں۔"], "hi": ["सफ़ा की ओर जाएँ। पास पहुँचकर पढ़ें: इन्नस्सफ़ा वल-मरवता मिन शआइरिल्लाह… (सिर्फ़ एक बार)।", "थोड़ा ऊपर चढ़ें, काबा की ओर मुँह करें, हाथ उठाएँ, ज़िक्र करें और दुआ माँगें।", "मरवा की ओर चलें। पुरुष हरी बत्तियों के बीच हल्का दौड़ें। यह पहला चक्कर है।", "मरवा से सफ़ा वापस दूसरा चक्कर है। सातवाँ चक्कर मरवा पर ख़त्म होता है।", "सई के लिए वुज़ू बेहतर है, ज़रूरी नहीं। गिनती के लिए सई काउंटर इस्तेमाल करें।"], "bn": ["সাফার দিকে যান। কাছে পৌঁছে পড়ুন: ইন্নাস সাফা ওয়াল মারওয়াতা মিন শাআইরিল্লাহ… (একবারই)।", "একটু উপরে উঠুন, কাবার দিকে মুখ করুন, হাত তুলুন, জিকির করুন ও দোয়া করুন।", "মারওয়ার দিকে হাঁটুন। পুরুষরা সবুজ বাতির মাঝে হালকা দৌড়ান। এটি প্রথম চক্কর।", "মারওয়া থেকে সাফায় ফেরা দ্বিতীয় চক্কর। সপ্তম চক্কর মারওয়ায় শেষ হয়।", "সাঈর জন্য অজু উত্তম, বাধ্যতামূলক নয়। গোনার জন্য সাঈ কাউন্টার ব্যবহার করুন।"], "tl": ["Pumunta sa Safa. Paglapit dito, bigkasin: Innas-Safa wal-Marwata min sha'a'irillah… (isang beses lamang).", "Umakyat nang kaunti, humarap sa Kaaba, itaas ang mga kamay, mag-dhikr at mag-du'a.", "Lumakad patungong Marwah. Ang mga lalaki ay bahagyang tumakbo sa pagitan ng mga berdeng ilaw. Iyan ang unang lakad.", "Mula Marwah pabalik sa Safa ay ikalawang lakad. Matatapos ang ika-7 lakad sa Marwah.", "Inirerekomenda ang wudu pero hindi kailangan sa Sa'i. Gamitin ang Pambilang ng Sa'i."], "tr": ["Safa'ya gidin. Yaklaşırken okuyun: İnne's-Safâ ve'l-Mervete min şeâirillâh… (yalnızca bir kez).", "Biraz yukarı çıkın, Kâbe'ye dönün, ellerinizi kaldırın, zikir ve dua edin.", "Merve'ye yürüyün. Erkekler yeşil ışıklar arasında hafifçe koşar. Bu 1. şavttır.", "Merve'den Safa'ya dönüş 2. şavttır. 7. şavt Merve'de biter.", "Sa'y için abdest tavsiye edilir ama şart değildir. Takip için Sa'y Sayacı'nı kullanın."], "id": ["Menuju Shafa. Saat mendekat, bacalah: Innash-Shafa wal-Marwata min sya'a'irillah… (sekali saja).", "Naik sedikit, menghadap Ka'bah, angkat tangan, berdzikir dan berdoa.", "Berjalan ke Marwah. Laki-laki berlari kecil di antara lampu hijau. Itu putaran pertama.", "Dari Marwah kembali ke Shafa adalah putaran kedua. Putaran ke-7 berakhir di Marwah.", "Wudhu dianjurkan tetapi tidak wajib untuk Sa'i. Gunakan Penghitung Sa'i."]}}, {"id": "hair", "duas": ["accept"], "title": {"en": "Shave or trim: Umrah complete", "ur": "حلق یا قصر: عمرہ مکمل", "hi": "हल्क़ या क़स्र: उमराह पूरा", "bn": "হলক বা কসর: উমরাহ সম্পন্ন", "tl": "Pag-ahit o paggupit: tapos ang Umrah", "tr": "Tıraş veya kısaltma: umre tamam", "id": "Cukur atau potong: Umrah selesai"}, "pts": {"en": ["Men shave the head (more rewarded) or trim hair evenly from all over the head.", "Women gather their hair and trim about a fingertip's length (around 2–3 cm) from the end.", "Your Umrah is complete. The restrictions of ihram are now lifted.", "Thank Allah, make dua for acceptance, and remember those who asked you to pray for them."], "ur": ["مرد سر منڈوائیں (زیادہ ثواب) یا پورے سر سے برابر بال کتروائیں۔", "خواتین بال اکٹھے کر کے سرے سے تقریباً انگلی کے پور کے برابر (2 سے 3 سینٹی میٹر) کاٹیں۔", "آپ کا عمرہ مکمل ہو گیا۔ احرام کی پابندیاں اب ختم ہو گئیں۔", "اللہ کا شکر ادا کریں، قبولیت کی دعا کریں اور جنہوں نے دعا کی درخواست کی تھی انہیں یاد رکھیں۔"], "hi": ["पुरुष सिर मुँडवाएँ (ज़्यादा सवाब) या पूरे सिर से बराबर बाल छोटे करवाएँ।", "महिलाएँ बाल इकट्ठा करके सिरे से लगभग उँगली के पोर जितने (2–3 सेमी) बाल काटें।", "आपका उमराह पूरा हुआ। एहराम की पाबंदियाँ अब ख़त्म हो गईं।", "अल्लाह का शुक्र अदा करें, क़बूलियत की दुआ करें और जिन्होंने दुआ के लिए कहा था उन्हें याद रखें।"], "bn": ["পুরুষরা মাথা মুণ্ডন করুন (বেশি সওয়াব) অথবা পুরো মাথা থেকে সমানভাবে চুল ছোট করুন।", "মহিলারা চুল একত্র করে শেষ প্রান্ত থেকে আঙুলের ডগা পরিমাণ (প্রায় ২–৩ সেমি) কাটুন।", "আপনার উমরাহ সম্পন্ন। ইহরামের বিধিনিষেধ এখন শেষ।", "আল্লাহর শুকরিয়া আদায় করুন, কবুলের দোয়া করুন এবং যারা দোয়া চেয়েছিলেন তাদের স্মরণ করুন।"], "tl": ["Ang mga lalaki ay magpaahit ng ulo (mas malaki ang gantimpala) o pantay na gupitin ang buhok sa buong ulo.", "Ang mga babae ay tipunin ang buhok at gupitin ang dulo nang kasinghaba ng dulo ng daliri (mga 2–3 cm).", "Tapos na ang iyong Umrah. Wala na ang mga pagbabawal ng ihram.", "Pasalamatan si Allah, mag-du'a para sa pagtanggap, at alalahanin ang mga humiling na ipagdasal sila."], "tr": ["Erkekler başlarını tıraş ettirir (sevabı daha fazla) veya saçlarını her yerden eşit kısaltır.", "Kadınlar saçlarını toplayıp uçtan yaklaşık bir parmak ucu kadar (2–3 cm) keser.", "Umreniz tamamlandı. İhram yasakları artık sona erdi.", "Allah'a şükredin, kabul için dua edin ve sizden dua isteyenleri hatırlayın."], "id": ["Laki-laki mencukur gundul (lebih utama) atau memendekkan rambut merata di seluruh kepala.", "Perempuan mengumpulkan rambut dan memotong ujungnya seujung jari (sekitar 2–3 cm).", "Umrah Anda selesai. Larangan ihram kini telah berakhir.", "Bersyukurlah kepada Allah, berdoalah agar diterima, dan ingatlah mereka yang meminta didoakan."]}}], "MADINAH": [{"title": {"en": "Visiting Masjid an-Nabawi", "ur": "مسجدِ نبوی کی زیارت", "hi": "मस्जिद-ए-नबवी की ज़ियारत", "bn": "মসজিদে নববী জিয়ারত", "tl": "Pagbisita sa Masjid an-Nabawi", "tr": "Mescid-i Nebevî ziyareti", "id": "Mengunjungi Masjid Nabawi"}, "duas": ["enter_masjid"], "pts": {"en": ["Visiting Madinah is not part of Umrah, but it is a beloved sunnah. Intend to visit the masjid of the Prophet ﷺ.", "A prayer in Masjid an-Nabawi is better than a thousand prayers elsewhere, except Masjid al-Haram (Sahih al-Bukhari).", "Enter with your right foot and the dua for entering the masjid, and pray 2 rak'ah to greet the masjid."], "ur": ["مدینہ کی زیارت عمرے کا حصہ نہیں، لیکن ایک محبوب سنت ہے۔ نبی ﷺ کی مسجد کی زیارت کی نیت کریں۔", "مسجدِ نبوی میں ایک نماز، مسجد الحرام کے سوا، دوسری جگہوں کی ہزار نمازوں سے بہتر ہے (صحیح بخاری)۔", "دایاں پاؤں پہلے رکھ کر داخلے کی دعا کے ساتھ داخل ہوں اور تحیۃ المسجد کی دو رکعت پڑھیں۔"], "hi": ["मदीना की ज़ियारत उमराह का हिस्सा नहीं, लेकिन एक प्यारी सुन्नत है। नबी ﷺ की मस्जिद की ज़ियारत की नीयत करें।", "मस्जिद-ए-नबवी में एक नमाज़, मस्जिद-अल-हराम के सिवा, दूसरी जगहों की हज़ार नमाज़ों से बेहतर है (सहीह बुख़ारी)।", "दायाँ पैर पहले रखकर दाख़िले की दुआ के साथ दाख़िल हों और तहिय्यतुल मस्जिद की दो रकअत पढ़ें।"], "bn": ["মদিনা জিয়ারত উমরাহর অংশ নয়, তবে এটি একটি প্রিয় সুন্নত। নবী ﷺ-এর মসজিদ জিয়ারতের নিয়ত করুন।", "মসজিদে নববীতে এক নামাজ, মসজিদুল হারাম ছাড়া, অন্য জায়গার হাজার নামাজের চেয়ে উত্তম (সহিহ বুখারি)।", "ডান পা আগে দিয়ে প্রবেশের দোয়া পড়ে ঢুকুন এবং তাহিয়্যাতুল মসজিদ দুই রাকাত পড়ুন।"], "tl": ["Ang pagbisita sa Madinah ay hindi bahagi ng Umrah, ngunit ito ay minamahal na sunnah. Magnais na bisitahin ang masjid ng Propeta ﷺ.", "Ang isang dasal sa Masjid an-Nabawi ay mas mainam kaysa isang libong dasal sa ibang lugar, maliban sa Masjid al-Haram (Sahih al-Bukhari).", "Pumasok gamit ang kanang paa at ang du'a sa pagpasok, at magdasal ng 2 rak'ah bilang pagbati sa masjid."], "tr": ["Medine ziyareti umrenin bir parçası değildir, ama sevilen bir sünnettir. Peygamber ﷺ'in mescidini ziyarete niyet edin.", "Mescid-i Nebevî'de kılınan bir namaz, Mescid-i Haram hariç, başka yerlerde kılınan bin namazdan daha hayırlıdır (Sahih-i Buhârî).", "Sağ ayağınızla ve giriş duasıyla girin, tahiyyetü'l-mescid için 2 rekât kılın."], "id": ["Ziarah Madinah bukan bagian dari Umrah, tetapi sunnah yang dicintai. Niatkan untuk mengunjungi masjid Nabi ﷺ.", "Shalat di Masjid Nabawi lebih baik daripada seribu shalat di tempat lain, kecuali Masjidil Haram (Sahih al-Bukhari).", "Masuk dengan kaki kanan dan doa masuk masjid, lalu shalat 2 rakaat tahiyatul masjid."]}}, {"title": {"en": "Giving salam to the Prophet ﷺ", "ur": "نبی ﷺ کو سلام", "hi": "नबी ﷺ को सलाम", "bn": "নবী ﷺ-কে সালাম", "tl": "Pagbati ng salam sa Propeta ﷺ", "tr": "Peygamber ﷺ'e selam", "id": "Memberi salam kepada Nabi ﷺ"}, "duas": ["salam_prophet", "salam_companions"], "pts": {"en": ["Follow the queue along the front of the masjid past the blessed grave. Keep moving and be gentle with others.", "Say salam calmly with a low voice. Then greet Abu Bakr (RA) and Umar (RA), who are buried beside him.", "To make dua, step away and face the qiblah."], "ur": ["مسجد کے سامنے والے حصے میں قطار کے ساتھ روضۂ مبارک کے پاس سے گزریں۔ چلتے رہیں اور دوسروں کے ساتھ نرمی کریں۔", "دھیمی آواز میں سکون سے سلام کہیں۔ پھر ابوبکر اور عمر رضی اللہ عنہما کو سلام کریں جو آپ ﷺ کے پہلو میں مدفون ہیں۔", "دعا کے لیے ایک طرف ہٹ کر قبلہ رخ ہو جائیں۔"], "hi": ["मस्जिद के सामने वाले हिस्से में क़तार के साथ रौज़ा-ए-मुबारक के पास से गुज़रें। चलते रहें और दूसरों के साथ नरमी बरतें।", "धीमी आवाज़ में सुकून से सलाम कहें। फिर अबू बक्र और उमर (र.) को सलाम करें जो आप ﷺ के पास दफ़्न हैं।", "दुआ के लिए एक तरफ़ हटकर क़िबला की ओर मुँह कर लें।"], "bn": ["মসজিদের সামনের দিকে সারি ধরে পবিত্র কবরের পাশ দিয়ে যান। চলতে থাকুন এবং অন্যদের সঙ্গে নম্র থাকুন।", "নিচু স্বরে শান্তভাবে সালাম দিন। তারপর আবু বকর ও উমর (রা.)-কে সালাম দিন, যাঁরা তাঁর পাশে শায়িত।", "দোয়া করতে একপাশে সরে কিবলামুখী হন।"], "tl": ["Sumunod sa pila sa harapang bahagi ng masjid habang dumaraan sa pinagpalang libingan. Patuloy na lumakad at maging mahinahon sa iba.", "Bumati ng salam nang mahinahon at mahina ang boses. Pagkatapos ay batiin sina Abu Bakr (RA) at Umar (RA) na nakalibing sa kanyang tabi.", "Para mag-du'a, lumayo nang kaunti at humarap sa qiblah."], "tr": ["Mescidin ön kısmındaki sırayla mübarek kabrin önünden geçin. Hareket hâlinde kalın ve başkalarına karşı nazik olun.", "Alçak bir sesle sakince selam verin. Ardından yanında medfun olan Hz. Ebû Bekir ve Hz. Ömer'e selam verin.", "Dua etmek için kenara çekilip kıbleye dönün."], "id": ["Ikuti antrean di bagian depan masjid melewati makam yang mulia. Terus berjalan dan bersikap lembut kepada orang lain.", "Ucapkan salam dengan tenang dan suara pelan. Lalu beri salam kepada Abu Bakar (RA) dan Umar (RA) yang dimakamkan di samping beliau.", "Untuk berdoa, menjauhlah sedikit dan menghadap kiblat."]}}, {"title": {"en": "Praying in the Rawdah", "ur": "ریاض الجنہ میں نماز", "hi": "रियाज़ुल जन्नह में नमाज़", "bn": "রিয়াজুল জান্নাতে নামাজ", "tl": "Pagdarasal sa Rawdah", "tr": "Ravza'da namaz", "id": "Shalat di Raudhah"}, "duas": [], "pts": {"en": ["The Rawdah is the area between the Prophet's ﷺ house and his minbar. He said it is \"a garden from the gardens of Paradise\" (Sahih al-Bukhari).", "Visits must be booked in advance through the Nusuk app. Men and women have separate times, and slots fill up quickly.", "Your time inside is short, so plan your duas beforehand."], "ur": ["ریاض الجنہ نبی ﷺ کے حجرے اور منبر کے درمیان کی جگہ ہے۔ آپ ﷺ نے فرمایا کہ یہ \"جنت کے باغوں میں سے ایک باغ\" ہے (صحیح بخاری)۔", "زیارت کی بکنگ نُسک ایپ کے ذریعے پہلے سے کرنی ہوتی ہے۔ مردوں اور خواتین کے اوقات الگ ہیں اور جگہیں جلد بھر جاتی ہیں۔", "اندر وقت کم ملتا ہے، اس لیے اپنی دعائیں پہلے سے سوچ لیں۔"], "hi": ["रियाज़ुल जन्नह नबी ﷺ के घर और मिंबर के बीच की जगह है। आप ﷺ ने फ़रमाया कि यह \"जन्नत के बाग़ों में से एक बाग़\" है (सहीह बुख़ारी)।", "ज़ियारत की बुकिंग नुसुक ऐप से पहले करनी होती है। पुरुषों और महिलाओं का समय अलग है और स्लॉट जल्दी भर जाते हैं।", "अंदर समय कम मिलता है, इसलिए अपनी दुआएँ पहले से सोच लें।"], "bn": ["রিয়াজুল জান্নাহ নবী ﷺ-এর ঘর ও মিম্বরের মাঝের স্থান। তিনি বলেছেন, এটি \"জান্নাতের বাগানসমূহের একটি বাগান\" (সহিহ বুখারি)।", "নুসুক অ্যাপে আগে থেকে বুকিং করতে হয়। পুরুষ ও মহিলাদের সময় আলাদা, এবং স্লট দ্রুত পূর্ণ হয়।", "ভেতরে সময় কম থাকে, তাই আগে থেকে দোয়া ঠিক করে রাখুন।"], "tl": ["Ang Rawdah ay ang lugar sa pagitan ng bahay ng Propeta ﷺ at ng kanyang minbar. Sinabi niya na ito ay \"isang hardin mula sa mga hardin ng Paraiso\" (Sahih al-Bukhari).", "Kailangang mag-book nang maaga sa Nusuk app. Magkaiba ang oras ng lalaki at babae, at mabilis maubos ang mga slot.", "Maikli ang oras sa loob, kaya ihanda ang mga du'a bago pumasok."], "tr": ["Ravza, Peygamber ﷺ'in evi ile minberi arasındaki alandır. O, burayı \"cennet bahçelerinden bir bahçe\" olarak nitelendirmiştir (Sahih-i Buhârî).", "Ziyaret için Nusuk uygulamasından önceden randevu alınmalıdır. Erkek ve kadınların saatleri ayrıdır ve yerler çabuk dolar.", "İçeride süre kısadır; dualarınızı önceden planlayın."], "id": ["Raudhah adalah area antara rumah Nabi ﷺ dan mimbarnya. Beliau bersabda tempat itu adalah \"taman dari taman-taman surga\" (Sahih al-Bukhari).", "Kunjungan harus dipesan terlebih dahulu melalui aplikasi Nusuk. Waktu laki-laki dan perempuan terpisah, dan slot cepat penuh.", "Waktu di dalam singkat, jadi siapkan doa Anda sebelumnya."]}}, {"title": {"en": "Quba, al-Baqi and Uhud", "ur": "قبا، بقیع اور احد", "hi": "क़ुबा, बक़ी और उहुद", "bn": "কুবা, বাকি ও উহুদ", "tl": "Quba, al-Baqi at Uhud", "tr": "Kuba, Bakî ve Uhud", "id": "Quba, Baqi, dan Uhud"}, "duas": ["graves"], "pts": {"en": ["Make wudu at your hotel and pray 2 rak'ah in Masjid Quba: the Prophet ﷺ said its reward is like that of an Umrah (Sunan Ibn Majah). He used to visit it every Saturday.", "Visit Jannat al-Baqi, usually open after Fajr and Asr, and recite the dua for visiting graves.", "Visit Mount Uhud and the martyrs of Uhud, including Hamzah (RA), the Prophet's ﷺ uncle. See Ziyarat for details."], "ur": ["ہوٹل سے وضو کر کے مسجدِ قبا میں دو رکعت پڑھیں: نبی ﷺ نے فرمایا اس کا ثواب عمرے کے برابر ہے (سنن ابن ماجہ)۔ آپ ﷺ ہر ہفتے کو وہاں تشریف لے جاتے تھے۔", "جنت البقیع کی زیارت کریں، جو عموماً فجر اور عصر کے بعد کھلتا ہے، اور قبرستان کی دعا پڑھیں۔", "جبلِ احد اور شہدائے احد کی زیارت کریں، جن میں نبی ﷺ کے چچا حمزہ رضی اللہ عنہ بھی ہیں۔ تفصیل زیارات میں دیکھیں۔"], "hi": ["होटल से वुज़ू करके मस्जिद-ए-क़ुबा में दो रकअत पढ़ें: नबी ﷺ ने फ़रमाया इसका सवाब उमराह के बराबर है (सुनन इब्न माजह)। आप ﷺ हर शनिवार वहाँ जाते थे।", "जन्नतुल बक़ी की ज़ियारत करें, जो आमतौर पर फ़ज्र और अस्र के बाद खुलता है, और क़ब्रिस्तान की दुआ पढ़ें।", "जबल-ए-उहुद और शुहदा-ए-उहुद की ज़ियारत करें, जिनमें नबी ﷺ के चाचा हमज़ा (र.) भी हैं। विवरण ज़ियारत में देखें।"], "bn": ["হোটেল থেকে অজু করে মসজিদে কুবায় দুই রাকাত পড়ুন: নবী ﷺ বলেছেন এর সওয়াব একটি উমরাহর মতো (সুনান ইবনে মাজাহ)। তিনি প্রতি শনিবার সেখানে যেতেন।", "জান্নাতুল বাকি জিয়ারত করুন, যা সাধারণত ফজর ও আসরের পর খোলা থাকে, এবং কবর জিয়ারতের দোয়া পড়ুন।", "উহুদ পাহাড় ও উহুদের শহীদদের জিয়ারত করুন, যাঁদের মধ্যে নবী ﷺ-এর চাচা হামজা (রা.) আছেন। বিস্তারিত জিয়ারত অংশে।"], "tl": ["Mag-wudu sa hotel at magdasal ng 2 rak'ah sa Masjid Quba: sinabi ng Propeta ﷺ na ang gantimpala nito ay gaya ng isang Umrah (Sunan Ibn Majah). Binibisita niya ito tuwing Sabado.", "Bisitahin ang Jannat al-Baqi, karaniwang bukas pagkatapos ng Fajr at Asr, at bigkasin ang du'a sa pagbisita sa libingan.", "Bisitahin ang Bundok Uhud at ang mga martir ng Uhud, kabilang si Hamzah (RA), ang tiyuhin ng Propeta ﷺ. Tingnan ang Ziyarat para sa detalye."], "tr": ["Otelinizde abdest alıp Kuba Mescidi'nde 2 rekât kılın: Peygamber ﷺ bunun sevabının bir umre gibi olduğunu bildirmiştir (Sünen-i İbn Mâce). O, her cumartesi buraya giderdi.", "Genellikle sabah ve ikindi namazlarından sonra açık olan Cennetü'l-Bakî'yi ziyaret edin ve kabir ziyareti duasını okuyun.", "Uhud Dağı'nı ve aralarında Peygamber ﷺ'in amcası Hz. Hamza'nın da bulunduğu Uhud şehitlerini ziyaret edin. Ayrıntılar Ziyaret Yerleri'nde."], "id": ["Berwudhu di hotel lalu shalat 2 rakaat di Masjid Quba: Nabi ﷺ bersabda pahalanya seperti Umrah (Sunan Ibnu Majah). Beliau biasa mengunjunginya setiap hari Sabtu.", "Kunjungi Jannatul Baqi, biasanya dibuka setelah Subuh dan Ashar, dan bacalah doa ziarah kubur.", "Kunjungi Gunung Uhud dan para syuhada Uhud, termasuk Hamzah (RA), paman Nabi ﷺ. Lihat Ziarah untuk detailnya."]}}], "ZIYARAT": [{"q": "Masjid al-Haram, Makkah", "ar": "الكعبة المشرفة والمسجد الحرام", "nm": {"en": "The Kaaba & Masjid al-Haram", "ur": "کعبہ اور مسجد الحرام", "hi": "काबा और मस्जिद-अल-हराम", "bn": "কাবা ও মসজিদুল হারাম", "tl": "Ang Kaaba at Masjid al-Haram", "tr": "Kâbe ve Mescid-i Haram", "id": "Ka'bah & Masjidil Haram"}, "sum": {"en": "The House of Allah and the qiblah for every Muslim's prayer, at the heart of the Sacred Mosque.", "ur": "اللہ کا گھر اور ہر مسلمان کی نماز کا قبلہ، مسجد الحرام کے بیچ میں۔", "hi": "अल्लाह का घर और हर मुसलमान की नमाज़ का क़िबला, मस्जिद-अल-हराम के बीच में।", "bn": "আল্লাহর ঘর এবং প্রত্যেক মুসলিমের নামাজের কিবলা, মসজিদুল হারামের কেন্দ্রে।", "tl": "Ang Bahay ni Allah at ang qiblah ng dasal ng bawat Muslim, sa gitna ng Banal na Masjid.", "tr": "Allah'ın evi ve her Müslümanın namazdaki kıblesi; Mescid-i Haram'ın kalbinde.", "id": "Rumah Allah dan kiblat shalat setiap Muslim, di jantung Masjidil Haram."}, "facts": {"en": ["The Qur'an describes Ibrahim and Ismail (peace be upon them) raising the foundations of the House (2:127).", "The Black Stone (al-Hajar al-Aswad) is set in the eastern corner, where each round of tawaf begins.", "The semi-circular wall beside th ng Maqam Ibrahim ay ang batong tinayuan ni Ibrahim (AS) habang itinatayo ang Kaaba; nakalagay ito sa salamin at gintong lalagyan."], "tr": ["Kur'an, Hz. İbrahim ve Hz. İsmail'in bu Evin temellerini yükselttiğini anlatır (2:127).", "Hacerü'l-Esved doğu köşededir; tavafın her şavtı buradan başlar.", "Kâbe'nin yanındaki yarım daire duvar (Hicr-i İsmail veya Hatîm), aslen Kâbe'nin parçası olan alanı gösterir. İçinde namaz kılmak Kâbe'nin içinde kılmak gibidir.", "Makam-ı İbrahim, Hz. İbrahim'in Kâbe'yi inşa ederken üzerinde durduğu taştır; cam ve altın bir muhafaza içindedir."], "id": ["Al-Qur'an mengisahkan Ibrahim dan Ismail (alaihimas salam) meninggikan fondasi Rumah ini (2:127).", "Hajar Aswad terpasang di sudut timur, tempat setiap putaran tawaf dimulai.", "Tembok setengah lingkaran di samping Ka'bah (Hijr Ismail atau Hathim) menandai area yang dulu bagian dari Ka'bah asli. Shalat di dalamnya seperti shalat di dalam Ka'bah.", "Maqam Ibrahim adalah batu pijakan Ibrahim (AS) saat membangun Ka'bah; disimpan dalam kotak kaca dan emas."]}, "tips": {"en": ["The mataf (tawaf area) is usually least crowded late at night and mid-morning.", "Zamzam water is available in coolers throughout the masjid."], "ur": ["مطاف (طواف کی جگہ) میں عموماً رات دیر گئے اور دوپہر سے پہلے رش کم ہوتا ہے۔", "پوری مسجد میں کولروں میں زمزم دستیاب ہے۔"], "hi": ["मताफ़ (तवाफ़ की जगह) में आमतौर पर देर रात और दोपहर से पहले भीड़ कम होती है।", "पूरी मस्जिद में कूलरों में ज़मज़म मिलता है।"], "bn": ["মাতাফে (তাওয়াফের স্থান) সাধারণত গভীর রাতে ও সকালের মাঝামাঝি ভিড় কম থাকে।", "পুরো মসজিদে কুলারে জমজম পাওয়া যায়।"], "tl": ["Karaniwang pinakakaunti ang tao sa mataf (lugar ng tawaf) sa hatinggabi at kalagitnaan ng umaga.", "May Zamzam sa mga cooler sa buong masjid."], "tr": ["Metaf (tavaf alanı) genellikle gece geç saatlerde ve kuşluk vaktinde daha az kalabalıktır.", "Zemzem, mescidin her yerindeki soğutucularda bulunur."], "id": ["Mataf (area tawaf) biasanya paling sepi larut malam dan pertengahan pagi.", a Mağarası'nda yalnız kalıp tefekkür ve ibadet ederdi.", "Cebrail ilk vahyi burada getirdi: \"Yaratan Rabbinin adıyla oku\" (96:1–5), yaklaşık MS 610'da.", "Mağaradan uzakta Mescid-i Haram görülebilir."], "id": ["Sebelum kenabian, Nabi ﷺ biasa menyendiri di Gua Hira untuk merenung dan beribadah.", "Di sinilah Jibril membawa wahyu pertama: \"Bacalah dengan nama Tuhanmu yang menciptakan\" (96:1–5), sekitar tahun 610 M.", "Dari gua, Masjidil Haram terlihat di kejauhan."]}, "tips": {"en": ["The climb is steep and takes most people around an hour each way. Go early or after Asr, wear good shoes and carry water.", "Climbing is not a ritual of Umrah; it is a visit for reflection only."], "ur": ["چڑھائی سخت ہے اور اکثر لوگوں کو ایک طرف تقریباً ایک گھنٹہ لگتا ہے۔ صبح سویرے یا عصر کے بعد جائیں، اچھے جوتے پہنیں اور پانی ساتھ رکھیں۔", "یہاں چڑھنا عمرے کا رکن نہیں؛ یہ صرف غور و فکر کے لیے زیارت ہے۔"], "hi": ["चढ़ाई कठिन है और ज़्यादातर लोगों को एक तरफ़ लगभग एक घंटा लगता है। सुबह जल्दी या अस्र के बाद जाएँ, अच्छे जूते पहनें और पानी रखें।", "यहाँ चढ़ना उमराह का हिस्सा नहीं; यह सिर्फ़ ग़ौर-ओ-फ़िक्र की ज़ियारत है।"], "bn": ["আরোহণ খাড়া, বেশিরভাগ মানুষের একদিকে প্রায় এক ঘণ্টা লাগে। ভোরে বা আসরের পর যান, ভালো জুতা পরুন ও পানি নিন।", "এখানে ওঠা উমরাহর কোনো রুকন নয়; এটি কেবল চিন্তার জন্য জিয়ারত।"], "tl": ["Matarik ang akyat at karaniwang isang oras bawat direksiyon. Pumunta nang maaga o pagkatapos ng Asr, magsuot ng magandang sapatos at magdala ng tubig.", "Ang pag-akyat ay hindi ritwal ng Umrah; pagbisita lamang ito para magnilay."], "tr": ["Tırmanış diktir ve çoğu kişi için gidiş-dönüş her biri yaklaşık bir saat sürer. Erken saatte veya ikindiden sonra gidin, iyi ayakkabı giyin ve su alın.", "Tırmanmak umrenin bir parçası değildir; sadece tefekkür için bir ziyarettir."], "id": ["Pendakiannya terjal, biasanya sekitar satu jam sekali jalan. Datang pagi-pagi atau setelah Ashar, pakai sepatu yang baik, dan bawa air.", "Mendaki bukan bagian dari ritual Umrah; hanya ziarah untuk merenung

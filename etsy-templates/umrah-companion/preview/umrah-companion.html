 Hijrah in 622 CE.", "He said: \"Whoever purifies himself in his house, then comes to Masjid Quba and prays in it, will have a reward like that of an Umrah\" (Sunan Ibn Majah).", "The Prophet ﷺ used to visit Quba every Saturday, riding or walking (Sahih al-Bukhari, Sahih Muslim)."], "ur": ["نبی ﷺ نے 622 عیسوی میں ہجرت کے دوران قبا پہنچ کر اس کی بنیاد رکھی۔", "آپ ﷺ نے فرمایا: \"جو اپنے گھر میں وضو کرے، پھر مسجدِ قبا آ کر نماز پڑھے، اسے عمرے جیسا ثواب ملے گا\" (سنن ابن ماجہ)۔", "نبی ﷺ ہر ہفتے کو سوار ہو کر یا پیدل قبا تشریف لے جاتے تھے (صحیح بخاری، صحیح مسلم)۔"], "hi": ["नबी ﷺ ने 622 ईस्वी में हिजरत के दौरान क़ुबा पहुँचकर इसकी बुनियाद रखी।", "आप ﷺ ने फ़रमाया: \"जो अपने घर में वुज़ू करे, फिर मस्जिद-ए-क़ुबा आकर नमाज़ पढ़े, उसे उमराह जैसा सवाब मिलेगा\" (सुनन इब्न माजह)।", "नबी ﷺ हर शनिवार सवारी पर या पैदल क़ुबा जाते थे (सहीह बुख़ारी, सहीह मुस्लिम)।"], "bn": ["নবী ﷺ ৬২২ খ্রিস্টাব্দে হিজরতের সময় কুবায় পৌঁছে এর ভিত্তি স্থাপন করেন।", "তিনি বলেছেন: \"যে নিজের ঘরে পবিত্র হয়ে মসজিদে কুবায় এসে নামাজ পড়ে, সে একটি উমরাহর মতো সওয়াব পাবে\" (সুনান ইবনে মাজাহ)।", "নবী ﷺ প্রতি শনিবার বাহনে বা হেঁটে কুবায় যেতেন (সহিহ বুখারি, সহিহ মুসলিম)।"], "tl": ["Inilatag ng Propeta ﷺ ang pundasyon nito pagdating niya sa Quba noong Hijrah, 622 CE.", "Sinabi niya: \"Sinumang maglinis ng sarili sa kanyang bahay, pagkatapos ay pumunta sa Masjid Quba at magdasal doon, ay magkakaroon ng gantimpala na tulad ng isang Umrah\" (Sunan Ibn Majah).", "Binibisita ng Propeta ﷺ ang Quba tuwing Sabado, nakasakay o naglalakad (Sahih al-Bukhari, Sahih Muslim)."], "tr": ["Peygamber ﷺ MS 622'de hicret sırasında Kuba'ya varınca temelini attı.", "Şöyle buyurdu: \"Kim evinde temizlenip sonra Kuba Mescidi'ne gelir ve orada namaz kılarsa, ona bir umre sevabı vardır\" (Sünen-i İbn Mâce).", "Peygamber ﷺ her cumartesi binekle veya yürüyerek Kuba'yı ziyaret ederdi (Buhârî, Müslim)."], "id": ["Nabi ﷺ meletakkan fondasinya saat tiba di Quba dalam perjalanan Hijrah, 622 M.", "Beliau bersabda: \"Barang siapa bersuci di rumahnya, lalu datang ke Masjid Quba dan shalat di dalamnya, baginya pahala seperti Umrah\" (Sunan Ibnu Majah).", "Nabi ﷺ biasa mengunjungi Quba setiap hari Sabtu, berkendara atau berjalan kaki (Bukhari, Muslim)."]}, "tips": {"en": ["Make wudu at your hotel before you go. It is about 3–4 km south of Masjid an-Nabawi, and there is a pleasant walking path."], "ur": ["جانے سے پہلے ہوٹل میں وضو کر لیں۔ یہ مسجدِ نبوی سے تقریباً 3–4 کلومیٹر جنوب میں ہے اور پیدل چلنے کا خوبصورت راستہ ہے۔"], "hi": ["जाने से पहले होटल में वुज़ू कर लें। यह मस्जिद-ए-नबवी से लगभग 3–4 किमी दक्षिण में है और पैदल चलने का सुंदर रास्ता है।"], "bn": ["যাওয়ার আগে হোটেলে অজু করে নিন। এটি মসজিদে নববী থেকে প্রায় ৩–৪ কিমি দক্ষিণে, হাঁটার সুন্দর পথ আছে।"], "tl": ["Mag-wudu sa hotel bago pumunta. Mga 3–4 km ito sa timog ng Masjid an-Nabawi, at may magandang daanan para maglakad."], "tr": ["Gitmeden önce otelde abdest alın. Mescid-i Nebevî'nin yaklaşık 3–4 km güneyindedir ve güzel bir yürüyüş yolu vardır."], "id": ["Berwudhulah di hotel sebelum berangkat. Lokasinya sekitar 3–4 km di selatan Masjid Nabawi, dengan jalur pejalan kaki yang nyaman."]}, "city": "madinah"}, {"q": "Masjid al-Qiblatain, Madinah", "ar": "مسجد القبلتين", "nm": {"en": "Masjid al-Qiblatain", "ur": "مسجدِ قبلتین", "hi": "मस्जिद-ए-क़िबलतैन", "bn": "মসজিদে কিবলাতাইন", "tl": "Masjid al-Qiblatain", "tr": "Kıbleteyn Mescidi", "id": "Masjid Qiblatain"}, "sum": {"en": "The \"Mosque of the Two Qiblahs\", where the direction of prayer changed from Jerusalem to Makkah.", "ur": "\"دو قبلوں والی مسجد\"، جہاں نماز کا رخ بیت المقدس سے مکہ کی طرف بدلا۔", "hi": "\"दो क़िबलों वाली मस्जिद\", जहाँ नमाज़ का रुख़ बैतुल मुक़द्दस से मक्का की तरफ़ बदला।", "bn": "\"দুই কিবলার মসজিদ\", যেখানে নামাজের দিক বায়তুল মুকাদ্দাস থেকে মক্কার দিকে পরিবর্তিত হয়।", "tl": "Ang \"Masjid ng Dalawang Qiblah\", kung saan nagbago ang direksiyon ng dasal mula Jerusalem patungong Makkah.", "tr": "\"İki Kıbleli Mescit\"; namazın yönü burada Kudüs'ten Mekke'ye çevrildi.", "id": "\"Masjid Dua Kiblat\", tempat arah shalat berubah dari Yerusalem ke Makkah."}, "facts": {"en": ["For around 16–17 months after the Hijrah, Muslims prayed facing Jerusalem.", "In 2 AH the verse came: \"So turn your face towards al-Masjid al-Haram\" (2:144), and the congregation turned to face Makkah during the prayer.", "For many years the mosque had two prayer niches; today it has one, facing Makkah."], "ur": ["ہجرت کے بعد تقریباً 16–17 مہینے مسلمان بیت المقدس کی طرف رخ کر کے نماز پڑھتے رہے۔", "2 ہجری میں آیت نازل ہوئی: \"اپنا چہرہ مسجد الحرام کی طرف پھیر لو\" (2:144)، اور جماعت نے نماز کے دوران ہی مکہ کی طرف رخ کر لیا۔", "کئی سال تک مسجد میں دو محراب تھے؛ آج ایک ہے، جو مکہ کی طرف ہے۔"], "hi": ["हिजरत के बाद लगभग 16–17 महीने मुसलमान बैतुल मुक़द्दस की तरफ़ रुख़ करके नमाज़ पढ़ते रहे।", "2 हिजरी में आयत नाज़िल हुई: \"अपना चेहरा मस्जिद-अल-हराम की तरफ़ फेर लो\" (2:144), और जमात ने नमाज़ के दौरान ही मक्का की तरफ़ रुख़ कर लिया।", "कई साल तक मस्जिद में दो मेहराब थे; आज एक है, जो मक्का की तरफ़ है।"], "bn": ["হিজরতের পর প্রায় ১৬–১৭ মাস মুসলিমরা বায়তুল মুকাদ্দাসের দিকে ফিরে নামাজ পড়তেন।", "২ হিজরিতে আয়াত নাযিল হয়: \"তোমার মুখ মসজিদুল হারামের দিকে ফেরাও\" (২:১৪৪), আর জামাত নামাজের মধ্যেই মক্কার দিকে ঘুরে যায়।", "বহু বছর মসজিদে দুটি মিহরাব ছিল; আজ একটি, মক্কার দিকে।"], "tl": ["Sa loob ng mga 16–17 buwan pagkatapos ng Hijrah, nagdarasal ang mga Muslim nang nakaharap sa Jerusalem.", "Noong 2 AH dumating ang talata: \"Kaya ibaling mo ang iyong mukha sa al-Masjid al-Haram\" (2:144), at humarap sa Makkah ang kongregasyon habang nagdarasal.", "Sa loob ng maraming taon may dalawang mihrab ang masjid; ngayon ay isa na lamang, nakaharap sa Makkah."], "tr": ["Hicretten sonra yaklaşık 16–17 ay boyunca Müslümanlar Kudüs'e yönelerek namaz kıldı.", "Hicri 2 yılında \"Yüzünü Mescid-i Haram tarafına çevir\" (2:144) ayeti geldi ve cemaat namaz esnasında Mekke'ye döndü.", "Mescidin uzun yıllar iki mihrabı vardı; bugün Mekke'ye bakan tek mihrabı vardır."], "id": ["Sekitar 16–17 bulan setelah Hijrah, : {"en": ["After staying in Quba, the Prophet ﷺ continued towards the city on a Friday and led the Jumu'ah prayer here, among the tribe of Banu Salim ibn Awf.", "It lies between Masjid Quba and Masjid an-Nabawi."], "ur": ["قبا میں قیام کے بعد نبی ﷺ جمعہ کے دن شہر کی طرف روانہ ہوئے اور بنو سالم بن عوف کے قبیلے میں یہاں جمعہ پڑھایا۔", "یہ مسجدِ قبا اور مسجدِ نبوی کے درمیان ہے۔"], "hi": ["क़ुबा में क़याम के बाद नबी ﷺ जुमा के दिन शहर की तरफ़ रवाना हुए और बनू सालिम बिन औफ़ क़बीले में यहाँ जुमा पढ़ाया।", "यह मस्जिद-ए-क़ुबा और मस्जिद-ए-नबवी के बीच है।"], "bn": ["কুবায় অবস্থানের পর নবী ﷺ এক শুক্রবার শহরের দিকে রওনা দেন এবং বনু সালিম ইবনে আওফ গোত্রের মাঝে এখানে জুমা পড়ান।", "এটি মসজিদে কুবা ও মসজিদে নববীর মাঝে অবস্থিত।"], "tl": ["Pagkatapos manatili sa Quba, nagpatuloy ang Propeta ﷺ patungong lungsod noong Biyernes at pinangunahan dito ang dasal ng Jumu'ah, sa tribo ng Banu Salim ibn Awf.", "Nasa pagitan ito ng Masjid Quba at Masjid an-Nabawi."], "tr": ["Kuba'da kaldıktan sonra Peygamber ﷺ bir cuma günü şehre doğru ilerledi ve Benî Sâlim b. Avf kabilesi arasında burada cuma namazı kıldırdı.", "Kuba Mescidi ile Mescid-i Nebevî arasındadır."], "id": ["Setelah tinggal di Quba, Nabi ﷺ melanjutkan perjalanan ke kota pada hari Jumat dan memimpin shalat Jumat di sini, di tengah kabilah Bani Salim bin Auf.", "Lokasinya di antara Masjid Quba dan Masjid Nabawi."]}, "tips": {"en": ["Easy to visit on the way back from Quba."], "ur": ["قبا سے واپسی پر آسانی سے جا سکتے ہیں۔"], "hi": ["क़ुबा से वापसी पर आसानी से जा सकते हैं।"], "bn": ["কুবা থেকে ফেরার পথে সহজেই যাওয়া যায়।"], "tl": ["Madaling bisitahin pauwi mula Quba."], "tr": ["Kuba dönüşünde kolayca ziyaret edilebilir."], "id": ["Mudah dikunjungi dalam perjalanan pulang dari Quba."]}, "city": "madinah"}, {"q": "Masjid al-Ijabah, Madinah", "ar": "مسجد الإجابة", "nm": {"en": "Masjid al-Ijabah", "ur": "مسجدِ اجابہ", "hi": "मस्जिद-ए-इजाबा", "bn": "মসজিদে ইজাবা", "tl": "Masjid al-Ijabah", "tr": "İcâbe Mescidi", "id": "Masjid Ijabah"}, "sum": {"en": "The \"Mosque of the Answer\", where the Prophet ﷺ made three duas for his ummah.", "ur": "\"قبولیت والی مسجد\"، جہاں نبی ﷺ نے اپنی امت کے لیے تین دعائیں کیں۔", "hi": "\"क़बूलियत वाली मस्जिद\", जहाँ नबी ﷺ ने अपनी उम्मत के लिए तीन दुआएँ कीं।", "bn": "\"কবুলের মসজিদ\", যেখানে নবী ﷺ তাঁর উম্মতের জন্য তিনটি দোয়া করেছিলেন।", "tl": "Ang \"Masjid ng Sagot\", kung saan nag-du'a ang Propeta ﷺ ng tatlong bagay para sa kanyang ummah.", "tr": "\"Duanın Kabul Edildiği Mescit\"; Peygamber ﷺ burada ümmeti için üç dua etti.", "id": "\"Masjid Pengabulan\", tempat Nabi ﷺ memanjatkan tiga doa untuk umatnya."}, "facts": {"en": ["It is also called Masjid Bani Mu'awiyah, after the clan of the Ansar who lived here.", "The Prophet ﷺ prayed here and made three duas: that his ummah would not be destroyed by famine, nor by drowning, and that they would not fight among themselves. The first two were granted and the third was not (Sahih Muslim).", "It is about 500 m north-east of Masjid an-Nabawi, near al-Baqi."], "ur": ["اسے مسجد بنی معاویہ بھی کہتے ہیں، انصار کے اس قبیلے کے نام پر جو یہاں رہتا تھا۔", "نبی ﷺ نے یہاں نماز پڑھی اور تین دعائیں کیں: کہ امت قحط سے ہلاک نہ ہو، نہ غرق ہو کر، اور وہ آپس میں نہ لڑیں۔ پہلی دو قبول ہوئیں اور تیسری نہیں (صحیح مسلم)۔", "یہ مسجدِ نبوی سے تقریباً 500 میٹر شمال مشرق میں، بقیع کے قریب ہے۔"], "hi": ["इसे मस्जिद बनी मुआविया भी कहते हैं, अंसार के उस क़बीले के नाम पर जो यहाँ रहता था।", "नबी ﷺ ने यहाँ नमाज़ पढ़ी और तीन दुआएँ कीं: कि उम्मत अकाल से हलाक न हो, न डूबकर, और वे आपस में न लड़ें। पहली दो क़बूल हुईं और तीसरी नहीं (सहीह मुस्लिम)।", "यह मस्जिद-ए-नबवी से लगभग 500 मीटर उत्तर-पूर्व में, बक़ी के पास है।"], "bn": ["একে মসজিদে বনি মুআবিয়াও বলা হয়, এখানে বসবাসকারী আনসার গোত্রের নামে।", "নবী ﷺ এখানে নামাজ পড়ে তিনটি দোয়া করেন: উম্মত যেন দুর্ভিক্ষে ধ্বংস না হয়, ডুবে না যায়, এবং নিজেদের মধ্যে যুদ্ধ না করে। প্রথম দুটি কবুল হয়, তৃতীয়টি হয়নি (সহিহ মুসলিম)।", "এটি মসজিদে নববী থেকে প্রায় ৫০০ মিটার উত্তর-পূর্বে, বাকির কাছে।"], "tl": ["Tinatawag din itong Masjid Bani Mu'awiyah, mula sa angkan ng Ansar na nanirahan dito.", "Nagdasal dito ang Propeta ﷺ at nag-du'a ng tatlong bagay: na hindi mapuksa ang kanyang ummah sa taggutom, ni sa pagkalunod, at na hindi sila mag-away-away. Ipinagkaloob ang unang dalawa ngunit hindi ang ikatlo (Sahih Muslim).", "Mga 500 m ito sa hilagang-silangan ng Masjid an-Nabawi, malapit sa al-Baqi."], "tr": ["Burada yaşayan Ensar kabilesinden dolayı Benî Muâviye Mescidi olarak da bilinir.", "Peygamber ﷺ burada namaz kılıp üç dua etti: ümmetinin kıtlıkla ve suda boğularak helak olmaması ve birbirleriyle savaşmamaları. İlk ikisi kabul edildi, üçüncüsü edilmedi (Sahîh-i Müslim).", "Mescid-i Nebevî'nin yaklaşık 500 m kuzeydoğusunda, Bakî yakınındadır."], "id": ["Disebut juga Masjid Bani Mu'awiyah, dari kabilah Anshar yang tinggal di sini.", "Nabi ﷺ shalat di sini dan memanjatkan tiga doa: agar umatnya tidak dibinasakan oleh paceklik, tidak oleh tenggelam, dan agar mereka tidak saling berperang. Dua yang pertama dikabulkan, yang ketiga tidak (Shahih Muslim).", "Lokasinya sekitar 500 m di timur laut Masjid Nabawi, dekat Baqi."]}, "tips": {"en": ["An easy walk after visiting al-Baqi. Pray two rak'ahs and make your own duas."], "ur": ["بقیع کی زیارت کے بعد آسانی سے پیدل جا سکتے ہیں۔ دو رکعت پڑھیں اور اپنی دعائیں مانگیں۔"], "hi": ["बक़ी की ज़ियारत के बाद आसानी से पैदल जा सकते हैं। दो रकअत पढ़ें और अपनी दुआएँ माँगें।"], "bn": ["বাকি জিয়ারতের পর সহজেই হেঁটে যাওয়া যায়। দুই রাকাত পড়ুন ও নিজের দোয়া করুন।"], "tl": ["Madaling lakarin pagkatapos bumisita sa al-Baqi. Magdasal ng dalawang rak'ah at mag-du'a."], "tr": ["Bakî ziyaretinden sonra kolayca yürünür. İki rekât kılın ve kendi dualarınızı edin."], "id": ["Mudah dijangkau jalan kaki setelah ziarah ke Baqi. Shalatlah dua rakaat dan panjatkan doa Anda."]}, "city": "madinah"}, {"q": "Saqifah Bani Saidah, Madinah", "ar": "سقيفة بني ساعدة", "nm": {"en": "Saqifah Bani Sa'idah", "ur": "سقیفہ بنی ساعدہ", "hi": "सक़ीफ़ा बनी साइदा", "bn": "সাকিফা বনি সাইদা", "tl": "Saqifah Bani Sa'idah", "tr": "Benî Sâide Sakîfesi", "id": "Saqifah Bani Sa'idah"}, "sum": {"en": "The site where Abu Bakr (RA) was chosen as the first caliph after the Prophet ﷺ passed away.", "ur": "وہ جگہ جہاں نبی ﷺ کی وفات کے بعد ابوبکر رضی اللہ عنہ کو پہلا خلیفہ چنا گیا۔", "hi": "वह जगह जहाँ नबी ﷺ की वफ़ात के बाद अबू बक्र (र.) को पहला ख़लीफ़ा चुना गया।", "bn": "যে স্থানে নবী ﷺ-এর ওফাতের পর আবু বকর (রা.)-কে প্রথম খলিফা নির্বাচিত করা হয়।", "tl": "Ang lugar kung saan pinili si Abu Bakr (RA) bilang unang caliph pagkapanaw ng Propeta ﷺ.", "tr": "Peygamber ﷺ'in vefatından sonra Hz. Ebû Bekir'in ilk halife seçildiği yer.", "id": "Tempat Abu Bakar (RA) dipilih sebagai khalifah pertama setelah Nabi ﷺ wafat."}, "facts": {"en": ["A saqifah is a covered shelter. This one belonged to the Banu Sa'idah clan of the Ansar and was used for meetings.", "In 11 AH (632 CE), after the Prophet ﷺ passed away, the Muhajirun and Ansar gathered here and gave their pledge to Abu Bakr (RA) (Sahih al-Bukhari).", "Today the site is a small garden with a simple shelter, just north-west of Masjid an-Nabawi."], "ur": ["سقیفہ چھت والی بیٹھک کو کہتے ہیں۔ یہ انصار کے قبیلے بنو ساعدہ کی تھی اور مشورے کے لیے استعمال ہوتی تھی۔", "11 ہجری (632 عیسوی) میں نبی ﷺ کی وفات کے بعد مہاجرین اور انصار یہاں جمع ہوئے اور ابوبکر رضی اللہ عنہ کے ہاتھ پر بیعت کی (صحیح بخاری)۔", "آج یہ جگہ ایک چھوٹا باغ ہے جس میں سادہ سائبان ہے، مسجدِ نبوی کے بالکل شمال مغرب میں۔"], "hi": ["सक़ीफ़ा छत वाली बैठक को कहते हैं। यह अंसार के क़बीले बनू साइदा की थी और मशवरे के लिए इस्तेमाल होती थी।", "11 हिजरी (632 ईस्वी) में नबी ﷺ की वफ़ात के बाद मुहाजिरीन और अंसार यहाँ जमा हुए और अबू बक्र (र.) के हाथ पर बैअत की (सहीह बुख़ारी)।", "आज यह जगह एक छोटा बाग़ है जिसमें सादा छप्पर है, मस्जिद-ए-नबवी के ठीक उत्तर-पश्चिम में।"], "bn": ["সাকিফা মানে ছাদওয়ালা বৈঠকখানা। এটি আনসারদের বনু সাইদা গোত্রের ছিল এবং পরামর্শের জন্য ব্যবহৃত হতো।", "১১ হিজরিতে (৬৩২ খ্রিস্টাব্দ) নবী ﷺ-এর ওফাতের পর মুহাজির ও আনসাররা এখানে সমবেত হয়ে আবু বকর (রা.)-এর হাতে বায়আত দেন (সহিহ বুখারি)।", "আজ স্থানটি একটি ছোট বাগান, সাধারণ ছাউনিসহ, মসজিদে নববীর ঠিক উত্তর-পশ্চিমে।"], "tl": ["Ang saqifah ay isang may-bubong na silungan. Pag-aari ito ng angkang Banu Sa'idah ng Ansar at ginagamit para sa mga pulong.", "Noong 11 AH (632 CE), pagkapanaw ng Propeta ﷺ, nagtipon dito ang Muhajirun at Ansar at nangako ng katapatan kay Abu Bakr (RA) (Sahih al-Bukhari).", "Ngayon ay maliit na hardin ito na may simpleng silungan, sa hilagang-kanluran lamang ng Masjid an-Nabawi."], "tr": ["Sakîfe, üstü örtülü gölgeliktir. Bu sakîfe Ensar'dan Benî Sâide kabilesine aitti ve toplantılar için kullanılırdı.", "Hicri 11 (MS 632) yılında Peygamber ﷺ vefat edince Muhacirler ve Ensar burada toplanıp Hz. Ebû Bekir'e biat etti (Sahîh-i Buhârî).", "Bugün burası, Mescid-i Nebevî'nin hemen kuzeybatısında sade bir gölgelikli küçük bir bahçedir."], "id": ["Saqifah adalah balai beratap. Saqifah ini milik kabilah Bani Sa'idah dari Anshar dan dipakai untuk bermusyawarah.", "Pada 11 H (632 M), setelah Nabi ﷺ wafat, kaum Muhajirin dan Anshar berkumpul di sini dan membaiat Abu Bakar (RA) (Shahih al-Bukhari).", "Kini lokasinya berupa taman kecil dengan naungan sederhana, tepat di barat laut Masjid Nabawi."]}, "tips": {"en": ["A few minutes' walk from the Haram's north-west gates. There is little to see, but it is a moving place to remember early Islamic history."], "ur": ["حرم کے شمال مغربی دروازوں سے چند منٹ پیدل۔ دیکھنے کو کم ہے، مگر ابتدائی اسلامی تاریخ یاد کرنے کے لیے دل کو چھو لینے والی جگہ ہے۔"], "hi": ["हरम के उत्तर-पश्चिमी दरवाज़ों से कुछ मिनट पैदल। देखने को कम है, मगर शुरुआती इस्लामी तारीख़ याद करने के लिए दिल छू लेने वाली जगह है।"], "bn": ["হারামের উত্তর-পশ্চিম গেট থেকে কয়েক মিনিট হাঁটা। দেখার মতো কম, তবে ইসলামের প্রথম যুগের ইতিহাস স্মরণে হৃদয়স্পর্শী স্থান।"], "tl": ["Ilang minutong lakad mula sa hilagang-kanlurang tarangkahan ng Haram. Kaunti ang makikita, ngunit nakaaantig na lugar upang alalahanin ang maagang kasaysayan ng Islam."], "tr": ["Harem'in kuzeybatı kap   const ids = kind === "tawaf" ? ["start_round", "rabbana"] : ["on_hills", "green_lights"];
  let dir = "";
  if (kind === "sai" && !fin) { const from = n % 2 === 0 ? "safa" : "marwah", to = n % 2 === 0 ? "marwah" : "safa"; dir = `<div class="dir">${esc(t("now_walk"))}: ${esc(t(from))} <span>→</span> ${esc(t(to))}</div>`; }
  return `<div class="top"><div><h1>${esc(t(kind))}</h1><p>${esc(t(kind === "tawaf" ? "tap_round" : "tap_lap"))}</p></div></div>
  <div class="counter"><div class="card dial">${dialSvg(n)}<div class="lbl">${fin ? "✓ " + esc(t("done")) : `${esc(t(kind === "tawaf" ? "round" : "lap"))} ${n + 1} / 7`}</div>${dir}
    ${fin ? `<div class="done-msg">${esc(t(kind === "tawaf" ? "tawaf_done" : "sai_done"))}</div>` : `<button class="tap" data-a="count" data-k="${kind}">✓ ${esc(t(kind === "tawaf" ? "round" : "lap"))} ${n + 1}</button>`}
    <div class="row" style="justify-content:center"><button class="btn ghost sm" data-a="undo" data-k="${kind}" ${n ? "" : "disabled"}>↶ ${esc(t("undo"))}</button><button class="btn ghost sm" data-a="resetCount" data-k="${kind}">${esc(t("reset"))}</button></div></div>
   <div class="grid">${(kind === "sai" && n === 0 ? ["safa_ayah", ...ids] : ids).map(id => duaCard(dua(id))).join("")}</div></div>`;
}
function vDuas(){
  const list = DUAS.filter(d => (dcat === "all" || (dcat === "fav" ? S.fav.includes(d.id) : d.cat === dcat)) &&
    (!dq || (L(d.title) + " " + d.title.en + " " + d.tr_ + " " + Object.values(d.pr || {}).join(" ") + " " + L(d.m) + " " + d.ar).toLowerCase().includes(dq.toLowerCase())));
  return `<div class="top"><div><h1>${esc(t("duas"))}</h1></div></div>
  <div class="row" style="margin-bottom:12px"><input id="dq" class="inp" placeholder="${esc(t("search"))}" value="${esc(dq)}" data-f="dq" style="max-width:420px"></div>
  <div class="chips" style="margin-bottom:16px"><button class="chip ${dcat === "all" ? "on" : ""}" data-a="cat" data-c="all">${esc(t("all"))}</button><button class="chip ${dcat === "fav" ? "on" : ""}" data-a="cat" data-c="fav">★ ${esc(t("favourites"))}</button>${Object.keys(CATS).map(c => `<button class="chip ${dcat === c ? "on" : ""}" data-a="cat" data-c="${c}">${esc(L(CATS[c]))}</button>`).join("")}</div>
  <div class="grid g2">${list.map(d => duaCard(d)).join("") || `<div class="card" style="color:var(--mute)">—</div>`}</div>`;
}
function vMadinah(){
  return `<div class="top"><div><h1>${esc(t("madinah"))}</h1><p>${esc(t("scholar"))}</p></div><button class="btn gold" data-a="zcity" data-c="madinah">📍 ${esc(t("ziyarat"))}</button></div>
  <div class="grid g2">${MADINAH.map((s, si) => DEMO && si > 0 ? lockCard(L(s.title), "") : `<div class="card"><h3>${esc(L(s.title))}</h3><ul class="plist">${L(s.pts).map(p => `<li>${esc(p)}</li>`).join("")}</ul>${duaChips(s.duas)}</div>`).join("")}</div>`;
}
function vZiyarat(){
  const list = ZIYARAT.filter(z => z.city === zcity);
  return `<div class="top"><div><h1>${esc(t("ziyarat"))}</h1></div>
   <div class="chips"><button class="chip ${zcity === "makkah" ? "on" : ""}" data-a="zcity" data-c="makkah">🕋 ${esc(t("makkah"))}</button><button class="chip ${zcity === "madinah" ? "on" : ""}" data-a="zcity" data-c="madinah">🕌 ${esc(t("madinah_c"))}</button></div></div>
  <div class="grid g2">${list.map((z, zi) => DEMO && zi > 1 ? lockCard(L(z.nm), L(z.sum)) : `<div class="card zcard"><div class="arn" lang="ar">${esc(z.ar)}</div><h3 style="margin-top:4px">${esc(L(z.nm))}</h3><p style="margin:6px 0 0">${esc(L(z.sum))}</p>
   <h4>${esc(t("facts"))}</h4><ul class="plist">${L(z.facts).map(f => `<li>${esc(f)}</li>`).join("")}</ul>
   <h4>${esc(t("tips"))}</h4><ul class="plist">${L(z.tips).map(f => `<li>${esc(f)}</li>`).join("")}</ul>
   <a class="btn sm ghost" style="margin-top:12px" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(z.q)}" target="_blank" rel="noopener">🗺️ ${esc(t("open_maps"))}</a></div>`).join("")}</div>`;
}
function vPhrases(){
  const list = PHRASES.filter(p => pcat === "all" || p.cat === pcat);
  return `<div class="top"><div><h1>${esc(t("phrases"))}</h1><p>${esc(t("phrases_sub"))}</p></div></div>
  <div class="chips" style="margin-bottom:16px"><button class="chip ${pcat === "all" ? "on" : ""}" data-a="pcat" data-c="all">${esc(t("all"))}</button>${Object.keys(PCATS).map(c => `<button class="chip ${pcat === c ? "on" : ""}" data-a="pcat" data-c="${c}">${esc(L(PCATS[c]))}</button>`).join("")}<button class="chip ${pcat === "num" ? "on" : ""}" data-a="pcat" data-c="num">${esc(t("numbers"))}</button></div>
  ${pcat === "help" || pcat === "all" ? `<div class="notice" style="margin-bottom:16px">🚑 ${esc(t("emergency"))}</div>` : ""}
  ${pcat === "all" || pcat === "num" ? `<div class="card" style="margin-bottom:16px"><h3>${esc(t("numbers"))}</h3><p style="color:var(--mute);margin:4px 0 12px">${esc(t("numbers_note"))}</p>
   <div class="nums">${NUMBERS.map(([d, w, tr], i) => `<div class="ntile"><b lang="ar">${d}</b><span class="nw" lang="ar">${esc(w)}</span><small>${i} · ${esc(tr)}</small></div>`).join("")}</div></div>` : ""}
  ${pcat === "num" ? "" : `<div class="grid g2">${list.map(p => DEMO && p.cat !== "greet" ? lockCard(p.ar + "  ·  " + L(p.m), "") : `<div class="card dua phrase"><span class="pill">${esc(L(PCATS[p.cat]))}</span>
   <div class="ar" lang="ar">${esc(p.ar)}</div>${prn(p)}
   ${p.f ? `<div class="fem"><span>♀ ${esc(t("to_woman"))}</span>${prn(p, 1)}</div>` : ""}
   <div class="mn">${esc(L(p.m))}</div>${lang() !== "en" && S.english ? `<div class="en">${esc(p.m.en)}</div>` : ""}</div>`).join("")}</div>`}`;
}
function vChecklist(){
  const all = CHECK.flatMap((c, ci) => c.items.map((_, ii) => `${ci}-${ii}`)).concat(S.custom.map((_, i) => `c-${i}`)), done = all.filter(k => S.chk[k]).length;
  return `<div class="top"><div><h1>${esc(t("checklist_t"))}</h1><p>${done} / ${all.length} ${esc(t("items_done"))}</p></div></div>
  <div class="card" style="margin-bottom:16px"><div class="bar"><i style="width:${all.length ? done / all.length * 100 : 0}%"></i></div></div>
  <div class="grid g2">${CHECK.map((c, ci) => `<div class="card"><h3>${esc(L(c.cat))}</h3>${c.items.map((it, ii) => { const k = `${ci}-${ii}`, on = !!S.chk[k];
     return `<div class="it ${on ? "on" : ""}"><button class="chk ${on ? "on" : ""}" data-a="chk" data-k="${k}" aria-pressed="${on}">${on ? "✓" : ""}</button><span>${esc(L(it))}</span></div>`; }).join("")}</div>`).join("")}
   <div class="card"><h3>${esc(t("add_item"))}</h3>${S.custom.map((it, i) => { const k = `c-${i}`, on = !!S.chk[k]; return `<div class="it ${on ? "on" : ""}"><button class="chk ${on ? "on" : ""}" data-a="chk" data-k="${k}">${on ? "✓" : ""}</button><span>${esc(it)}</span></div>`; }).join("")}
    <div class="row" style="margin-top:10px"><input id="newItem" class="inp" placeholder="${esc(t("add_item"))}"><button class="btn sm" data-a="addItem">${esc(t("add"))}</button></div></div></div>`;
}
function vSettings(){
  return `<div class="top"><div><h1>${esc(t("settings"))}</h1></div></div>${unlockBox()}<div class="grid g2">
   <div class="card"><h3>${esc(t("language"))}</h3><div class="chips langpick">${LANGS.map(([c, n]) => `<button class="chip ${lang() === c ? "on" : ""}" data-a="lang" data-l="${c}">${esc(n)}</button>`).join("")}</div>
    <h3 style="margin-top:20px">${esc(t("theme"))}</h3><div class="chips">${["auto","light","dark"].map(m => `<button class="chip ${S.theme === m ? "on" : ""}" data-a="theme" data-m="${m}">${esc(t(m))}</button>`).join("")}</div></div>
   <div class="card"><h3>${esc(t("duas"))}</h3><label class="k" for="arSize">${esc(t("arabic_size"))}</label><input id="arSize" type="range" min="22" max="44" value="${S.ar}" data-set="ar" style="width:100%;accent-color:var(--emerald)">
    <div class="dua"><div class="ar" lang="ar">رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً</div></div>
    <label class="row" style="margin-top:8px;cursor:pointer"><input type="checkbox" id="optTr" data-tog="translit" ${S.translit ? "checked" : ""}> ${esc(t("show_translit"))}</label>
    <label class="row" style="margin-top:8px;cursor:pointer"><input type="checkbox" id="optEn" data-tog="english" ${S.english ? "checked" : ""}> ${esc(t("show_english"))}</label></div>
   <div class="card"><div class="notice">${esc(t("scholar"))}</div>
    <button class="btn ghost sm" style="margin-top:14px;color:var(--warn)" data-a="resetAll">${esc(t("reset_all"))}</button></div></div>`;
}
const V = {home:vHome, steps:vSteps, tawaf:() => counterView("tawaf"), sai:() => counterView("sai"), duas:vDuas, madinah:vMadinah, ziyarat:vZiyarat, phrases:vPhrases, checklist:vChecklist, settings:vSettings};
const ICON = `<svg width="38" height="38" viewBox="0 0 100 100" aria-hidden="true"><rect x="2" y="2" width="96" height="96" rx="24" fill="var(--emerald)"/><g transform="translate(50 50)"><rect x="-22" y="-22" width="44" height="44" fill="none" stroke="#DDB94E" stroke-width="5"/><rect x="-22" y="-22" width="44" height="44" fill="none" stroke="#DDB94E" stroke-width="5" transform="rotate(45)"/><rect x="-11" y="-12" width="22" height="26" rx="2" fill="#1E1C18"/><rect x="-11" y="-5" width="22" height="4" fill="#DDB94E"/></g></svg>`;

function render(){
  const ld = LANGS.find(x => x[0] === lang());
  document.documentElement.lang = lang(); document.documentElement.dir = ld ? ld[2] : "ltr";
  if (S.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = S.theme;
  document.documentElement.style.setProperty("--ar-size", S.ar + "px");
  const nav = VIEWS.map(([k, ic, lab]) => `<a class="${view === k ? "on" : ""}" data-v="${k}" tabindex="0"><span class="ic">${ic}</span>${esc(t(lab))}</a>`).join("");
  document.getElementById("root").innerHTML = `<div class="app"><nav class="side"><div class="brand">${ICON}<div><b>Umrah Companion</b><small>THE GEEK NEXT DOOR CO.</small></div></div><div class="nav">${nav}</div></nav>
   <main>${DEMO ? `<div class="demobar"><span>🌙 ${esc(t("demo_bar"))}</span><span class="row" style="gap:8px">${MODE === "web" ? `<button class="btn sm ghost" data-v="settings">${esc(t("have_code"))}</button>` : ""}${getFull()}</span></div>` : ""}${V[view]()}<div class="foot">${esc(t("made_by"))}</div></main></div><div class="tabs-m">${VIEWS.map(([k, ic, lab]) => `<a class="${view === k ? "on" : ""}" data-v="${k}"><span>${ic}</span>${esc(t(lab))}</a>`).join("")}</div>`;
  if (!S.lang) langPicker();
}
function langPicker(){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" style="text-align:center"><div style="display:flex;justify-content:center">${ICON}</div><div class="salam" lang="ar" style="font-family:var(--f-ar);font-size:28px;color:var(--gold);margin-top:8px">السَّلَامُ عَلَيْكُمْ</div>
   <h2 style="margin:6px 0 4px">Umrah Companion</h2><p style="color:var(--mute);margin:0 0 16px">Choose your language · اپنی زبان منتخب کریں · अपनी भाषा चुनें · ভাষা নির্বাচন করুন · Pumili ng wika · Dil seçin · Pilih bahasa</p>
   <div class="chips langpick" style="justify-content:center">${LANGS.map(([c, n]) => `<button class="chip" data-pick="${c}">${esc(n)}</button>`).join("")}</div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => { const c = e.target.dataset.pick; if (c) { S.lang = c; save(); bg.remove(); render(); } });
}
function openDua(id){ const bg = document.createElement("div"); bg.className = "modal-bg"; bg.innerHTML = `<div class="modal">${duaCard(dua(id))}<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-x="1">${esc(t("done"))}</button></div></div>`;
  document.body.appendChild(bg); bg.addEventListener("click", e => { if (e.target === bg || e.target.dataset.x) bg.remove(); if (e.target.dataset.a === "fav") { toggleFav(e.target.dataset.id); bg.remove(); openDua(id); } }); }
function toggleFav(id){ S.fav = S.fav.includes(id) ? S.fav.filter(x => x !== id) : [...S.fav, id]; save(); }

document.addEventListener("click", async e => {
  const v = e.target.closest("[data-v]"); if (v && !e.target.closest(".modal")) { view = v.dataset.v; render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest("[data-a]"); if (!a || e.target.closest(".modal")) return; const act = a.dataset.a;
  if (act === "lang") { S.lang = a.dataset.l; save(); render(); }
  if (act === "openDua") openDua(a.dataset.id);
  if (act === "fav") { toggleFav(a.dataset.id); render(); }
  if (act === "toggleStep") { S.done[a.dataset.id] = !S.done[a.dataset.id]; save(); render(); }
  if (act === "count") { const k = a.dataset.k; if (S[k] < 7) { S[k]++; buzz(); save(); render(); if (S[k] === 7) { S.done[k] = true; save(); render(); } } }
  if (act === "undo") { const k = a.dataset.k; if (S[k] > 0) { S[k]--; S.done[k] = false; save(); render(); } }
  if (act === "resetCount") { const k = a.dataset.k; S[k] = 0; S.done[k] = false; save(); render(); }
  if (act === "cat") { dcat = a.dataset.c; render(); }
  if (act === "zcity") { zcity = a.dataset.c; view = "ziyarat"; render(); window.scrollTo(0, 0); }
  if (act === "unlockCode") { const c = (document.getElementById("code").value || "").trim().toUpperCase(); if (!c) return;
    if (await sha256(c) === CODE_HASH) { try { localStorage.setItem("umrah-licence", CODE_HASH); } catch(e) {} location.reload(); } else toast(t("code_bad")); }
  if (act === "pcat") { pcat = a.dataset.c; render(); }
  if (act === "chk") { S.chk[a.dataset.k] = !S.chk[a.dataset.k]; save(); render(); }
  if (act === "addItem") { const i = document.getElementById("newItem"), val = i.value.trim(); if (val) { S.custom.push(val); save(); render(); } }
  if (act === "theme") { S.theme = a.dataset.m; save(); render(); }
  if (act === "resetAll") { if (await ask(t("reset_q"))) { S.done = {}; S.tawaf = 0; S.sai = 0; S.chk = {}; save(); render(); } }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches?.(".nav a,[data-v][tabindex]")) e.target.click(); if (e.key === "Enter" && e.target.id === "code") document.querySelector('[data-a="unlockCode"]').click(); if (e.key === "Enter" && e.target.id === "newItem") document.querySelector('[data-a="addItem"]').click(); });
document.addEventListener("input", e => { const el = e.target;
  if (el.dataset.f === "dq") { dq = el.value; const pos = el.selectionStart; render(); const n = document.getElementById("dq"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  if (el.dataset.set === "ar") { S.ar = +el.value; save(); document.documentElement.style.setProperty("--ar-size", S.ar + "px"); }
  if (el.dataset.set === "date") { S.date = el.value; save(); }
});
document.addEventListener("change", e => { const el = e.target;
  if (el.dataset.set === "date") { S.date = el.value; save(); render(); }
  if (el.dataset.tog) { S[el.dataset.tog] = el.checked; save(); }
});
render();
</script>
